sk or prompt fit; outputs need too much correction", "B": "An impossible situation that simply cannot really occur at all", "C": "Review is optional here and can simply be dropped", "D": "The team members just read and check far too slowly"}, "answer": ["A"], "multi": false, "rationale": "Negative net savings signal a fit problem: improve prompts, context, or model choice, or pick different tasks. Dropping review is the wrong fix."}, {"n": 114, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which task should NOT be delegated to Claude in a hiring workflow?", "options": {"A": "Summarizing the raw interview notes into a brief", "B": "Making the final hire or no-hire decision itself", "C": "Generating a first set of screening questions", "D": "Drafting the job description for a human to review"}, "answer": ["B"], "multi": false, "rationale": "Consequential people decisions stay human; drafting, summarizing, and generating screening questions are assistable support steps."}, {"n": 115, "domain": "D4 Workflow Integration & Solution Design", "stem": "\"Stakeholder communication\" about limitations should include:", "options": {"A": "Only dense technical jargon about how the model works", "B": "A blanket promise that it will perform perfectly always", "C": "Known failure modes, the review controls, and off-limits uses", "D": "Nothing negative about the tool whatsoever, under any circumstances"}, "answer": ["C"], "multi": false, "rationale": "Naming failure modes (fabricated specifics, stale knowledge) alongside the controls in place and the uses it won't be put to is what makes the value claim believable."}, {"n": 116, "domain": "D4 Workflow Integration & Solution Design", "stem": "A recurring monthly board pack takes 3 days to assemble from 6 sources. A sound Claude-assisted design:", "options": {"A": "Owners add sources; Claude compiles; the owner verifies figures", "B": "Send Claude's first draft straight to the board unchecked", "C": "Let Claude invent the figures outright just to save assembly time", "D": "Stop producing the board pack altogether from now on"}, "answer": ["A"], "multi": false, "rationale": "Standard template plus provided sources plus owner verification against those sources before circulation is the canonical assisted-compilation pattern."}, {"n": 117, "domain": "D4 Workflow Integration & Solution Design", "stem": "The right sequencing for expanding Claude use after a successful pilot:", "options": {"A": "Switch to a different vendor before expanding anything", "B": "Push it to everything, everywhere, all at once right away immediately", "C": "Move to adjacent tasks, reusing proven templates and reviews", "D": "Freeze permanently at the original pilot's scale and scope"}, "answer": ["C"], "multi": false, "rationale": "Adjacent expansion reuses the templates and review patterns that worked, measuring as you go; big-bang rollouts lose the controls."}, {"n": 118, "domain": "D4 Workflow Integration & Solution Design", "stem": "Claude's role in a brainstorm-to-plan workflow:", "options": {"A": "Ideation, structuring options, and drafting, with human gates", "B": "Replacing the planning meeting with the team outright", "C": "Only the initial brainstorming stage and absolutely nothing beyond it", "D": "Only the final formatting of the already-finished plan"}, "answer": ["A"], "multi": false, "rationale": "It assists every stage — breadth in ideation, structuring into evaluated options, then drafting — while humans make the selection at each gate."}, {"n": 119, "domain": "D4 Workflow Integration & Solution Design", "stem": "A user wants Claude to \"optimize\" their calendar workflow but hasn't described the workflow. Claude's output will be:", "options": {"A": "Completely empty, since no process was ever described", "B": "Legally prohibited and therefore refused outright by the tool itself", "C": "Generic best practices; specifics need the actual workflow", "D": "Precisely tailored to their exact situation and tools"}, "answer": ["C"], "multi": false, "rationale": "No specific input, no specific output: useful advice needs the actual current workflow, pain points, and constraints from the associate."}, {"n": 120, "domain": "D4 Workflow Integration & Solution Design", "stem": "Measuring quality (not just speed) of a Claude-assisted output stream requires:", "options": {"A": "Tracking only the word count of each output produced", "B": "Having Claude self-report how good its own work was", "C": "Nothing extra, since greater speed already implies quality", "D": "Defined quality criteria and sampling review of outputs"}, "answer": ["D"], "multi": false, "rationale": "Quality is measured against stated criteria at review and downstream — error rates found, corrections needed, recipient feedback — not inferred from speed."}, {"n": 121, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which is a correct \"augment\" example in a sales workflow?", "options": {"A": "Claude sets the deal pricing with no human review or approval at all", "B": "Claude autonomously closes and signs the deals itself", "C": "Claude fully replaces the team's existing CRM system", "D": "Claude drafts outreach from CRM notes; the rep edits and sends"}, "answer": ["D"], "multi": false, "rationale": "Drafting from provided context with the human doing the final send is augmentation; autonomous closing, pricing, or replacement is not."}, {"n": 122, "domain": "D4 Workflow Integration & Solution Design", "stem": "When Claude proposes a process change that conflicts with a regulatory requirement the user knows about:", "options": {"A": "Implement it exactly as proposed, since Claude recommended it", "B": "Ignore the regulation so the new process can proceed", "C": "Ask Claude to find a way around the regulator's rule", "D": "Reject or adapt it; the human owns the constraints here"}, "answer": ["D"], "multi": false, "rationale": "Unstated constraints are invisible to the model, so the human is the constraint authority and enforces the requirement."}, {"n": 123, "domain": "D4 Workflow Integration & Solution Design", "stem": "A good \"solution iteration\" loop with Claude looks like:", "options": {"A": "Draft, critique with specifics, revise, repeat to criteria", "B": "Generate a single version once and ship it immediately", "C": "Revise endlessly without any acceptance criteria set", "D": "Critique the draft in careful detail but never actually revise it"}, "answer": ["A"], "multi": false, "rationale": "Convergence needs specific feedback on each draft and a stopping criterion; one-shot shipping and criteria-free loops both fail."}, {"n": 124, "domain": "D4 Workflow Integration & Solution Design", "stem": "The main risk of integrating Claude into a workflow WITHOUT defining review ownership:", "options": {"A": "Errors slip through as each person assumes another checked", "B": "The team's overall typing speed slows down rather noticeably", "C": "There is no real risk at all in working this way", "D": "The output ends up receiving far too much review"}, "answer": ["A"], "multi": false, "rationale": "Unowned review is no review: diffusion of responsibility lets errors pass because everyone assumes someone else validated the output."}, {"n": 125, "domain": "D4 Workflow Integration & Solution Design", "stem": "Claude supports \"use case analysis\" best when the user provides:", "options": {"A": "Only the budget available for the proposed project", "B": "The objective, current pain, users, constraints, and success", "C": "Nothing much at all about the situation, its goals, or its context", "D": "Just the company's logo and preferred brand colors"}, "answer": ["B"], "multi": false, "rationale": "Use-case quality is bounded by the framing inputs: objective, current pain, affected users, constraints, and a definition of success."}, {"n": 126, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which statement about workflow integration is TRUE?", "options": {"A": "Integration needs no change management of any kind", "B": "Measuring the results is entirely optional in practice", "C": "The tool's raw capability alone determines the outcome", "D": "Process design matters as much as the model does here"}, "answer": ["D"], "multi": false, "rationale": "The thesis of Domain 4: success depends as much on process design — task selection, review placement, standardization, measurement — as on the model."}, {"n": 127, "domain": "D5 Configuration & Knowledge Management", "stem": "Project custom instructions should contain:", "options": {"A": "Credentials and API keys the Project needs to sign in", "B": "The specific question you want answered in the next chat", "C": "Durable rules every chat shares: role, tone, and format", "D": "A running log of past conversations and their outcomes"}, "answer": ["C"], "multi": false, "rationale": "Instructions hold durable rules; per-task detail goes in the message, and credentials go nowhere near them."}, {"n": 128, "domain": "D5 Configuration & Knowledge Management", "stem": "A team's Project instructions say \"always cite sources\" but a specific chat needs an uncited internal brainstorm. What happens / what should they do?", "options": {"A": "Brainstorming is incompatible with any cite-sources Project", "B": "They must delete the Project and rebuild it without that rule", "C": "The rule is treated as absolute, so the uncited brainstorm cannot happen", "D": "A message overrides it for that one chat; instructions set defaults"}, "answer": ["D"], "multi": false, "rationale": "Instructions are defaults, not locks; current-message direction governs the current task."}, {"n": 129, "domain": "D5 Configuration & Knowledge Management", "stem": "What belongs in a Project's knowledge sources?", "options": {"A": "Every file the company owns, uploaded for maximum coverage", "B": "As many documents as possible, since more data gives better answers", "C": "Curated docs the chats need: current policies and templates", "D": "Only a short description; files are better pasted per chat"}, "answer": ["C"], "multi": false, "rationale": "Curation beats volume; irrelevant knowledge dilutes retrieval and consumes capacity."}, {"n": 130, "domain": "D5 Configuration & Knowledge Management", "stem": "A Project's knowledge contains a pricing sheet from last year; prices changed last month. The risk and fix:", "options": {"A": "Leave it and tell users to adjust the prices in their heads", "B": "Keep both the old and new sheets so answers can compare the prices", "C": "Claude answers from the stale sheet; swap in the current version", "D": "No real risk, since Claude flags outdated figures on its own"}, "answer": ["C"], "multi": false, "rationale": "Stale knowledge produces confident wrong answers, so replacing it and removing the old copy is an active duty."}, {"n": 131, "domain": "D5 Configuration & Knowledge Management", "stem": "Keeping BOTH old and new versions of a policy in Project knowledge without labels causes:", "options": {"A": "Richer answers, since Claude has more pricing data to work from", "B": "Conflicting sources Claude may draw from either, so answers vary", "C": "Claude silently deduplicates them and keeps only the newest facts", "D": "No effect, because Claude always prefers the most recent file"}, "answer": ["B"], "multi": false, "rationale": "Contradictory knowledge is worse than missing knowledge; version hygiene matters."}, {"n": 132, "domain": "D5 Configuration & Knowledge Management", "stem": "Effective system-level instructions are:", "options": {"A": "As long and detailed as possible to cover every situation", "B": "Specific and testable: audience, language, required fields, limits", "C": "Phrased as pseudo-code so the model parses them precisely", "D": "Broad and aspirational, like be amazing and always be super helpful"}, "answer": ["B"], "multi": false, "rationale": "Instructions work when they are testable rules, not vibes, length, or syntax tricks."}, {"n": 133, "domain": "D5 Configuration & Knowledge Management", "stem": "The Google Drive connector's function is to:", "options": {"A": "Automatically back up your whole chat history into Drive", "B": "Sync and then print Drive documents on a set schedule", "C": "Transfer ownership of the connected files over to Claude", "D": "Let Claude search and read your Drive files during chats"}, "answer": ["D"], "multi": false, "rationale": "Connectors extend Claude's reach into existing document stores, scoped to the user's own access."}, {"n": 134, "domain": "D5 Configuration & Knowledge Management", "stem": "Before connecting Gmail/Drive to Claude in a workplace, the associate should:", "options": {"A": "Use a colleague's account to keep personal data out of it", "B": "Confirm policy allows it and know what data the connector exposes", "C": "Turn off access logging so the connection stays private", "D": "Connect every available account right away for the fullest coverage"}, "answer": ["B"], "multi": false, "rationale": "Connector scope equals data exposure, so a governance check precedes connection."}, {"n": 135, "domain": "D5 Configuration & Knowledge Management", "stem": "A Project answers questions well for one document set but the team's scope expanded. Maintenance means:", "options": {"A": "Nothing, since Projects detect new scope and update themselves", "B": "Add the new docs, update instructions, and prune what no longer fits", "C": "Just rename the Project to reflect its broader new scope", "D": "Delete the Project and build a completely fresh one from scratch each time"}, "answer": ["B"], "multi": false, "rationale": "Configurations track the work; scope changes trigger knowledge and instruction updates."}, {"n": 136, "domain": "D5 Configuration & Knowledge Management", "stem": "Which instruction line most reduces fabricated answers in a knowledge-based Project?", "options": {"A": "Answer from the knowledge sources; if the answer is absent, say so", "B": "Answer every question with full confidence and no hedging", "C": "Never admit uncertainty; always produce a usable answer", "D": "Fill any gaps with reasonable-sounding guesses, without flagging them"}, "answer": ["A"], "multi": false, "rationale": "Bounding the answer source converts silent fallback-to-memory into a visible 'not in the docs.'"}, {"n": 137, "domain": "D5 Configuration & Knowledge Management", "stem": "The difference between uploading a file to ONE chat vs. adding it to Project knowledge:", "options": {"A": "A chat upload serves one chat; Project knowledge serves them all", "B": "There is no difference; both behave identically everywhere", "C": "Chat uploads persist across every Project conversation forever", "D": "Project knowledge is cleared automatically at the end of each day"}, "answer": ["A"], "multi": false, "rationale": "Scope of availability is the difference; choose based on whether the document is one-off or standing."}, {"n": 138, "domain": "D5 Configuration & Knowledge Management", "stem": "A well-configured Project for a client account should include: (Select TWO)", "options": {"A": "The user's personal banking and credit-card records", "B": "Current client docs: contract scope and brand guidelines", "C": "Standing instructions: client context, tone, output formats", "D": "Every other client's confidential files, kept for comparison"}, "answer": ["B", "C"], "multi": true, "rationale": "Relevant standing context belongs in; cross-client confidential mixing and irrelevant sensitive data do not."}, {"n": 139, "domain": "D5 Configuration & Knowledge Management", "stem": "\"Inform, maintain, and update configurations\" implies a cadence. The practical trigger for review is:", "options": {"A": "When reality changes new policy, templates, or scope, plus drift checks", "B": "Only after a visible public failure forces someone to fix it", "C": "Before every single message, as a standing precaution", "D": "Never, since a well-built configuration simply should not need revisiting"}, "answer": ["A"], "multi": false, "rationale": "Event-driven updates plus periodic audit; waiting for public failure is too late."}, {"n": 140, "domain": "D5 Configuration & Knowledge Management", "stem": "Overloading instructions with 40 rules causes:", "options": {"A": "Automatic ranking that applies the important rules first", "B": "Perfect, uniform compliance with all forty rules at once", "C": "Diluted adherence; trivial rules crowd out the ones that matter", "D": "Faster responses, since the rules are all pre-loaded for Claude"}, "answer": ["C"], "multi": false, "rationale": "Instruction budgets are real; every rule added taxes the others, so prioritize and trim."}, {"n": 141, "domain": "D5 Configuration & Knowledge Management", "stem": "A user reports the Project \"ignores\" an instruction. Reasonable first checks: (Select TWO)", "options": {"A": "Whether the rule is in the Project, not just an old chat", "B": "Whether it is specific and conflicts with no other rule", "C": "Whether the user was polite enough when asking for it", "D": "Whether the model is simply having a bad day at the moment"}, "answer": ["A", "B"], "multi": true, "rationale": "Location and quality of the instruction are the usual culprits."}, {"n": 142, "domain": "D5 Configuration & Knowledge Management", "stem": "Knowledge source formats: which practice improves retrieval quality?", "options": {"A": "Password-protected files that Claude is simply unable to open at all", "B": "Focused, well-titled docs split by topic so content is findable", "C": "Files with vague names and several unrelated topics mixed in", "D": "One giant scanned PDF holding every document together"}, "answer": ["B"], "multi": false, "rationale": "Findability of knowledge depends on how it is chunked and labeled."}, {"n": 143, "domain": "D5 Configuration & Knowledge Management", "stem": "Who should be able to modify a shared team Project's instructions?", "options": {"A": "Anyone on the team, at any time, with no notice to others", "B": "Designated owners, with changes communicated to the team", "C": "Only the newest hire, so the configuration stays simple", "D": "Nobody; shared instructions should be locked after setup"}, "answer": ["B"], "multi": false, "rationale": "Change control on shared configuration prevents silent behavior shifts across everyone's outputs."}, {"n": 144, "domain": "D5 Configuration & Knowledge Management", "stem": "A connector search returns nothing for a document the user knows exists in Drive. Sensible checks include:", "options": {"A": "The document must not really exist, so the user is simply mistaken", "B": "Waiting a few weeks for the search index to catch up", "C": "Account access, matching search terms, and supported file type", "D": "Reinstalling the app or the whole operating system first"}, "answer": ["C"], "multi": false, "rationale": "Connector misses are usually scope, permission, or query issues."}, {"n": 145, "domain": "D5 Configuration & Knowledge Management", "stem": "Instructions vs. knowledge: which division is correct?", "options": {"A": "Put everything in instructions and skip the knowledge sources", "B": "Put everything in knowledge and leave the instructions blank", "C": "Behavior rules go in knowledge files; reference facts in instructions", "D": "Behavior rules go in instructions; reference facts in knowledge"}, "answer": ["D"], "multi": false, "rationale": "Behavior is configured; facts are uploaded. Mixing them makes both hard to maintain."}, {"n": 146, "domain": "D5 Configuration & Knowledge Management", "stem": "After a major reorg, a Project built around the old org chart keeps giving outdated routing advice. This demonstrates:", "options": {"A": "Configuration debt: the tool mirrors stale inputs no one updated", "B": "AI is unreliable here and should be abandoned altogether", "C": "The reorg itself must have been the mistake that caused this problem", "D": "Projects simply cannot represent an org chart accurately"}, "answer": ["A"], "multi": false, "rationale": "The failure is process (no update owner), not the model."}, {"n": 147, "domain": "D5 Configuration & Knowledge Management", "stem": "For a Project used to draft external content, which instruction is a sound guardrail?", "options": {"A": "Allow unreviewed sending whenever a deadline is tight", "B": "Publish the drafts directly as soon as Claude marks them complete", "C": "Drafts stay internal until approved; flag any unverified facts", "D": "Avoid stating any facts at all so nothing can be wrong"}, "answer": ["C"], "multi": false, "rationale": "The instruction encodes the review boundary and flags unverified content structurally."}, {"n": 148, "domain": "D5 Configuration & Knowledge Management", "stem": "A user wants Claude to always know their product catalog. Best mechanism:", "options": {"A": "Describe each product from memory whenever it comes up", "B": "Paste the full product catalog into each new message, every time", "C": "Add the current catalog to knowledge; update it each release", "D": "Rely on Claude already knowing it from public web data"}, "answer": ["C"], "multi": false, "rationale": "Standing reference data belongs in maintained knowledge, not repeated pastes or assumptions."}, {"n": 149, "domain": "D5 Configuration & Knowledge Management", "stem": "What should be REMOVED from Project knowledge? (Select TWO)", "options": {"A": "Superseded versions of documents the team has since replaced", "B": "Off-topic files added just in case but never actually used", "C": "The current policy the whole team actively relies on each day", "D": "The live template the team uses for all its deliverables"}, "answer": ["A", "B"], "multi": true, "rationale": "Pruning stale and irrelevant material is half of knowledge management."}, {"n": 150, "domain": "D5 Configuration & Knowledge Management", "stem": "The overall test of a good configuration:", "options": {"A": "It looks genuinely impressive and polished to anyone who opens it", "B": "It holds the largest set of files of any team Project", "C": "A teammate opens it cold and gets correct, consistent output", "D": "No one quite understands it, yet it works often enough"}, "answer": ["C"], "multi": false, "rationale": "Configuration succeeds when correctness stops depending on the individual user."}, {"n": 151, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Before pasting customer PII into Claude, the associate must:", "options": {"A": "Nothing special; customer records can be pasted in freely", "B": "Move the data to a personal account so IT controls cannot see it", "C": "Get the customer's verbal okay and then proceed as normal", "D": "Check policy allows that data class, then minimize or anonymize"}, "answer": ["D"], "multi": false, "rationale": "Policy and minimization first; using personal accounts to evade controls is itself a violation."}, {"n": 152, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which is an INAPPROPRIATE use of Claude in most organizations?", "options": {"A": "Brainstorming campaign themes for a human to refine later", "B": "Drafting an internal project update that a human will review", "C": "Summarizing a public industry report for a colleague", "D": "Sending a final, unreviewed legal opinion out to a client"}, "answer": ["D"], "multi": false, "rationale": "Unreviewed professional advice in a regulated domain crosses the line; the others are assistive."}, {"n": 153, "domain": "D6 Governance, Risk & Responsible Use", "stem": "\"Data minimization\" when using AI tools means:", "options": {"A": "Sharing all available data so the output is as complete as possible", "B": "Sharing only what the task needs, like anonymized excerpts", "C": "Deleting all company data from systems after each AI session", "D": "Compressing files to the smallest possible size before upload"}, "answer": ["B"], "multi": false, "rationale": "Task-necessary data only; less exposure for the same output quality."}, {"n": 154, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A colleague uses a personal free-tier AI account for company documents because \"IT is slow.\" This is:", "options": {"A": "Required practice whenever the official tools are too slow", "B": "Shadow AI; it bypasses controls and should be raised, not copied", "C": "A smart move that shows real initiative and clearly deserves a reward", "D": "Resourceful problem-solving around a slow IT department"}, "answer": ["B"], "multi": false, "rationale": "Unsanctioned tools with company data are a governance breach regardless of intent."}, {"n": 155, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which data types typically require the MOST caution before use with AI tools? (Select TWO)", "options": {"A": "The public FAQ already posted on the company website", "B": "Payment-card and financial account numbers", "C": "Published marketing brochures already meant for the public", "D": "Health records and other regulated personal data"}, "answer": ["B", "D"], "multi": true, "rationale": "Regulated categories (health, payment/financial identifiers) carry legal regimes; public content does not."}, {"n": 156, "domain": "D6 Governance, Risk & Responsible Use", "stem": "An organization's AI policy prohibits client-identifiable data in AI tools. A user needs contract analysis. Compliant approach:", "options": {"A": "Redact identifying details, or use an approved environment", "B": "Set the policy aside this once to make the deadline", "C": "Have an intern paste it so the user is not the one at fault", "D": "Paste the full contract with all client names left intact"}, "answer": ["A"], "multi": false, "rationale": "Redaction or sanctioned environments reconcile task with policy; delegating the violation is still a violation."}, {"n": 157, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Why disclose AI assistance where policy or context requires it?", "options": {"A": "Many settings require transparency; hiding it risks trust", "B": "Disclosure is never actually required in any setting at all", "C": "To take credit for using advanced tools at the workplace", "D": "Because disclosing AI use makes the content itself false"}, "answer": ["A"], "multi": false, "rationale": "Where the norm or rule exists, silent AI use is a misrepresentation."}, {"n": 158, "domain": "D6 Governance, Risk & Responsible Use", "stem": "The person accountable for a Claude-drafted document that goes out with an error is:", "options": {"A": "Anthropic's support team, as the provider of the model", "B": "Claude, since it generated the flawed text in the first place", "C": "The human who reviewed and sent it keeps the accountability", "D": "No one, since an automated tool produced the content"}, "answer": ["C"], "multi": false, "rationale": "Tools don't hold accountability; senders do. This is the bedrock of responsible use."}, {"n": 159, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which is an ethical concern when using AI for performance review drafts?", "options": {"A": "That it mainly lets managers write the reviews much faster", "B": "That the drafts may run longer than a manual review would", "C": "Encoded bias can affect careers; keep the judgment the manager's", "D": "That formatting choices like headings may read as impersonal to staff"}, "answer": ["C"], "multi": false, "rationale": "People-affecting outputs get bias scrutiny; the assessment itself cannot be delegated."}, {"n": 160, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A user is asked to generate content impersonating a real competitor executive \"for fun.\" The correct call:", "options": {"A": "Do it, as long as the content never leaves the company", "B": "Do it, but add a tiny disclaimer that it is only fictional", "C": "Go ahead; it is clearly just harmless fun among coworkers", "D": "Refuse; impersonating real people is deceptive and risky"}, "answer": ["D"], "multi": false, "rationale": "Impersonation is off-limits; framing it as 'fun' or 'internal' does not cure it."}, {"n": 161, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Copyright-aware use of Claude means:", "options": {"A": "Removing author names so the original source cannot be traced", "B": "Treating copyright as not applying to any AI-based workflow", "C": "Generate original drafts, not substantial copyrighted text", "D": "Freely reproducing full articles, since AI rewrote them anyway"}, "answer": ["C"], "multi": false, "rationale": "Original generation and licensed inputs; laundering copied text through AI doesn't change its status."}, {"n": 162, "domain": "D6 Governance, Risk & Responsible Use", "stem": "\"Appropriate use case\" screening asks: (Select TWO)", "options": {"A": "Is this data class permitted for the tool under policy?", "B": "Is it unlikely that anyone will ever find out about it?", "C": "Will the final output look impressive to anyone who sees it?", "D": "Is an error's consequence acceptable given the review here?"}, "answer": ["A", "D"], "multi": true, "rationale": "Data permission and error-consequence-vs-controls are the screening axes; concealment signals the use is wrong."}, {"n": 163, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Under privacy expectations in a workplace deployment, the associate should assume:", "options": {"A": "Prompts and uploads are data flows under the usual policies", "B": "Only uploaded attachments count as real company data", "C": "AI tools sit outside the organization's data policies entirely", "D": "Anything typed is fine, since it is only a chatbot after all"}, "answer": ["A"], "multi": false, "rationale": "The chat box is a data channel; classify it like email and file sharing."}, {"n": 164, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A regulated firm (finance) wants Claude for client communications. Governance requires:", "options": {"A": "Removing the compliance steps that would slow the rollout", "B": "Deploying it quietly so compliance need not weigh in at all", "C": "Align with comms compliance: review, records, advice limits", "D": "No special controls are needed here; speed is what matters"}, "answer": ["C"], "multi": false, "rationale": "Regulated communication channels keep their compliance requirements when AI-assisted."}, {"n": 165, "domain": "D6 Governance, Risk & Responsible Use", "stem": "The risk of using Claude output as the SOLE basis for a consequential decision:", "options": {"A": "No real risk, as long as the output is well formatted", "B": "Unvalidated input to a high-stakes call with no second check", "C": "The only real downside is the cost of generating the output text", "D": "The output may actually be too accurate to question it"}, "answer": ["B"], "multi": false, "rationale": "Sole-source high-stakes reliance removes the error-catching layer entirely."}, {"n": 166, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which practice supports responsible AI use organizationally? (Select TWO)", "options": {"A": "A clear policy on permitted data classes and use cases", "B": "Training users on failure modes and verification duties", "C": "Punishing anyone who dares raise questions about the policy", "D": "Keeping the written policy secret from nearly all staff"}, "answer": ["A", "B"], "multi": true, "rationale": "Policy plus literacy; secrecy and fear produce shadow use."}, {"n": 167, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A user discovers a colleague pasted a customer database export into an AI chat against policy. The right action:", "options": {"A": "Post about it publicly so the issue gets attention fast", "B": "Report it through the incident process; disclosure may be owed", "C": "Ignore it; it is really not your concern to deal with", "D": "Do the exact same thing yourself so the rule applies to everyone evenly"}, "answer": ["B"], "multi": false, "rationale": "Data incidents have formal channels; timeliness can be legally material."}, {"n": 168, "domain": "D6 Governance, Risk & Responsible Use", "stem": "\"Ethical implications of AI usage\" includes considering:", "options": {"A": "Only the server electricity the model consumes while running", "B": "Nothing beyond how much speed the tool adds to the work", "C": "Effects on people: fairness, transparency, accountability", "D": "Mainly cosmetic choices like the fonts and spacing used"}, "answer": ["C"], "multi": false, "rationale": "The ethics lens is people-impact, not just efficiency."}, {"n": 169, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Claude declines a request the user believes is legitimate. The responsible response:", "options": {"A": "Keep rephrasing the request repeatedly until some wording finally slips past the refusal filter", "B": "Reconsider the framing, add honest context if truly legitimate, and accept some limits", "C": "Paste a jailbreak prompt from a forum and hope the output is not flagged", "D": "Pressure the model by insisting it has no choice and must comply right now"}, "answer": ["B"], "multi": false, "rationale": "Honest clarification is legitimate; engineered evasion of a safety boundary is a policy violation, however the request is framed."}, {"n": 170, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Confidential M&A information should be used with Claude:", "options": {"A": "Use it freely on any account, assuming the model never leaks private chat data", "B": "On a personal phone, because a personal device keeps the deal private", "C": "After posting it to the group chat so the whole team stays fully aligned", "D": "Only in environments and terms your organization approved for that sensitivity"}, "answer": ["D"], "multi": false, "rationale": "Deal-sensitive information carries securities and confidentiality constraints that dominate convenience; often it may not be used at all before disclosure rules allow."}, {"n": 171, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which statement about AI-generated content and misinformation is correct?", "options": {"A": "Speed of generation excuses occasional factual errors in what you publish", "B": "Fluent generation makes false-but-plausible content cheap, so the duty to verify rises", "C": "Treat misinformation as purely the reader's problem to catch, and never the publisher's own duty", "D": "AI output is inherently true because the model was trained on real text"}, "answer": ["B"], "multi": false, "rationale": "Cheap, fluent generation lowers the cost of producing convincing falsehoods, which raises the verification obligation on whoever amplifies it."}, {"n": 172, "domain": "D6 Governance, Risk & Responsible Use", "stem": "An \"acceptable use\" red flag in a request is:", "options": {"A": "Asking for a plain summary of a document you were already authorized to read", "B": "Asking for citations so claims can be traced back to their sources", "C": "Asking for the output to be formatted as a clean, readable table", "D": "Asking to hide AI involvement where disclosure is owed, or to deceive people"}, "answer": ["D"], "multi": false, "rationale": "Concealment where disclosure is required, and targeting or deceiving specific people, are the classic acceptable-use red flags; summaries, citations, and tables are not."}, {"n": 173, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Retention awareness: chat history and uploads should be treated as:", "options": {"A": "Potentially retained data governed by product settings and your org's agreements", "B": "Instantly self-destructing across every product the moment the chat window is closed", "C": "Printed and archived nightly to paper regardless of the product settings", "D": "Public by default and visible to anyone who looks for the conversation"}, "answer": ["A"], "multi": false, "rationale": "The tested behavior is checking the actual retention posture and settings before sharing sensitive content, rather than assuming either the always-deleted or always-public extreme."}, {"n": 174, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Fairness check on Claude-drafted customer eligibility criteria:", "options": {"A": "Randomize who qualifies so that no single group is able to claim it was unfair", "B": "Add several more eligibility criteria so that the overall screen simply looks far more rigorous", "C": "Ship it the moment the wording is grammatical and reads professionally enough", "D": "Review for proxies that disadvantage protected groups and confirm business justification"}, "answer": ["D"], "multi": false, "rationale": "Proxy discrimination (e.g., geography or language standing in for a protected trait) is the subtle failure mode; business justification is the test each criterion must pass."}, {"n": 175, "domain": "D6 Governance, Risk & Responsible Use", "stem": "The correct posture on \"Claude said it, so we are covered\":", "options": {"A": "False — the organization owns its outputs; tool assistance is not a liability shield", "B": "Accurate — the vendor that supplied the underlying model is the party that is legally liable", "C": "True for small errors, since a minor mistake shifts the blame onto the tool itself", "D": "True as long as you screenshot the reply as proof the model produced the text"}, "answer": ["A"], "multi": false, "rationale": "There is no output-laundering: responsibility for decisions and published content stays with the deploying organization regardless of which tool assisted."}, {"n": 176, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which is a legitimate governance control for AI-assisted external content? (Select TWO)", "options": {"A": "A blanket rule prohibiting any sentence that runs longer than five words", "B": "Approving or rejecting each piece of content by a coin flip to stay neutral", "C": "A named approver who signs off on the content before it is published", "D": "A log or record of what was AI-assisted wherever policy requires it"}, "answer": ["C", "D"], "multi": true, "rationale": "Ownership (a named approver) and traceability (an AI-assistance record) are real controls; arbitrary style bans and random approval are not governance."}, {"n": 177, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A nonprofit wants to use Claude on beneficiary case files with sensitive personal histories. The primary consideration:", "options": {"A": "Processing speed, so limited staff can clear the whole case backlog much faster", "B": "Publishing the files openly, on the view that transparency builds trust with donors", "C": "Consent, data-protection duties, and minimization — ideally working from de-identified data", "D": "Nothing special is required, on the mistaken theory that nonprofit status exempts it from privacy law"}, "answer": ["C"], "multi": false, "rationale": "Data about vulnerable subjects raises consent and data-protection duties; process only what is permitted and ideally de-identified. Nonprofit status exempts nothing."}, {"n": 178, "domain": "D6 Governance, Risk & Responsible Use", "stem": "\"Follow organisational AI policies\" when the policy is silent on a new use case means:", "options": {"A": "Escalate to the policy owner before proceeding with anything sensitive — a gap is not a yes", "B": "Stop using AI entirely until a fully updated written policy has been published", "C": "Treat the policy's silence as outright permission and proceed with the new use however you prefer", "D": "Write your own personal policy on the spot and then treat it as the official one"}, "answer": ["A"], "multi": false, "rationale": "A gap in the policy routes to the governance owner; the cautious default applies to sensitive uses, because silence is a gap rather than a green light."}, {"n": 179, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which describes responsible handling of Claude's uncertainty?", "options": {"A": "Convert every hedge into a confident claim so readers are not left unsure", "B": "Strip out every bit of uncertainty language so the final document reads as decisive", "C": "Carry genuine uncertainty flags downstream, or resolve them by verifying first", "D": "Treat any uncertainty as a defect to quietly hide from the reader"}, "answer": ["C"], "multi": false, "rationale": "Uncertainty flags are work items: verify and then remove, or carry them forward, but never silently delete them from the downstream document."}, {"n": 180, "domain": "D6 Governance, Risk & Responsible Use", "stem": "The summary principle of Domain 6:", "options": {"A": "Rules can be set aside whenever the quality of the output is high enough", "B": "Governance exists mainly to slow people down and pile needless friction onto otherwise good work", "C": "Use the tool where policy permits, on permitted data, with review and human accountability", "D": "Risk is solely IT's problem and not the concern of the people using the tool"}, "answer": ["C"], "multi": false, "rationale": "The four-part test is permission, data class, review proportionate to consequence, and accountability staying human — none of which is waived by high output quality."}, {"n": 181, "domain": "D7 Troubleshooting & Optimisation", "stem": "Output is generic and unhelpful. The FIRST diagnostic question:", "options": {"A": "Is the underlying model simply broken, overloaded, or degraded at the moment?", "B": "Is this something I should be escalating to the vendor's legal team right away?", "C": "Did my prompt give the specific context, constraints, and success criteria the task needs?", "D": "Is my home internet connection slow enough that it could be corrupting the model's full response?"}, "answer": ["C"], "multi": false, "rationale": "Generic output almost always traces to generic input, so check the prompt's context and criteria before suspecting the tool or the connection."}, {"n": 182, "domain": "D7 Troubleshooting & Optimisation", "stem": "Output is detailed but answers the WRONG question. Likely cause and fix:", "options": {"A": "Ambiguous phrasing was read differently; restate it explicitly, including what you do NOT want", "B": "Claude is being deliberately contrarian, so there is nothing you can really do", "C": "The topic is simply impossible for any current model to address correctly at all", "D": "The request was simply too quiet to register, so repeat the very same words far more forcefully"}, "answer": ["A"], "multi": false, "rationale": "A detailed answer to the wrong question is a prompt-clarity failure; disambiguate the request rather than repeating it unchanged."}, {"n": 183, "domain": "D7 Troubleshooting & Optimisation", "stem": "Claude keeps producing output in the wrong structure despite corrections. Escalating fixes, in order:", "options": {"A": "Abandon the structured format altogether and simply accept whatever loose layout the model returns", "B": "Show an explicit example, then move the format rule into Project instructions, then reset the chat", "C": "Make random changes to the prompt and hope that one of them happens to stick", "D": "Strip out all instructions so the model has nothing left that it could misinterpret"}, "answer": ["B"], "multi": false, "rationale": "The standard escalation ladder is concrete example, then persistent instruction, then a fresh conversation when accumulated context is fighting you."}, {"n": 184, "domain": "D7 Troubleshooting & Optimisation", "stem": "Responses degrade late in a very long conversation (forgetting, repetition). Best move:", "options": {"A": "Type more slowly so the model is given more time to keep track of the thread", "B": "Continue on in the very same conversation thread indefinitely and push through the degradation", "C": "Summarize the decisions and constraints, then restart fresh with that summary as the seed", "D": "Blame the keyboard or the client and switch over to a different input device"}, "answer": ["C"], "multi": false, "rationale": "Late-conversation degradation is context-window saturation, which is fixed by resetting with a summary rather than by persisting in the same thread."}, {"n": 185, "domain": "D7 Troubleshooting & Optimisation", "stem": "A prompt works for one document type but fails on another. Diagnosis:", "options": {"A": "Claude simply dislikes the second document type and quietly refuses to engage with it properly", "B": "All documents are essentially the same, so the prompt cannot be the issue", "C": "The prompt encoded assumptions from the first type; generalize it or branch per type", "D": "The failure is pure randomness and will clear up on its own if you retry"}, "answer": ["C"], "multi": false, "rationale": "Prompts overfit to the structure and vocabulary of the inputs they were tuned on, so a new input class needs an adjusted or branched prompt."}, {"n": 186, "domain": "D7 Troubleshooting & Optimisation", "stem": "Which change most reliably improves an underperforming analysis prompt?", "options": {"A": "Rewrite the entire request in a much softer, quieter, and more conversational tone of voice", "B": "Add the word \"please\" several more times to make the request sound more polite", "C": "Put the key sentences in bold so the model treats them as the important ones", "D": "Supplying the missing data and context, explicit evaluation criteria, and output structure"}, "answer": ["D"], "multi": false, "rationale": "Most analysis-quality complaints trace to missing context, missing criteria, or missing structure — not to politeness, tone, or formatting of the prompt."}, {"n": 187, "domain": "D7 Troubleshooting & Optimisation", "stem": "Claude's answer about your uploaded spreadsheet is wrong. First checks: (Select TWO)", "options": {"A": "Whether the current moon phase or the time of day happened to be unfavorable for the request", "B": "Whether the answer came back in bold formatting rather than in plain, unformatted text", "C": "Whether the question named the specific columns or ranges or left scope to guesswork", "D": "Whether the upload actually holds the data you think (right file, right tab/version)"}, "answer": ["C", "D"], "multi": true, "rationale": "Wrong input (stale or incorrect file/tab) and underspecified scope are the two dominant causes of wrong answers about uploaded data."}, {"n": 188, "domain": "D7 Troubleshooting & Optimisation", "stem": "When a task consistently fails as one big prompt, the optimisation is:", "options": {"A": "Delete some of the input data so the single prompt has less to handle", "B": "Decompose it into sequential steps with checkable intermediate outputs", "C": "Abandon the task as something the model is fundamentally unable to do", "D": "Write an even bigger single prompt that spells out every detail at once"}, "answer": ["B"], "multi": false, "rationale": "Decomposition localizes where the failure occurs and makes each step verifiable, which a single large prompt cannot do."}, {"n": 189, "domain": "D7 Troubleshooting & Optimisation", "stem": "\"Adjust approach based on feedback and results\" means:", "options": {"A": "Change everything in the prompt at once and see whether the result improves", "B": "Change nothing at all between runs, on the view that consistency is a virtue in itself", "C": "Leave the prompt alone and only ever switch to a different model", "D": "Treat each bad output as diagnostic data: find WHAT was wrong, then change that input"}, "answer": ["D"], "multi": false, "rationale": "Targeted, single-variable adjustment (facts, scope, tone, or structure) beats both leaving everything fixed and changing everything at random."}, {"n": 190, "domain": "D7 Troubleshooting & Optimisation", "stem": "A team's Claude workflow is accurate but slow: every output passes three redundant review layers. Optimisation:", "options": {"A": "Have reviewers review the earlier reviews before any output is allowed to go out", "B": "Add a fourth review layer to be even more certain that the output is correct", "C": "Right-size review to risk — full for high-stakes, lighter for low-stakes — and measure it", "D": "Remove the review step entirely so that nothing can slow the output down any further at release"}, "answer": ["C"], "multi": false, "rationale": "Optimisation cuts redundant review while keeping control proportionate to consequence, and measures the effect rather than removing or adding layers blindly."}, {"n": 191, "domain": "D7 Troubleshooting & Optimisation", "stem": "Claude refuses a legitimate business request. Sensible first response:", "options": {"A": "Delete the account and assume the tool is unusable for this work", "B": "Add clarifying context that makes the legitimate purpose and scope explicit", "C": "Repeat the identical request a second time, this time phrased far more angrily", "D": "Search online for an evasion script that can get around the refusal"}, "answer": ["B"], "multi": false, "rationale": "Ambiguous requests can pattern-match to disallowed ones, so honest context resolves most false-positive refusals; evasion would be a policy violation (see Q169)."}, {"n": 192, "domain": "D7 Troubleshooting & Optimisation", "stem": "Outputs vary in quality across days for the same recurring task. A stabilizing fix:", "options": {"A": "Accept the day-to-day variation as unavoidable chaos you cannot do anything about", "B": "Only submit the task late at midnight when the service is under a lighter load", "C": "Lock the stable parts into a template or Project instruction so only the data varies", "D": "Change at least some element of the task every single day in order to keep the model engaged"}, "answer": ["C"], "multi": false, "rationale": "Variance shrinks when the constant elements — structure, criteria, examples — stop being retyped inconsistently and are fixed in a template or instruction."}, {"n": 193, "domain": "D7 Troubleshooting & Optimisation", "stem": "A user gets better results from one 5-line example than from three paragraphs of description. Lesson:", "options": {"A": "Treat examples as a form of cheating that really ought to be kept out of your prompts entirely", "B": "Both examples and descriptions are useless, so neither is worth including", "C": "Demonstration often conveys format and quality more precisely than description does", "D": "Written descriptions are always better than examples for guiding output"}, "answer": ["C"], "multi": false, "rationale": "Show-don't-tell is a core optimisation lever: lead with an example when the structure and quality bar matter most."}, {"n": 194, "domain": "D7 Troubleshooting & Optimisation", "stem": "After a prompt edit, output improved on criterion A but regressed on criterion B. Correct practice:", "options": {"A": "Drop criterion B from the requirements so the regression no longer counts", "B": "Alternate between the two prompt versions on successive runs to average it out", "C": "Note the interaction, restate BOTH criteria explicitly, and re-test the prompt", "D": "Ship the version with the regression, since criterion A clearly got better"}, "answer": ["C"], "multi": false, "rationale": "Multi-criteria tasks need every criterion stated and checked after each change; a gain on one axis is not acceptable while blind to the others."}, {"n": 195, "domain": "D7 Troubleshooting & Optimisation", "stem": "The output is factually fine but far too long for its purpose. Optimisation:", "options": {"A": "Delete whole paragraphs at random until the piece reaches an acceptable length", "B": "Reduce the font size so that the same amount of text occupies far fewer pages", "C": "Constrain the prompt: audience, purpose, a hard length target, and what to preserve", "D": "Tell the readers to simply skim the output and pull out only the particular parts they need"}, "answer": ["C"], "multi": false, "rationale": "Excess length is a specification problem, so fix the spec with audience, purpose, and an explicit length target rather than trimming after the fact."}, {"n": 196, "domain": "D7 Troubleshooting & Optimisation", "stem": "Which symptom-to-cause mapping is CORRECT?", "options": {"A": "A buried instruction gets ignored because it is lost in long context — relocate or restate it", "B": "A refusal is a sure sign that the underlying model is broken or currently down", "C": "Wrong format happens because the model is simply unable to produce any formats", "D": "Invented specifics happen because the model was handed far too much background context all at once"}, "answer": ["A"], "multi": false, "rationale": "Instruction salience decays in long context, so moving the instruction to Project instructions or restating it at the point of use is the fix."}, {"n": 197, "domain": "D7 Troubleshooting & Optimisation", "stem": "A user wants to know if their prompt change actually helped. Minimal valid test:", "options": {"A": "Run the old and new prompts on the same inputs and compare against set criteria", "B": "Run only the new prompt once on a brand-new input and judge the result", "C": "Ask a friend to glance at both and say which of the two prompts simply looks smarter", "D": "Go by overall vibes about whether the new output feels a bit better"}, "answer": ["A"], "multi": false, "rationale": "A controlled comparison uses the same inputs and stated criteria; changing the input or judging a single run measures noise rather than the change."}, {"n": 198, "domain": "D7 Troubleshooting & Optimisation", "stem": "Recurring small corrections the user makes by hand every time (e.g., fixing the date format) should be:", "options": {"A": "Encoded once as an instruction or template rule so the correction stops recurring", "B": "Ignored, on the view that a small formatting slip does not really matter anyway", "C": "Practiced until you are able to make the manual fix much faster by hand yourself", "D": "Accept the fix as a fixed cost of the task and simply redo it by hand on each run"}, "answer": ["A"], "multi": false, "rationale": "Repeated manual fixes are unencoded requirements; moving them upstream into an instruction or template removes the recurring work."}, {"n": 199, "domain": "D7 Troubleshooting & Optimisation", "stem": "When troubleshooting, the order of suspects for a bad output is:", "options": {"A": "Always suspect the model itself first before looking at anything else", "B": "Always assume a colleague tampered with the inputs before checking the prompt", "C": "Suspect a model conspiracy first, then the weather, and only much later the prompt", "D": "Prompt clarity, then input data, then feature/model fit, then conversation state"}, "answer": ["D"], "multi": false, "rationale": "Checking the cheap, likely causes first — prompt, then data, then model fit, then context length — resolves most issues before you touch model choice."}, {"n": 200, "domain": "D7 Troubleshooting & Optimisation", "stem": "The Domain 7 meta-skill the exam is testing:", "options": {"A": "Treating bad output as a debuggable system: isolate a variable, change it, verify the effect", "B": "Restarting the whole computer whenever the output is not quite what you wanted", "C": "Escalating every single unsatisfactory output straight to the IT department to open a formal ticket", "D": "Memorizing a long catalog of error codes so you can recognize each one on sight"}, "answer": ["A"], "multi": false, "rationale": "The whole domain is systematic diagnosis over superstition: isolate the prompt, data, feature, or context, change it deliberately, and verify."}, {"n": 201, "domain": "bonus:current-models", "stem": "As of 2026, where does the Fable tier sit in Anthropic's model lineup?", "options": {"A": "Below Haiku, as the smallest and cheapest model in the lineup", "B": "Between Haiku and Sonnet, as a mid-range general-purpose model", "C": "Above Opus, as the most capable publicly available tier", "D": "Outside the lineup, as a code-only model with no general use"}, "answer": ["C"], "multi": false, "rationale": "Fable was introduced in June 2026 as a tier above Opus, making it the top publicly available tier."}, {"n": 202, "domain": "bonus:current-models", "stem": "The relationship between Claude Fable and Claude Mythos is:", "options": {"A": "The same underlying model, with Mythos relaxing safety gates under limited access", "B": "Mythos is just Fable after a rename, with no real difference between them", "C": "Two unrelated products built on entirely separate and independent underlying models", "D": "Mythos is simply the cheaper, lower-capability version of Fable"}, "answer": ["A"], "multi": false, "rationale": "Mythos shares Fable's underlying model but ships with fewer safety gates and limited availability; it is a different safety posture, not a different model."}, {"n": 203, "domain": "bonus:current-models", "stem": "With a four-tier public lineup (Haiku 4.5, Sonnet 5, Opus 5.5, Fable), the selection principle from Domain 3:", "options": {"A": "Now means defaulting to Fable, because it is simply the strongest tier available", "B": "Changes completely, since the older three-tier framework no longer applies here", "C": "No longer matters much at all, since the four tiers have effectively become interchangeable in use", "D": "Is unchanged — match capability to task complexity and stakes; more tiers just add granularity"}, "answer": ["D"], "multi": false, "rationale": "New names do not change the decision framework; extra tiers only give finer-grained cost/quality tradeoffs, which is why the blueprint principle survives."}, {"n": 204, "domain": "bonus:current-models", "stem": "For bulk classification of 10,000 records, the current-lineup choice is:", "options": {"A": "Whichever model simply happens to load first at the moment you start the job", "B": "Use Mythos, because its relaxed safety gates let it process the records faster", "C": "Haiku 4.5 — the task is simple and volume/cost dominate, so a frontier tier adds no gain", "D": "Use Fable for everything, on the blanket principle that you should always reach for the best model"}, "answer": ["C"], "multi": false, "rationale": "The logic matches Q72: a simple, high-volume task is cost- and latency-bound, and moving the top of the lineup up does not move simple tasks up with it."}, {"n": 205, "domain": "bonus:current-models", "stem": "Which task most justifies reaching for the Fable tier?", "options": {"A": "A long-horizon, high-stakes job where top-end reasoning quality changes the outcome", "B": "Fixing a single typo in a short sentence that is otherwise already correct", "C": "Reformatting a plain list so the bullet points line up neatly down the page", "D": "A quick one-line factual lookup that essentially any tier in the lineup can already answer well"}, "answer": ["A"], "multi": false, "rationale": "Frontier tiers earn their cost on complexity and stakes — multi-document analysis or agentic multi-step work — not on trivial tasks any tier handles."}, {"n": 206, "domain": "bonus:current-models", "stem": "A user assumes Fable's answers need no verification \"because it is the newest model.\" Correct?", "options": {"A": "No — stronger tiers lower the error rate but none remove fabrication; verify every tier", "B": "Only artifacts and generated files need checking, never the plain text answers", "C": "Yes, as long as the account is on a paid plan rather than a free one", "D": "Yes — the frontier models sitting at the very top of the lineup are now effectively error-free"}, "answer": ["A"], "multi": false, "rationale": "As in Q89, model choice changes the error rate but never the need for validation; Domain 2 verification duties apply to every tier, Fable included."}, {"n": 207, "domain": "bonus:current-models", "stem": "In mid-2026, access to Fable and Mythos was briefly suspended and then restored. The associate-level lesson:", "options": {"A": "Vendor availability announcements about tiers can simply be ignored by associates in their work", "B": "Availability can shift with regulation and policy, so name a fallback tier in the workflow", "C": "A suspension of a tier should simply be assumed permanent once it has happened", "D": "Never rely on AI at all, since any tier might be withdrawn without prior warning"}, "answer": ["B"], "multi": false, "rationale": "Availability is an operational dependency; resilient workflows note which tier they depend on and identify a fallback such as Opus 5.5."}, {"n": 208, "domain": "bonus:current-models", "stem": "A stakeholder asks \"should we standardize everything on Fable?\" The sound answer:", "options": {"A": "No — tier the workload and reserve Fable for where frontier quality pays, then measure", "B": "It makes no real difference at all which tier you pick, so you may as well flip a coin to decide", "C": "No, ban Fable outright and keep everything on the older, cheaper tiers", "D": "Yes, standardize on Fable, because the newest model is always the right default"}, "answer": ["A"], "multi": false, "rationale": "The right approach is portfolio allocation across tiers — Haiku-class for volume, Sonnet/Opus-class for standard work, Fable for the minority of high-value tasks — justified by measured task-level differences."}, {"n": 209, "domain": "bonus:current-models", "stem": "Model version numbers (Sonnet 5 vs an older Sonnet) matter to an associate because:", "options": {"A": "They do not really matter, since every single version within a given tier behaves in the same way", "B": "Capability, behavior, and knowledge recency shift between versions, so re-check on an update", "C": "Version numbers only affect pricing and never affect the model's output", "D": "Newer version numbers reliably indicate the model has become worse, not better"}, "answer": ["B"], "multi": false, "rationale": "A version change is a silent workflow change; a prompt tuned on one version should be spot-checked and templates re-validated when the model updates."}, {"n": 210, "domain": "bonus:current-models", "stem": "On the exam, if a question name const Q = CERT.questions;
const BLUEPRINT = Q.filter(q=>!q.domain.startsWith('bonus'));
const BONUS = Q.filter(q=>q.domain.startsWith('bonus'));
const DOMAINS = [...new Set(BLUEPRINT.map(q=>q.domain))];
const W = CERT.blueprint_weights_pct;
document.getElementById('sub').textContent = '· '+CERT.id;
document.getElementById('hstat').textContent = Q.length+' questions ('+BLUEPRINT.length+' blueprint + '+BONUS.length+' bonus)';
const app = document.getElementById('app');
function lastResult(){try{const r=JSON.parse(localStorage.getItem('ccaof_last'));return r?`<div class="card"><b>Last mock:</b> ${r.scaled}/1000 — ${r.pass?'PASS':'below pass'} <span class="sm mut">(${new Date(r.t).toLocaleDateString()})</span></div>`:'';}catch(e){return '';}}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- scoring core: exact-set + FAIL-CLOSED (invalid/empty never a silent pass) ----
function scoreItem(q, selected){
  if(!q.answer || q.answer.length===0) return {status:'invalid', correct:false};   // AC6: null-key BLOCKS
  if(!selected || selected.length===0) return {status:'unanswered', correct:false};
  const key=[...q.answer].sort().join(','), sel=[...selected].sort().join(',');
  return {status:'answered', correct:key===sel};
}
// ---- exam generation: 60 items, weighted by blueprint (largest-remainder to hit exactly 60) ----
function allocate(total){
  const raw = DOMAINS.map(d=>({d, exact: total*(W[d]||0)/100}));
  const alloc = raw.map(r=>({d:r.d, n:Math.floor(r.exact), rem:r.exact-Math.floor(r.exact)}));
  let used = alloc.reduce((s,a)=>s+a.n,0);
  alloc.sort((a,b)=>b.rem-a.rem);
  for(let i=0; used<total; i++,used++) alloc[i%alloc.length].n++;
  const m={}; alloc.forEach(a=>m[a.d]=a.n); return m;
}
function sample(arr,n){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}
function buildExam(){
  const m=allocate(60), items=[];
  DOMAINS.forEach(d=>items.push(...sample(BLUEPRINT.filter(q=>q.domain===d), m[d])));
  return sample(items, items.length); // shuffle order
}

// ---------- HOME ----------
function home(){
  app.innerHTML = lastResult()+
   `<div class="grid">
     <div class="tile" id="tDrill"><h3>Drill by domain</h3><div class="sm mut">Instant feedback + rationale. Pick a domain and work through it.</div></div>
     <div class="tile" id="tExam"><h3>Exam simulator</h3><div class="sm mut">60 items, weighted to the blueprint, 120-min timer, scaled score (pass 720/1000).</div></div>
   </div>
   <div class="card sm mut">Real exam: ${CERT.exam.items} items · ${CERT.exam.minutes} min · pass ${CERT.exam.pass_score}/${CERT.exam.scale_max}. Practice bank, not real items.</div>`;
  document.getElementById('tDrill').onclick=drillPick;
  document.getElementById('tExam').onclick=()=>examStart();
}
// ---------- DRILL ----------
function drillPick(){
  const tiles = DOMAINS.map(d=>`<div class="tile dsel" data-d="${esc(d)}"><h3>${esc(d)}</h3><div class="sm mut">${BLUEPRINT.filter(q=>q.domain===d).length} questions</div></div>`).join('');
  const bonus = BONUS.length?`<div class="tile dsel" data-d="__bonus"><h3>Bonus: current model lineup</h3><div class="sm mut">${BONUS.length} questions</div></div>`:'';
  app.innerHTML = `<div class="row" style="margin-top:0"><button class="ghost" id="back">← Home</button></div><div class="grid" style="margin-top:12px">${tiles}${bonus}</div>`;
  document.getElementById('back').onclick=home;
  document.querySelectorAll('.dsel').forEach(t=>t.onclick=()=>{
    const d=t.dataset.d; const pool = d==='__bonus'?BONUS:BLUEPRINT.filter(q=>q.domain===d);
    drillRun(sample(pool,pool.length), 0, {right:0,seen:0});
  });
}
function drillRun(list, i, tally){
  if(i>=list.length){ app.innerHTML=`<div class="card"><h3>Domain complete</h3><p>${tally.right}/${tally.seen} correct.</p><div class="row"><button id="again">Another domain</button><button class="ghost" id="home">Home</button></div></div>`;
    document.getElementById('again').onclick=drillPick; document.getElementById('home').onclick=home; return; }
  const q=list[i]; const type=q.multi?'checkbox':'radio'; let done=false;
  const opts=Object.keys(q.options).sort().map(lt=>`<label class="opt" data-lt="${lt}"><input type="${type}" name="opt" value="${lt}"><span class="lt">${lt}</span><span>${esc(q.options[lt])}</span></label>`).join('');
  app.innerHTML=`<div class="prog"><i style="width:${100*i/list.length}%"></i></div>
    <div class="card"><span class="badge">${esc(q.domain)}</span><div class="qn">Question ${q.n} · ${i+1} of ${list.length}</div>
    ${q.multi?'<div class="multi">Select all that apply</div>':''}<div class="stem">${esc(q.stem)}</div>${opts}
    <div class="row"><button id="check">Check</button><button class="ghost" id="skip">Skip</button></div><div id="fb"></div></div>`;
  document.getElementById('skip').onclick=()=>drillRun(list,i+1,tally);
  document.getElementById('check').onclick=()=>{
    if(done)return;
    const sel=[...document.querySelectorAll('input[name=opt]:checked')].map(x=>x.value);
    const r=scoreItem(q,sel); const fb=document.getElementById('fb');
    if(r.status==='invalid'){fb.innerHTML=`<div class="verdict no">This question has no answer key — blocked (fail-closed).</div>`;return;}
    if(r.status==='unanswered'){fb.innerHTML=`<div class="verdict warn">Select an answer first.</div>`;return;}
    done=true; tally.seen++; if(r.correct)tally.right++;
    document.querySelectorAll('.opt').forEach(el=>{const lt=el.dataset.lt; if(q.answer.includes(lt))el.classList.add('correct'); else if(sel.includes(lt))el.classList.add('wrong');});
    fb.innerHTML=`<div class="verdict ${r.correct?'ok':'no'}">${r.correct?'Correct':'Incorrect'} — answer: ${q.answer.join(', ')}</div><div class="rat">${esc(q.rationale)}</div><div class="row"><button id="next">Next →</button></div>`;
    document.getElementById('next').onclick=()=>drillRun(list,i+1,tally);
  };
}
// ---------- EXAM SIM ----------
let EX=null;
function examStart(){
  const items=buildExam();
  EX={items, answers:{}, i:0, endAt:Date.now()+CERT.exam.minutes*60000, timer:null};
  EX.timer=setInterval(tick,1000); examRun();
}
function tick(){
  const left=Math.max(0,EX.endAt-Date.now()); const el=document.getElementById('timer');
  if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`${m}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',left<300000);}
  if(left<=0){clearInterval(EX.timer); examSubmit();}
}
function examRun(){
  const q=EX.items[EX.i]; const type=q.multi?'checkbox':'radio'; const cur=EX.answers[q.n]||[];
  const opts=Object.keys(q.options).sort().map(lt=>`<label class="opt ${cur.includes(lt)?'picked':''}" data-lt="${lt}"><input type="${type}" name="opt" value="${lt}" ${cur.includes(lt)?'checked':''}><span class="lt">${lt}</span><span>${esc(q.options[lt])}</span></label>`).join('');
  app.innerHTML=`<div class="row" style="margin-top:0;justify-content:space-between"><span class="sm mut">Item ${EX.i+1} of ${EX.items.length}</span><span class="timer" id="timer">–</span></div>
    <div class="prog"><i style="width:${100*(EX.i+1)/EX.items.length}%"></i></div>
    <div class="card"><span class="badge">${esc(q.domain)}</span>${q.multi?'<div class="multi">Select all that apply</div>':''}<div class="stem">${esc(q.stem)}</div>${opts}</div>
    <div class="row"><button class="ghost" id="prev" ${EX.i===0?'disabled':''}>← Prev</button>
    ${EX.i<EX.items.length-1?'<button id="next">Next →</button>':'<button id="submit">Submit exam</button>'}
    <span class="sm mut">${Object.keys(EX.answers).length}/${EX.items.length} answered</span></div>`;
  tick();
  function save(){EX.answers[q.n]=[...document.querySelectorAll('input[name=opt]:checked')].map(x=>x.value); if(EX.answers[q.n].length===0)delete EX.answers[q.n];}
  const nx=document.getElementById('next'), pv=document.getElementById('prev'), sb=document.getElementById('submit');
  if(nx)nx.onclick=()=>{save();EX.i++;examRun();};
  if(pv)pv.onclick=()=>{save();EX.i--;examRun();};
  if(sb)sb.onclick=()=>{save(); if(confirm('Submit and score?')){clearInterval(EX.timer);examSubmit();}};
}
function examSubmit(){
  // fail-closed: any item with no key blocks scoring (AC6)
  const invalid=EX.items.filter(q=>!q.answer||q.answer.length===0);
  if(invalid.length){app.innerHTML=`<div class="card err"><h3>Scoring blocked (fail-closed)</h3><p>${invalid.length} item(s) have no answer key: ${invalid.map(q=>'Q'+q.n).join(', ')}. A score is not computed on an invalid key.</p><div class="row"><button id="home">Home</button></div></div>`;document.getElementById('home').onclick=home;return;}
  const byDom={}; DOMAINS.forEach(d=>byDom[d]={right:0,total:0});
  let right=0;
  EX.items.forEach(q=>{const r=scoreItem(q,EX.answers[q.n]); byDom[q.domain].total++; if(r.correct){right++;byDom[q.domain].right++;}});
  const scaled=Math.round(1000*right/EX.items.length); const pass=scaled>=CERT.exam.pass_score;
  try{localStorage.setItem('ccaof_last',JSON.stringify({scaled,pass,t:Date.now()}));}catch(e){}
  const weak=DOMAINS.map(d=>({d,pct:byDom[d].total?byDom[d].right/byDom[d].total:1,...byDom[d]})).filter(x=>x.total).sort((a,b)=>a.pct-b.pct);
  const rows=weak.map(x=>`<div class="dl"><span>${esc(x.d)}</span><span class="mut">${x.right}/${x.total} · ${Math.round(x.pct*100)}%</span></div><div class="bar"><i style="width:${Math.round(x.pct*100)}%;background:${x.pct<0.7?'var(--no)':'var(--ok)'}"></i></div>`).join('');
  const weakest=weak.filter(x=>x.pct<0.7).slice(0,3).map(x=>x.d);
  app.innerHTML=`<div class="card" style="text-align:center">
    <div class="sm mut">Scaled score (approx: linear from raw ${right}/${EX.items.length})</div>
    <div class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${scaled}</div>
    <div class="verdict ${pass?'ok':'no'}">${pass?'PASS':'BELOW PASS'} · need ${CERT.exam.pass_score}/${CERT.exam.scale_max}</div></div>
    <div class="card"><h3 style="margin-top:0">By domain</h3>${rows}</div>
    <div class="card"><h3 style="margin-top:0">Study next</h3>${weakest.length?('<div class="sm mut">Weakest domains — review these lessons:</div><ul>'+weakest.map(d=>{const L=CERT.lessons&&CERT.lessons[d];return '<li>'+esc(d)+(L?' — <a href="'+L.url+'" target="_blank" rel="noopener">'+esc(L.title)+'</a>':'')+'</li>';}).join('')+'</ul>'):'<div class="sm mut">No domain below 70%. Solid — keep drilling to stay sharp.</div>'}</div>
    <div class="row"><button id="again">New exam</button><button class="ghost" id="home">Home</button></div>`;
  document.getElementById('again').onclick=()=>examStart();
  document.getElementById('home').onclick=home;
}
// test hooks
window.__app={home,drillPick,examStart,examSubmit,examRun,buildExam,allocate,scoreItem,DOMAINS,BLUEPRINT,BONUS,getEX:()=>EX,setEX:v=>EX=v};
home();
</script></body></html>
