n & Knowledge Management", "stem": "For a Project used to draft external content, which instruction is a sound guardrail?", "options": {"A": "\"Publish directly.\"", "B": "\"All drafts are internal until human approval; include a placeholder note for any fact you could not verify from the knowledge sources.\"", "C": "\"Never mention facts.\"", "D": "\"Skip review on Fridays.\""}, "answer": ["B"], "multi": false, "rationale": "The instruction encodes the review boundary and flags unverified content structurally."}, {"n": 148, "domain": "D5 Configuration & Knowledge Management", "stem": "A user wants Claude to always know their product catalog. Best mechanism:", "options": {"A": "Paste the catalog into every message forever", "B": "Add the current catalog to Project knowledge and update it on release cycles", "C": "Assume Claude knows it from the internet", "D": "Describe products from memory each time"}, "answer": ["B"], "multi": false, "rationale": "Standing reference data belongs in maintained knowledge, not repeated pastes or assumptions."}, {"n": 149, "domain": "D5 Configuration & Knowledge Management", "stem": "What should be REMOVED from Project knowledge? (Select TWO)", "options": {"A": "Superseded document versions", "B": "Documents irrelevant to the Project's purpose that were added \"just in case\"", "C": "The current policy the team uses daily", "D": "The active template for deliverables"}, "answer": ["A", "B"], "multi": true, "rationale": "Pruning stale and irrelevant material is half of knowledge management."}, {"n": 150, "domain": "D5 Configuration & Knowledge Management", "stem": "The overall test of a good configuration:", "options": {"A": "It looks impressive", "B": "A teammate can open the Project cold and get correct, consistent, on-format outputs without tribal knowledge", "C": "It has the most files", "D": "Nobody understands it but it works sometimes"}, "answer": ["B"], "multi": false, "rationale": "Configuration succeeds when correctness stops depending on the individual user. Q180)"}, {"n": 151, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Before pasting customer PII into Claude, the associate must:", "options": {"A": "Nothing; paste freely", "B": "Check the organization's data classification and AI-use policy for whether that data class is permitted, and minimize/anonymize where possible", "C": "Ask the customer's horoscope", "D": "Use a personal account to hide it"}, "answer": ["B"], "multi": false, "rationale": "Policy and minimization first; using personal accounts to evade controls is itself a violation."}, {"n": 152, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which is an INAPPROPRIATE use of Claude in most organizations?", "options": {"A": "Drafting a project update for review", "B": "Producing the final, unreviewed legal opinion sent to a client", "C": "Summarizing a public industry report", "D": "Brainstorming campaign themes"}, "answer": ["B"], "multi": false, "rationale": "Unreviewed professional advice in a regulated domain crosses the line; the others are assistive."}, {"n": 153, "domain": "D6 Governance, Risk & Responsible Use", "stem": "\"Data minimization\" when using AI tools means:", "options": {"A": "Sharing everything for best results", "B": "Sharing only the data the task actually requires — e.g., anonymized excerpts instead of full records", "C": "Using smaller fonts", "D": "Deleting all company data"}, "answer": ["B"], "multi": false, "rationale": "Task-necessary data only; less exposure, same output quality."}, {"n": 154, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A colleague uses a personal free-tier AI account for company documents because \"IT is slow.\" This is:", "options": {"A": "Resourceful", "B": "Shadow AI — it bypasses organizational controls, review, and data protections, and should be raised, not imitated", "C": "Required", "D": "A promotion strategy"}, "answer": ["B"], "multi": false, "rationale": "Unsanctioned tools with company data are a governance breach regardless of intent."}, {"n": 155, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which data types typically require the MOST caution before use with AI tools? (Select TWO)", "options": {"A": "Published marketing brochures", "B": "Health records and other regulated personal data", "C": "Payment card and financial account data", "D": "The public website's FAQ"}, "answer": ["B", "C"], "multi": true, "rationale": "Regulated categories (health, payment/financial identifiers) carry legal regimes; public content doesn't."}, {"n": 156, "domain": "D6 Governance, Risk & Responsible Use", "stem": "An organization's AI policy prohibits client-identifiable data in AI tools. A user needs contract analysis. Compliant approach:", "options": {"A": "Paste the contract with names intact", "B": "Redact/replace identifying details before analysis, or use an approved environment sanctioned for that data class", "C": "Ignore the policy for deadlines", "D": "Have an intern paste it instead"}, "answer": ["B"], "multi": false, "rationale": "Redaction or sanctioned environments reconcile the task with the policy; delegating the violation is still a violation."}, {"n": 157, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Why disclose AI assistance where policy or context requires it?", "options": {"A": "Disclosure is never required anywhere", "B": "Transparency obligations exist in many settings (academic, journalistic, some client and regulatory contexts); misrepresenting authorship creates integrity and trust risk", "C": "To brag", "D": "Disclosure makes content false"}, "answer": ["B"], "multi": false, "rationale": "Where the norm or rule exists, silent AI use is a misrepresentation."}, {"n": 158, "domain": "D6 Governance, Risk & Responsible Use", "stem": "The person accountable for a Claude-drafted document that goes out with an error is:", "options": {"A": "Claude", "B": "The human who reviewed (or failed to review) and sent it — accountability doesn't transfer to the tool", "C": "Anthropic's support team", "D": "Nobody"}, "answer": ["B"], "multi": false, "rationale": "Tools don't hold accountability; senders do. This is the bedrock of responsible use."}, {"n": 159, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which is an ethical concern when using AI for performance review drafts?", "options": {"A": "Fast typing", "B": "Encoded bias in language or emphasis affecting people's careers; drafts need scrutiny for fairness, and judgments must be the manager's own", "C": "Paragraph length", "D": "Using headings"}, "answer": ["B"], "multi": false, "rationale": "People-affecting outputs get bias scrutiny; the assessment itself can't be delegated."}, {"n": 160, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A user is asked to generate content impersonating a real competitor executive \"for fun.\" The correct call:", "options": {"A": "Do it; it's just fun", "B": "Refuse — impersonation of real people creates deception and reputational/legal risk and violates responsible-use norms", "C": "Do it but with a small font disclaimer", "D": "Do it internally only"}, "answer": ["B"], "multi": false, "rationale": "Impersonation is off-limits; framing (\"fun,\" \"internal\") doesn't cure it."}, {"n": 161, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Copyright-aware use of Claude means:", "options": {"A": "Reproducing full articles freely", "B": "Generating original drafts and summaries, not reproducing substantial copyrighted text; respecting licenses on inputs you provide", "C": "Removing author names", "D": "Copyright doesn't apply to AI workflows"}, "answer": ["B"], "multi": false, "rationale": "Original generation and licensed inputs; laundering copied text through AI doesn't change its status."}, {"n": 162, "domain": "D6 Governance, Risk & Responsible Use", "stem": "\"Appropriate use case\" screening asks: (Select TWO)", "options": {"A": "Is the data class permitted for this tool under policy?", "B": "Is the consequence of an error acceptable given the review in place?", "C": "Is the output impressive-looking?", "D": "Will anyone find out?"}, "answer": ["A", "B"], "multi": true, "rationale": "Data permission and error-consequence-vs-controls are the two screening axes; concealment as a criterion signals the use is wrong."}, {"n": 163, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Under privacy expectations in a workplace deployment, the associate should assume:", "options": {"A": "Anything typed is fine because it's \"just a chatbot\"", "B": "Prompts and uploads are organizational data flows subject to the same policies as email and file sharing", "C": "AI tools are outside all policy", "D": "Only attachments count as data"}, "answer": ["B"], "multi": false, "rationale": "The chat box is a data channel; classify it like one."}, {"n": 164, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A regulated firm (finance) wants Claude for client communications. Governance requires:", "options": {"A": "No controls; speed wins", "B": "Alignment with communication compliance rules — review/approval workflows, record-keeping obligations, and restrictions on advice language", "C": "Deleting compliance", "D": "Using it secretly"}, "answer": ["B"], "multi": false, "rationale": "Regulated communication channels keep their compliance requirements when AI-assisted."}, {"n": 165, "domain": "D6 Governance, Risk & Responsible Use", "stem": "The risk of using Claude output as the SOLE basis for a consequential decision:", "options": {"A": "None if it's well formatted", "B": "Unvalidated input to a high-stakes decision — the model may be wrong, and no independent check exists to catch it", "C": "Only cost", "D": "Too much accuracy"}, "answer": ["B"], "multi": false, "rationale": "Sole-source high-stakes reliance removes the error-catching layer entirely."}, {"n": 166, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which practice supports responsible AI use organizationally? (Select TWO)", "options": {"A": "A clear policy on permitted data classes and use cases, communicated to staff", "B": "Training users on failure modes and verification duties", "C": "Punishing anyone who asks questions about the policy", "D": "Keeping the policy secret"}, "answer": ["A", "B"], "multi": true, "rationale": "Policy plus literacy; secrecy and fear produce shadow use."}, {"n": 167, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A user discovers a colleague pasted a customer database export into an AI chat against policy. The right action:", "options": {"A": "Ignore it", "B": "Report through the organization's incident process — a data-handling violation may create disclosure obligations", "C": "Post about it publicly", "D": "Do the same to be fair"}, "answer": ["B"], "multi": false, "rationale": "Data incidents have formal channels; timeliness can be legally material."}, {"n": 168, "domain": "D6 Governance, Risk & Responsible Use", "stem": "\"Ethical implications of AI usage\" includes considering:", "options": {"A": "Nothing beyond speed", "B": "Effects on people: fairness, transparency, accountability, and impact on those the outputs concern", "C": "Only server electricity", "D": "Fonts"}, "answer": ["B"], "multi": false, "rationale": "The ethics lens is people-impact, not just efficiency."}, {"n": 169, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Claude declines a request the user believes is legitimate. The responsible response:", "options": {"A": "Trick it with rephrasing designed to evade the refusal", "B": "Reconsider the request's framing; if genuinely legitimate, provide clarifying context honestly — and accept that some requests are correctly out of bounds", "C": "Threaten the model", "D": "Use a jailbreak from a forum"}, "answer": ["B"], "multi": false, "rationale": "Honest clarification is legitimate; engineered evasion of safety boundaries is a policy violation."}, {"n": 170, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Confidential M&A information should be used with Claude:", "options": {"A": "Freely on any account", "B": "Only within environments and terms your organization has approved for that sensitivity level — and often not at all before disclosure rules allow", "C": "On a personal phone for privacy", "D": "After posting to the group chat"}, "answer": ["B"], "multi": false, "rationale": "Deal-sensitive information carries securities and confidentiality constraints that dominate convenience."}, {"n": 171, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which statement about AI-generated content and misinformation is correct?", "options": {"A": "AI content is inherently true", "B": "Fluent generation makes producing false-but-plausible content cheap; the user's duty to verify before amplifying increases, not decreases", "C": "Misinformation is the reader's problem", "D": "Speed excuses errors"}, "answer": ["B"], "multi": false, "rationale": "Cheap fluency raises the verification obligation on the publisher."}, {"n": 172, "domain": "D6 Governance, Risk & Responsible Use", "stem": "An \"acceptable use\" red flag in a request is:", "options": {"A": "Asking for a summary", "B": "Asking to conceal AI involvement where disclosure is required, or to target/deceive specific people", "C": "Asking for citations", "D": "Asking for a table"}, "answer": ["B"], "multi": false, "rationale": "Concealment-where-disclosure-is- owed and targeting/deception are the classic red flags."}, {"n": 173, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Retention awareness: chat history and uploads should be treated as:", "options": {"A": "Instantly self- destructing always", "B": "Potentially retained data governed by the product's settings and the org's agreements — know the actual retention posture before sharing sensitive content", "C": "Public by default", "D": "Printed nightly"}, "answer": ["B"], "multi": false, "rationale": "The tested behavior is checking the real retention/settings posture, not assuming either extreme."}, {"n": 174, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Fairness check on Claude-drafted customer eligibility criteria:", "options": {"A": "Ship if grammatical", "B": "Review for proxies that disadvantage protected groups (e.g., geography or language as proxies) and confirm criteria are business-justified", "C": "Add more criteria for rigor", "D": "Randomize eligibility"}, "answer": ["B"], "multi": false, "rationale": "Proxy discrimination is the subtle failure; business justification is the test."}, {"n": 175, "domain": "D6 Governance, Risk & Responsible Use", "stem": "The correct posture on \"Claude said it, so we're covered\":", "options": {"A": "Accurate — the vendor is liable", "B": "False — the organization owns its outputs and decisions; tool assistance is not a liability shield", "C": "True for small errors", "D": "True if screenshotted"}, "answer": ["B"], "multi": false, "rationale": "No output- laundering: responsibility stays with the deploying organization."}, {"n": 176, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which is a legitimate governance control for AI-assisted external content? (Select TWO)", "options": {"A": "Named approver sign-off before publication", "B": "A log or record of what was AI- assisted where policy requires it", "C": "Prohibiting all sentences over five words", "D": "Approving content by coin flip"}, "answer": ["A", "B"], "multi": true, "rationale": "Ownership and traceability are real controls; arbitrary style bans are not governance."}, {"n": 177, "domain": "D6 Governance, Risk & Responsible Use", "stem": "A nonprofit wants to use Claude on beneficiary case files containing sensitive personal histories. The primary consideration:", "options": {"A": "Speed of processing", "B": "Consent, data- protection obligations, and minimization — vulnerable-population data raises the bar; process only what's permitted, ideally de-identified", "C": "Making the files public for transparency", "D": "None; nonprofits are exempt from privacy law"}, "answer": ["B"], "multi": false, "rationale": "Sensitivity of subjects raises duties; nonprofit status exempts nothing."}, {"n": 178, "domain": "D6 Governance, Risk & Responsible Use", "stem": "\"Follow organisational AI policies\" when the policy is silent on a new use case means:", "options": {"A": "Silence is permission for anything", "B": "Escalate/ask the policy owner before proceeding with anything sensitive — silence is a gap, not a green light", "C": "Never use AI again", "D": "Invent a policy personally"}, "answer": ["B"], "multi": false, "rationale": "Gaps route to the governance owner; the cautious default applies to sensitive uses."}, {"n": 179, "domain": "D6 Governance, Risk & Responsible Use", "stem": "Which describes responsible handling of Claude's uncertainty?", "options": {"A": "Strip all uncertainty language to look decisive", "B": "Preserve genuine uncertainty flags into the downstream document or resolve them by verification before removing them", "C": "Convert uncertainty to confident claims", "D": "Uncertainty is a bug to hide"}, "answer": ["B"], "multi": false, "rationale": "Uncertainty flags are work items: verify-then-remove or carry forward, never silently delete."}, {"n": 180, "domain": "D6 Governance, Risk & Responsible Use", "stem": "The summary principle of Domain 6:", "options": {"A": "Governance exists to slow people down", "B": "Use the tool where policy permits, with data it's permitted to see, with review proportionate to consequence, with accountability staying human", "C": "Rules don't apply if output quality is high", "D": "Risk is IT's problem only"}, "answer": ["B"], "multi": false, "rationale": "Permission, data class, proportionate review, human accountability — the four-part test. Domain 7 — Troubleshooting and Optimisation (Q181–Q200)"}, {"n": 181, "domain": "D7 Troubleshooting & Optimisation", "stem": "Output is generic and unhelpful. The FIRST diagnostic question:", "options": {"A": "Is the model broken?", "B": "Did my prompt provide the specific context, constraints, and success criteria the task needs?", "C": "Is the internet slow?", "D": "Should I sue?"}, "answer": ["B"], "multi": false, "rationale": "Generic output almost always traces to generic input; check the prompt before the tool."}, {"n": 182, "domain": "D7 Troubleshooting & Optimisation", "stem": "Output is detailed but answers the WRONG question. Likely cause and fix:", "options": {"A": "Claude is contrarian; give up", "B": "Ambiguous phrasing was interpreted differently than intended; restate the request explicitly, including what you do NOT want", "C": "The topic is impossible", "D": "Ask the same words louder"}, "answer": ["B"], "multi": false, "rationale": "Misinterpretation is a prompt-clarity failure; disambiguate rather than repeat."}, {"n": 183, "domain": "D7 Troubleshooting & Optimisation", "stem": "Claude keeps producing output in the wrong structure despite corrections. Escalating fixes, in order:", "options": {"A": "Random changes", "B": "Show an explicit example of the desired structure → move the format rule into Project instructions → start a fresh conversation if accumulated context is fighting you", "C": "Switch careers", "D": "Remove all instructions"}, "answer": ["B"], "multi": false, "rationale": "Example → persistent instruction → context reset is the standard escalation ladder."}, {"n": 184, "domain": "D7 Troubleshooting & Optimisation", "stem": "Responses degrade late in a very long conversation (forgetting, repetition). Best move:", "options": {"A": "Continue indefinitely", "B": "Summarize decisions and constraints, restart fresh with the summary as the seed", "C": "Type slower", "D": "Blame the keyboard"}, "answer": ["B"], "multi": false, "rationale": "Context- window saturation is fixed by reset-with-summary, not persistence."}, {"n": 185, "domain": "D7 Troubleshooting & Optimisation", "stem": "A prompt works for one document type but fails on another. Diagnosis:", "options": {"A": "Claude dislikes the second type", "B": "The prompt encoded assumptions from the first type (structure, vocabulary); generalize the prompt or branch it per document type", "C": "Documents are all the same", "D": "Randomness"}, "answer": ["B"], "multi": false, "rationale": "Prompts overfit to the inputs they were tuned on; new input classes need adjusted prompts."}, {"n": 186, "domain": "D7 Troubleshooting & Optimisation", "stem": "Which change most reliably improves an underperforming analysis prompt?", "options": {"A": "Adding \"please\" three times", "B": "Adding the missing ingredients: relevant data/context, explicit evaluation criteria, and the required output structure", "C": "Changing to a whisper", "D": "Bold text"}, "answer": ["B"], "multi": false, "rationale": "Missing context, criteria, or structure explains most analysis-quality complaints."}, {"n": 187, "domain": "D7 Troubleshooting & Optimisation", "stem": "Claude's answer about your uploaded spreadsheet is wrong. First checks: (Select TWO)", "options": {"A": "Whether the upload actually contains the data you think it does (right file, right tab/version)", "B": "Whether the question named the specific columns/ranges or left Claude to guess scope", "C": "Whether the moon phase is favorable", "D": "Whether the answer is bold"}, "answer": ["A", "B"], "multi": true, "rationale": "Wrong-input and underspecified-scope are the two dominant causes of wrong data answers."}, {"n": 188, "domain": "D7 Troubleshooting & Optimisation", "stem": "When a task consistently fails as one big prompt, the optimisation is:", "options": {"A": "Bigger single prompt", "B": "Decompose: run it as sequential steps with checkable intermediate outputs", "C": "Abandon the task", "D": "Delete the data"}, "answer": ["B"], "multi": false, "rationale": "Decomposition localizes failure and makes each step verifiable."}, {"n": 189, "domain": "D7 Troubleshooting & Optimisation", "stem": "\"Adjust approach based on feedback and results\" means:", "options": {"A": "Change nothing; consistency is virtue", "B": "Treat each unsatisfactory output as diagnostic data: identify WHAT was wrong (facts? scope? tone? structure?) and change the corresponding input", "C": "Change everything at once randomly", "D": "Only change the model"}, "answer": ["B"], "multi": false, "rationale": "Targeted, single- variable adjustment beats random thrashing."}, {"n": 190, "domain": "D7 Troubleshooting & Optimisation", "stem": "A team's Claude workflow is accurate but slow because every output goes through three redundant review layers. Optimisation:", "options": {"A": "Remove all review", "B": "Right-size review to risk: keep full review for external/high-stakes output, lighten it for low-stakes internal drafts, and measure the effect", "C": "Add a fourth layer", "D": "Review reviews of reviews"}, "answer": ["B"], "multi": false, "rationale": "Optimisation cuts redundancy while keeping consequence-proportionate control."}, {"n": 191, "domain": "D7 Troubleshooting & Optimisation", "stem": "Claude refuses a legitimate business request. Sensible first response:", "options": {"A": "Repeat verbatim angrily", "B": "Add clarifying context that makes the legitimate purpose and scope explicit — ambiguous requests can pattern-match to disallowed ones", "C": "Look for evasion scripts", "D": "Delete the account"}, "answer": ["B"], "multi": false, "rationale": "Honest context resolves most false-positive refusals; evasion is a policy violation (see Q169)."}, {"n": 192, "domain": "D7 Troubleshooting & Optimisation", "stem": "Outputs vary in quality across days for the same recurring task. A stabilizing fix:", "options": {"A": "Accept chaos", "B": "Lock the stable parts into a template/Project instruction (structure, criteria, examples) so only the changing data varies per run", "C": "Change the task daily", "D": "Ask at midnight only"}, "answer": ["B"], "multi": false, "rationale": "Variance shrinks when the constant elements stop being retyped inconsistently."}, {"n": 193, "domain": "D7 Troubleshooting & Optimisation", "stem": "A user gets better results by pasting one 5-line example than by three paragraphs of description. Lesson:", "options": {"A": "Examples are cheating", "B": "Demonstration often communicates format and quality standards more precisely than description — lead with an example when structure matters", "C": "Descriptions are always better", "D": "Both are useless"}, "answer": ["B"], "multi": false, "rationale": "Show- don't-tell is a core optimisation lever."}, {"n": 194, "domain": "D7 Troubleshooting & Optimisation", "stem": "After a prompt edit, output improved on criterion A but regressed on criterion B. Correct practice:", "options": {"A": "Ship the regression", "B": "Note the interaction, restate BOTH criteria explicitly in the prompt, and re-test — improvements shouldn't be accepted on one axis blind to others", "C": "Remove criterion B", "D": "Alternate outputs"}, "answer": ["B"], "multi": false, "rationale": "Multi-criteria tasks need all criteria stated and checked after each change."}, {"n": 195, "domain": "D7 Troubleshooting & Optimisation", "stem": "The output is factually fine but far too long for its purpose. Optimisation:", "options": {"A": "Ask readers to skim", "B": "Constrain in the prompt: audience, purpose, and hard length target, with what must be preserved", "C": "Delete random paragraphs", "D": "Smaller font"}, "answer": ["B"], "multi": false, "rationale": "Length is a specification problem; fix the spec."}, {"n": 196, "domain": "D7 Troubleshooting & Optimisation", "stem": "Which symptom → cause mapping is CORRECT?", "options": {"A": "Invented specifics → too much context provided", "B": "Ignoring an instruction buried mid-conversation → instruction lost in long context; move it to instructions or restate at point of use", "C": "Wrong format → the model can't do formats", "D": "Refusal → the model is broken"}, "answer": ["B"], "multi": false, "rationale": "Instruction salience decays in long context; relocation is the fix."}, {"n": 197, "domain": "D7 Troubleshooting & Optimisation", "stem": "A user wants to know if their prompt change actually helped. Minimal valid test:", "options": {"A": "Vibes", "B": "Run old and new prompts on the same input(s) and compare against defined criteria", "C": "Run the new prompt once on a new input", "D": "Ask a friend which prompt looks smarter"}, "answer": ["B"], "multi": false, "rationale": "Controlled comparison: same inputs, stated criteria; otherwise you're measuring noise."}, {"n": 198, "domain": "D7 Troubleshooting & Optimisation", "stem": "Recurring small corrections the user makes by hand every time (e.g., fixing the date format) should be:", "options": {"A": "Accepted as fate", "B": "Encoded once as an instruction/template rule so the correction stops recurring", "C": "Done faster by hand", "D": "Ignored"}, "answer": ["B"], "multi": false, "rationale": "Repeated manual fixes are unencoded requirements; move them upstream."}, {"n": 199, "domain": "D7 Troubleshooting & Optimisation", "stem": "When troubleshooting, the order of suspects for a bad output is:", "options": {"A": "Model conspiracy → weather → prompt", "B": "Prompt clarity/context → input data correctness → feature/model fit → conversation state (context length) — in roughly that order", "C": "Always the model first", "D": "Always the user's colleagues"}, "answer": ["B"], "multi": false, "rationale": "Cheap, likely causes first; this ordering resolves most issues before touching model choice."}, {"n": 200, "domain": "D7 Troubleshooting & Optimisation", "stem": "The Domain 7 meta-skill the exam is testing:", "options": {"A": "Memorizing error codes", "B": "Treating unsatisfactory output as a debuggable system — isolate the variable (prompt, data, feature, context), change it deliberately, verify the effect", "C": "Escalating everything to IT", "D": "Restarting the computer"}, "answer": ["B"], "multi": false, "rationale": "Systematic diagnosis over superstition; that's the whole domain. Supplement — Current Model Lineup (Q201–Q210, BEYOND BLUEPRINT) The v1.0 blueprint names only Haiku, Sonnet, Opus. As of September 2026 the public lineup is: Haiku 4.5 → Sonnet 5 → Opus 5.5 → Fable 5 / Fable 5.1 (the Fable tier sits above Opus; the restricted Mythos tier shares Fable's underlying model with fewer safety gates and is limited-access). These questions cover the current reality in case live exam items have been refreshed — and because it's what you actually use at work."}, {"n": 201, "domain": "bonus:current-models", "stem": "As of 2026, where does the Fable tier sit in Anthropic's model lineup?", "options": {"A": "Below Haiku", "B": "Between Haiku and Sonnet", "C": "Above Opus, as the most capable publicly available tier", "D": "It's a code-only model"}, "answer": ["C"], "multi": false, "rationale": "Fable was introduced in June 2026 as a tier above Opus."}, {"n": 202, "domain": "bonus:current-models", "stem": "The relationship between Claude Fable and Claude Mythos is:", "options": {"A": "Unrelated products", "B": "Same underlying model; Fable carries additional safety measures (bio, cyber, LLM R&", "D": "Fable is Mythos renamed", "C": "Mythos is the cheaper one"}, "answer": ["B"], "multi": false, "rationale": "Same model, different safety posture and availability."}, {"n": 203, "domain": "bonus:current-models", "stem": "With a four-tier public lineup (Haiku 4.5, Sonnet 5, Opus 5.5, Fable), the selection principle from Domain 3:", "options": {"A": "Changes completely", "B": "Is unchanged — match capability to task complexity and stakes; more tiers just gives finer-grained cost/quality tradeoffs", "C": "Means always use Fable", "D": "Means tiers no longer matter"}, "answer": ["B"], "multi": false, "rationale": "New name {"url": "https://agentfactory.panaversity.org/docs/how-to-think-ai-era", "title": "How to Think in the AI Era"}, "D3 Product & Model Selection": {"url": "https://agentfactory.panaversity.org/docs/token-economics-crash-course", "title": "Token Economics: Which Model for Which Work"}, "D4 Workflow Integration & Solution Design": {"url": "https://agentfactory.panaversity.org/docs/workflow-design-diagnosis-crash-course", "title": "Workflow Design & Diagnosis"}, "D5 Configuration & Knowledge Management": {"url": "https://agentfactory.panaversity.org/docs/claude-chatgpt-101-crash-course", "title": "ChatGPT & Claude Quick Reference"}, "D6 Governance, Risk & Responsible Use": {"url": "https://agentfactory.panaversity.org/docs/ai-fluency-crash-course", "title": "AI Fluency: A Crash Course"}, "D7 Troubleshooting & Optimisation": {"url": "https://agentfactory.panaversity.org/docs/workflow-design-diagnosis-crash-course", "title": "Workflow Design & Diagnosis"}}, "lessons_verified": "2026-09-30: each URL fetched, HTTP 200, live title confirmed"};
const Q = CERT.questions;
const BLUEPRINT = Q.filter(q=>!q.domain.startsWith('bonus'));
const BONUS = Q.filter(q=>q.domain.startsWith('bonus'));
const DOMAINS = [...new Set(BLUEPRINT.map(q=>q.domain))];
const W = CERT.blueprint_weights_pct;
document.getElementById('sub').textContent = '· '+CERT.id;
document.getElementById('hstat').textContent = Q.length+' questions ('+BLUEPRINT.length+' blueprint + '+BONUS.length+' bonus)';
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- scoring core: exact-set + FAIL-CLOSED (invalid/empty never a silent pass) ----
function scoreItem(q, selected){
  if(!q.answer || q.answer.length===0) return {status:'invalid', correct:false};   // AC6: null-key BLOCKS
  if(!selected || selected.length===0) return {status:'unanswered', correct:false};
  const key=[...q.answer].sort().join(','), sel=[...selected].sort().join(',');
  return {status:'answered', correct:key===sel};
}
// ---- exam generation: 60 items, weighted by blueprint (largest-remainder to hit exactly 60) ----
function allocate(total){
  const raw = DOMAINS.map(d=>({d, exact: total*(W[d]||0)/100}));
  const alloc = raw.map(r=>({d:r.d, n:Math.floor(r.exact), rem:r.exact-Math.floor(r.exact)}));
  let used = alloc.reduce((s,a)=>s+a.n,0);
  alloc.sort((a,b)=>b.rem-a.rem);
  for(let i=0; used<total; i++,used++) alloc[i%alloc.length].n++;
  const m={}; alloc.forEach(a=>m[a.d]=a.n); return m;
}
function sample(arr,n){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}
function buildExam(){
  const m=allocate(60), items=[];
  DOMAINS.forEach(d=>items.push(...sample(BLUEPRINT.filter(q=>q.domain===d), m[d])));
  return sample(items, items.length); // shuffle order
}

// ---------- HOME ----------
function home(){
  app.innerHTML =
   `<div class="grid">
     <div class="tile" id="tDrill"><h3>Drill by domain</h3><div class="sm mut">Instant feedback + rationale. Pick a domain and work through it.</div></div>
     <div class="tile" id="tExam"><h3>Exam simulator</h3><div class="sm mut">60 items, weighted to the blueprint, 120-min timer, scaled score (pass 720/1000).</div></div>
   </div>
   <div class="card sm mut">Real exam: ${CERT.exam.items} items · ${CERT.exam.minutes} min · pass ${CERT.exam.pass_score}/${CERT.exam.scale_max}. Practice bank, not real items.</div>`;
  document.getElementById('tDrill').onclick=drillPick;
  document.getElementById('tExam').onclick=()=>examStart();
}
// ---------- DRILL ----------
function drillPick(){
  const tiles = DOMAINS.map(d=>`<div class="tile dsel" data-d="${esc(d)}"><h3>${esc(d)}</h3><div class="sm mut">${BLUEPRINT.filter(q=>q.domain===d).length} questions</div></div>`).join('');
  const bonus = BONUS.length?`<div class="tile dsel" data-d="__bonus"><h3>Bonus: current model lineup</h3><div class="sm mut">${BONUS.length} questions</div></div>`:'';
  app.innerHTML = `<div class="row" style="margin-top:0"><button class="ghost" id="back">← Home</button></div><div class="grid" style="margin-top:12px">${tiles}${bonus}</div>`;
  document.getElementById('back').onclick=home;
  document.querySelectorAll('.dsel').forEach(t=>t.onclick=()=>{
    const d=t.dataset.d; const pool = d==='__bonus'?BONUS:BLUEPRINT.filter(q=>q.domain===d);
    drillRun(sample(pool,pool.length), 0, {right:0,seen:0});
  });
}
function drillRun(list, i, tally){
  if(i>=list.length){ app.innerHTML=`<div class="card"><h3>Domain complete</h3><p>${tally.right}/${tally.seen} correct.</p><div class="row"><button id="again">Another domain</button><button class="ghost" id="home">Home</button></div></div>`;
    document.getElementById('again').onclick=drillPick; document.getElementById('home').onclick=home; return; }
  const q=list[i]; const type=q.multi?'checkbox':'radio'; let done=false;
  const opts=Object.keys(q.options).sort().map(lt=>`<label class="opt" data-lt="${lt}"><input type="${type}" name="opt" value="${lt}"><span class="lt">${lt}</span><span>${esc(q.options[lt])}</span></label>`).join('');
  app.innerHTML=`<div class="prog"><i style="width:${100*i/list.length}%"></i></div>
    <div class="card"><span class="badge">${esc(q.domain)}</span><div class="qn">Question ${q.n} · ${i+1} of ${list.length}</div>
    ${q.multi?'<div class="multi">Select all that apply</div>':''}<div class="stem">${esc(q.stem)}</div>${opts}
    <div class="row"><button id="check">Check</button><button class="ghost" id="skip">Skip</button></div><div id="fb"></div></div>`;
  document.getElementById('skip').onclick=()=>drillRun(list,i+1,tally);
  document.getElementById('check').onclick=()=>{
    if(done)return;
    const sel=[...document.querySelectorAll('input[name=opt]:checked')].map(x=>x.value);
    const r=scoreItem(q,sel); const fb=document.getElementById('fb');
    if(r.status==='invalid'){fb.innerHTML=`<div class="verdict no">This question has no answer key — blocked (fail-closed).</div>`;return;}
    if(r.status==='unanswered'){fb.innerHTML=`<div class="verdict warn">Select an answer first.</div>`;return;}
    done=true; tally.seen++; if(r.correct)tally.right++;
    document.querySelectorAll('.opt').forEach(el=>{const lt=el.dataset.lt; if(q.answer.includes(lt))el.classList.add('correct'); else if(sel.includes(lt))el.classList.add('wrong');});
    fb.innerHTML=`<div class="verdict ${r.correct?'ok':'no'}">${r.correct?'Correct':'Incorrect'} — answer: ${q.answer.join(', ')}</div><div class="rat">${esc(q.rationale)}</div><div class="row"><button id="next">Next →</button></div>`;
    document.getElementById('next').onclick=()=>drillRun(list,i+1,tally);
  };
}
// ---------- EXAM SIM ----------
let EX=null;
function examStart(){
  const items=buildExam();
  EX={items, answers:{}, i:0, endAt:Date.now()+CERT.exam.minutes*60000, timer:null};
  EX.timer=setInterval(tick,1000); examRun();
}
function tick(){
  const left=Math.max(0,EX.endAt-Date.now()); const el=document.getElementById('timer');
  if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`${m}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',left<300000);}
  if(left<=0){clearInterval(EX.timer); examSubmit();}
}
function examRun(){
  const q=EX.items[EX.i]; const type=q.multi?'checkbox':'radio'; const cur=EX.answers[q.n]||[];
  const opts=Object.keys(q.options).sort().map(lt=>`<label class="opt ${cur.includes(lt)?'picked':''}" data-lt="${lt}"><input type="${type}" name="opt" value="${lt}" ${cur.includes(lt)?'checked':''}><span class="lt">${lt}</span><span>${esc(q.options[lt])}</span></label>`).join('');
  app.innerHTML=`<div class="row" style="margin-top:0;justify-content:space-between"><span class="sm mut">Item ${EX.i+1} of ${EX.items.length}</span><span class="timer" id="timer">–</span></div>
    <div class="prog"><i style="width:${100*(EX.i+1)/EX.items.length}%"></i></div>
    <div class="card"><span class="badge">${esc(q.domain)}</span>${q.multi?'<div class="multi">Select all that apply</div>':''}<div class="stem">${esc(q.stem)}</div>${opts}</div>
    <div class="row"><button class="ghost" id="prev" ${EX.i===0?'disabled':''}>← Prev</button>
    ${EX.i<EX.items.length-1?'<button id="next">Next →</button>':'<button id="submit">Submit exam</button>'}
    <span class="sm mut">${Object.keys(EX.answers).length}/${EX.items.length} answered</span></div>`;
  tick();
  function save(){EX.answers[q.n]=[...document.querySelectorAll('input[name=opt]:checked')].map(x=>x.value); if(EX.answers[q.n].length===0)delete EX.answers[q.n];}
  const nx=document.getElementById('next'), pv=document.getElementById('prev'), sb=document.getElementById('submit');
  if(nx)nx.onclick=()=>{save();EX.i++;examRun();};
  if(pv)pv.onclick=()=>{save();EX.i--;examRun();};
  if(sb)sb.onclick=()=>{save(); if(confirm('Submit and score?')){clearInterval(EX.timer);examSubmit();}};
}
function examSubmit(){
  // fail-closed: any item with no key blocks scoring (AC6)
  const invalid=EX.items.filter(q=>!q.answer||q.answer.length===0);
  if(invalid.length){app.innerHTML=`<div class="card err"><h3>Scoring blocked (fail-closed)</h3><p>${invalid.length} item(s) have no answer key: ${invalid.map(q=>'Q'+q.n).join(', ')}. A score is not computed on an invalid key.</p><div class="row"><button id="home">Home</button></div></div>`;document.getElementById('home').onclick=home;return;}
  const byDom={}; DOMAINS.forEach(d=>byDom[d]={right:0,total:0});
  let right=0;
  EX.items.forEach(q=>{const r=scoreItem(q,EX.answers[q.n]); byDom[q.domain].total++; if(r.correct){right++;byDom[q.domain].right++;}});
  const scaled=Math.round(1000*right/EX.items.length); const pass=scaled>=CERT.exam.pass_score;
  const weak=DOMAINS.map(d=>({d,pct:byDom[d].total?byDom[d].right/byDom[d].total:1,...byDom[d]})).filter(x=>x.total).sort((a,b)=>a.pct-b.pct);
  const rows=weak.map(x=>`<div class="dl"><span>${esc(x.d)}</span><span class="mut">${x.right}/${x.total} · ${Math.round(x.pct*100)}%</span></div><div class="bar"><i style="width:${Math.round(x.pct*100)}%;background:${x.pct<0.7?'var(--no)':'var(--ok)'}"></i></div>`).join('');
  const weakest=weak.filter(x=>x.pct<0.7).slice(0,3).map(x=>x.d);
  app.innerHTML=`<div class="card" style="text-align:center">
    <div class="sm mut">Scaled score (approx: linear from raw ${right}/${EX.items.length})</div>
    <div class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${scaled}</div>
    <div class="verdict ${pass?'ok':'no'}">${pass?'PASS':'BELOW PASS'} · need ${CERT.exam.pass_score}/${CERT.exam.scale_max}</div></div>
    <div class="card"><h3 style="margin-top:0">By domain</h3>${rows}</div>
    <div class="card"><h3 style="margin-top:0">Study next</h3>${weakest.length?('<div class="sm mut">Weakest domains — review these lessons:</div><ul>'+weakest.map(d=>{const L=CERT.lessons&&CERT.lessons[d];return '<li>'+esc(d)+(L?' — <a href="'+L.url+'" target="_blank" rel="noopener">'+esc(L.title)+'</a>':'')+'</li>';}).join('')+'</ul>'):'<div class="sm mut">No domain below 70%. Solid — keep drilling to stay sharp.</div>'}</div>
    <div class="row"><button id="again">New exam</button><button class="ghost" id="home">Home</button></div>`;
  document.getElementById('again').onclick=()=>examStart();
  document.getElementById('home').onclick=home;
}
// test hooks
window.__app={home,drillPick,examStart,examSubmit,examRun,buildExam,allocate,scoreItem,DOMAINS,BLUEPRINT,BONUS,getEX:()=>EX,setEX:v=>EX=v};
home();
</script></body></html>
