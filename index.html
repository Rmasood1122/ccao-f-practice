<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAO-F Practice</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaed;--mut:#9aa3af;--line:#2a2f3a;--acc:#6ea8fe;--ok:#3fb950;--no:#f85149;--warn:#d29922}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--mut:#5b636e;--line:#e3e6ea;--acc:#2563eb;--ok:#1a7f37;--no:#d1242f;--warn:#9a6700}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 72px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650}
.mut{color:var(--mut)} .sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.badge{display:inline-block;font-size:12px;color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:10px}
.qn{color:var(--mut);font-size:13px}
.stem{font-size:16.5px;margin:6px 0 14px;font-weight:550}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)} .opt input{margin-top:3px} .opt .lt{font-weight:650;min-width:16px}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 9%,transparent)}
.opt.picked{border-color:var(--acc)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;border-radius:9px;border:1px solid var(--line);padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff;border-color:transparent}
button.ghost{background:transparent;color:var(--ink)} button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:var(--card)}
.tile:hover{border-color:var(--acc)} .tile h3{margin:0 0 4px;font-size:15px}
.verdict{margin-top:14px;font-weight:650}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}.verdict.warn{color:var(--warn)}
.rat{margin-top:8px;color:var(--mut);font-size:14.5px;border-left:3px solid var(--line);padding-left:12px}
.multi{color:var(--acc);font-size:12.5px;margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 2px}
.bar>i{display:block;height:100%;background:var(--acc)}
.dl{display:flex;justify-content:space-between;font-size:14px;margin:10px 0 2px}
.big{font-size:40px;font-weight:720;line-height:1} .timer{font-variant-numeric:tabular-nums;font-weight:650}
.timer.low{color:var(--no)}
a{color:var(--acc)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog>i{display:block;height:100%;background:var(--acc)}
.err{border-color:var(--no)} .err h3{color:var(--no)}
</style></head>

<header><h1>CCAO-F Practice <span class="sm mut" id="sub"></span></h1><span class="sm mut" id="hstat"></span></header>
<div id="app"></div>
</div>
<script>
const CERT = {"id": "CCAO-F", "title": "Claude Certified Associate – Foundations", "exam": {"items": 60, "minutes": 120, "scale_max": 1000, "pass_score": 720, "note": "multiple-choice and multiple-response; scaled score"}, "blueprint_weights_pct": {"D1 Prompting & Task Execution": 14, "D2 Output Evaluation & Validation": 21, "D3 Product & Model Selection": 12, "D4 Workflow Integration & Solution Design": 16, "D5 Configuration & Knowledge Management": 12, "D6 Governance, Risk & Responsible Use": 15, "D7 Troubleshooting & Optimisation": 10}, "bonus_group": "bonus:current-models", "key_provenance": "verified 2026-09-30: blind independent solve (4 agents + reviewer) agreed 210/210 with the bank's stated keys; spot-checks Q4/Q31/Q74 grounded against the Agent Factory curriculum connector", "counts": {"total": 210, "blueprint": 200, "bonus": 10, "multi_response": 16}, "questions": [{"n": 1, "domain": "D1 Prompting & Task Execution", "stem": "A marketing manager asks Claude: \"Write something about our product launch.\" The output is generic. What is the single highest-impact fix?", "options": {"A": "Ask Claude to try again", "B": "Add context: audience, product details, channel, tone, and length", "C": "Switch to a more powerful model", "D": "Break the request into ten separate messages"}, "answer": ["B"], "multi": false, "rationale": "Generic input produces generic output; specificity of context is the first lever, before model changes or retries."}, {"n": 2, "domain": "D1 Prompting & Task Execution", "stem": "Which prompt is best structured for a business analysis task?", "options": {"A": "\"Analyze our sales.\"", "B": "\"You're a genius analyst. Analyze sales. Be thorough.\"", "C": "\"Analyze the attached Q3 sales data. Identify the top 3 declining product lines, likely causes based on the data, and one recommendation each. Format as a table.\"", "D": "\"Please analyze the attached sales data and tell me everything important about it in as much detail as possible.\""}, "answer": ["C"], "multi": false, "rationale": "It specifies input, scope, deliverable, and format; flattery (B) and open-ended maximalism (D) don't constrain the output."}, {"n": 3, "domain": "D1 Prompting & Task Execution", "stem": "A user needs Claude to produce a 40-page employee handbook. The best approach is:", "options": {"A": "One prompt asking for the full handbook", "B": "Ask for an outline first, approve it, then generate section by section", "C": "Ask Claude to write it twice and merge", "D": "Upload a competitor's handbook and ask for a copy"}, "answer": ["B"], "multi": false, "rationale": "Task decomposition: approving structure before content catches misinterpretation early and keeps each generation within quality limits. D is also an IP problem."}, {"n": 4, "domain": "D1 Prompting & Task Execution", "stem": "What is the main purpose of giving Claude examples of desired output (few-shot prompting)?", "options": {"A": "It makes responses longer", "B": "It shows format, tone, and level of detail more precisely than describing them", "C": "It is required for Claude to respond at all", "D": "It reduces cost"}, "answer": ["B"], "multi": false, "rationale": "Examples communicate implicit requirements that are hard to state in words."}, {"n": 5, "domain": "D1 Prompting & Task Execution", "stem": "A prompt returns an answer in the wrong format. The fastest correction is:", "options": {"A": "Start a new conversation", "B": "Reply specifying the exact format, ideally with a short example", "C": "Report a bug", "D": "Repeat the identical prompt"}, "answer": ["B"], "multi": false, "rationale": "Iteration in-conversation preserves context; identical prompts get similar output."}, {"n": 6, "domain": "D1 Prompting & Task Execution", "stem": "For a brainstorming task, which instruction improves results most?", "options": {"A": "\"Give me the one correct answer.\"", "B": "\"Generate 20 distinct ideas across conventional, unconventional, and low-budget categories. Don't evaluate them yet.\"", "C": "\"Be creative.\"", "D": "\"Answer in one sentence.\""}, "answer": ["B"], "multi": false, "rationale": "Brainstorming benefits from explicit quantity, diversity axes, and deferred judgment; \"be creative\" is not an operational instruction."}, {"n": 7, "domain": "D1 Prompting & Task Execution", "stem": "Which element is MISSING from this prompt? \"Summarize the attached 30-page contract for our operations team.\"", "options": {"A": "The input source", "B": "The audience", "C": "The desired length/depth of the summary", "D": "The task verb"}, "answer": ["C"], "multi": false, "rationale": "Input, audience, and task are stated; without length/depth the output could be one paragraph or ten pages."}, {"n": 8, "domain": "D1 Prompting & Task Execution", "stem": "When asking Claude to draft a sensitive email declining a partnership, the best practice is to:", "options": {"A": "Send Claude's first draft immediately", "B": "Provide the relationship context and desired tone, then review and edit before sending", "C": "Ask Claude to send the email", "D": "Avoid using Claude for emails"}, "answer": ["B"], "multi": false, "rationale": "Claude drafts; the human owns context, judgment, and the send decision."}, {"n": 9, "domain": "D1 Prompting & Task Execution", "stem": "A user wants analysis of a problem before recommendations. Which instruction achieves this?", "options": {"A": "\"Give recommendations.\"", "B": "\"First list the key factors and constraints, then analyze each, and only then give recommendations based on that analysis.\"", "C": "\"Be logical.\"", "D": "\"Think hard.\""}, "answer": ["B"], "multi": false, "rationale": "Explicitly sequencing reasoning steps in the prompt shapes the response structure; vague exhortations don't."}, {"n": 10, "domain": "D1 Prompting & Task Execution", "stem": "What does \"iterating a prompt\" mean in practice?", "options": {"A": "Sending the same prompt until the answer changes", "B": "Refining instructions across turns based on what the previous output got wrong", "C": "Copying the prompt into multiple chats", "D": "Making the prompt longer every time regardless of results"}, "answer": ["B"], "multi": false, "rationale": "Iteration is targeted correction, not repetition or padding."}, {"n": 11, "domain": "D1 Prompting & Task Execution", "stem": "For a research task (\"What are current trends in retail logistics?\"), which addition most improves reliability?", "options": {"A": "\"Use web search and cite your sources.\"", "B": "\"Answer from memory only.\"", "C": "\"Be confident.\"", "D": "\"Answer in bullet points.\""}, "answer": ["A"], "multi": false, "rationale": "Current-state questions need current sources; citations make the output checkable."}, {"n": 12, "domain": "D1 Prompting & Task Execution", "stem": "A user pastes a long document and asks three unrelated questions in one message. Outputs are shallow. Better approach:", "options": {"A": "Ask all three again in caps", "B": "Ask the questions one at a time, letting each answer complete before the next", "C": "Delete the document", "D": "Ask Claude to answer faster"}, "answer": ["B"], "multi": false, "rationale": "One task per turn gets full attention per question; bundling dilutes depth."}, {"n": 13, "domain": "D1 Prompting & Task Execution", "stem": "Which negative constraint is most useful when asking Claude to edit a report?", "options": {"A": "\"Don't be boring.\"", "B": "\"Do not change the numbers or the section order; edit only for clarity and grammar.\"", "C": "\"Don't take too long.\"", "D": "\"Don't use AI language.\""}, "answer": ["B"], "multi": false, "rationale": "Concrete prohibitions protect what must not change; vague ones aren't enforceable."}, {"n": 14, "domain": "D1 Prompting & Task Execution", "stem": "A prompt for competitive analysis should include which of the following? (Select TWO)", "options": {"A": "Which competitors to cover", "B": "A demand that Claude guarantee accuracy", "C": "The dimensions of comparison (pricing, features, market position)", "D": "An apology for the request"}, "answer": ["A", "C"], "multi": true, "rationale": "Scope and comparison structure define the deliverable; guarantees and apologies do nothing."}, {"n": 15, "domain": "D1 Prompting & Task Execution", "stem": "The main benefit of assigning Claude a role (\"Act as an experienced HR compliance reviewer\") is:", "options": {"A": "It unlocks hidden features", "B": "It frames perspective, priorities, and vocabulary appropriate to the task", "C": "It makes Claude legally qualified", "D": "It disables safety features"}, "answer": ["B"], "multi": false, "rationale": "Role framing shapes the lens applied to the task; it grants no credentials or capabilities."}, {"n": 16, "domain": "D1 Prompting & Task Execution", "stem": "A user wants meeting notes converted into action items. The strongest prompt specifies:", "options": {"A": "\"Extract action items.\"", "B": "\"Extract action items as a table: owner, task, deadline. Mark items with no clear owner as 'Unassigned' rather than guessing.\"", "C": "\"Find the tasks.\"", "D": "\"Make this useful.\""}, "answer": ["B"], "multi": false, "rationale": "Structure plus an explicit uncertainty rule (\"Unassigned, don't guess\") prevents invented owners."}, {"n": 17, "domain": "D1 Prompting & Task Execution", "stem": "When is it appropriate to tell Claude the purpose behind a task, not just the task?", "options": {"A": "Never; purpose is irrelevant", "B": "Usually — purpose lets Claude make better judgment calls on emphasis and detail", "C": "Only for creative work", "D": "Only when the task fails"}, "answer": ["B"], "multi": false, "rationale": "\"Summarize this for a board vote on the acquisition\" produces different emphasis than a bare \"summarize.\""}, {"n": 18, "domain": "D1 Prompting & Task Execution", "stem": "Which task-type pairing is correct?", "options": {"A": "Drafting → ask for multiple structural options first when stakes are high", "B": "Analysis → forbid Claude from explaining reasoning", "C": "Research → forbid citations", "D": "Brainstorming → demand one idea only"}, "answer": ["A"], "multi": false, "rationale": "For high-stakes drafts, comparing structures before writing avoids polishing the wrong document."}, {"n": 19, "domain": "D1 Prompting & Task Execution", "stem": "A user asks Claude to \"make this shorter\" and gets a version missing a key point. The best next prompt:", "options": {"A": "\"Shorter again.\"", "B": "\"Shorten to ~200 words but you must retain the pricing change and the deadline.\"", "C": "\"You failed.\"", "D": "\"Rewrite everything.\""}, "answer": ["B"], "multi": false, "rationale": "Compression needs stated preservation constraints; otherwise Claude chooses what to cut."}, {"n": 20, "domain": "D1 Prompting & Task Execution", "stem": "Multi-step instruction quality: which is best for processing 50 customer complaints?", "options": {"A": "\"Read these and tell me what you think.\"", "B": "\"Categorize each complaint (billing/product/service/other), count each category, then list the three most severe with quotes and a one-line suggested response each.\"", "C": "\"Handle these complaints.\"", "D": "\"Are these bad?\""}, "answer": ["B"], "multi": false, "rationale": "It defines the categorization scheme, the aggregation, and the drill-down deliverable."}, {"n": 21, "domain": "D1 Prompting & Task Execution", "stem": "Why place long reference material before the question in a prompt rather than after?", "options": {"A": "It's required or Claude errors", "B": "Instructions that follow the material stay salient; it's a common structure recommendation for long-context prompts", "C": "It reduces cost", "D": "It has no effect ever"}, "answer": ["B"], "multi": false, "rationale": "Document-first, question-last is standard guidance for long- context prompting."}, {"n": 22, "domain": "D1 Prompting & Task Execution", "stem": "A user wants Claude to critique their business plan honestly. Which instruction works best?", "options": {"A": "\"Tell me this is good.\"", "B": "\"Identify the three biggest weaknesses and the strongest objection an investor would raise. Do not soften the assessment.\"", "C": "\"Any thoughts?\"", "D": "\"Rate it out of 10.\""}, "answer": ["B"], "multi": false, "rationale": "Requesting specific, adversarial critique overrides the default toward diplomacy; a bare rating carries no reasoning."}, {"n": 23, "domain": "D1 Prompting & Task Execution", "stem": "What is the correct expectation when giving Claude a word count (\"exactly 500 words\")?", "options": {"A": "Output will be exactly 500 words every time", "B": "Output will be approximately that length; verify if exact count matters", "C": "Claude cannot control length at all", "D": "Word counts make output worse"}, "answer": ["B"], "multi": false, "rationale": "Length instructions steer approximately; exact counts need verification."}, {"n": 24, "domain": "D1 Prompting & Task Execution", "stem": "A recruiter wants interview questions for a role. The prompt should include: (Select TWO)", "options": {"A": "The job description or key competencies", "B": "The candidate's astrological sign", "C": "The interview stage and time available", "D": "A request to decide who to hire"}, "answer": ["A", "C"], "multi": true, "rationale": "Competencies and stage/time define relevant questions; hiring decisions stay human."}, {"n": 25, "domain": "D1 Prompting & Task Execution", "stem": "\"Chain of thought\" style prompting (\"work through this step by step\") is most valuable for:", "options": {"A": "Simple lookups", "B": "Multi-step reasoning tasks like calculations, logic, and tradeoff analysis", "C": "Copying text", "D": "Greetings"}, "answer": ["B"], "multi": false, "rationale": "Explicit stepwise reasoning helps where intermediate steps can go wrong; it adds nothing to trivial tasks."}, {"n": 26, "domain": "D1 Prompting & Task Execution", "stem": "A user needs the same report generated weekly with new data. The efficient prompting approach:", "options": {"A": "Rewrite the prompt from scratch weekly", "B": "Save a refined prompt template (or Project instruction) specifying structure and rules, and supply only the new data each week", "C": "Hope Claude remembers last week", "D": "Use a different tool"}, "answer": ["B"], "multi": false, "rationale": "Templatize what is stable, vary only the input; separate chats don't share memory by default."}, {"n": 27, "domain": "D1 Prompting & Task Execution", "stem": "Which is a realistic limitation to design prompts around?", "options": {"A": "Claude may produce plausible but incorrect specifics, so prompts should require sourcing or flagging of uncertainty", "B": "Claude refuses all business tasks", "C": "Claude cannot write more than a paragraph", "D": "Claude only understands English"}, "answer": ["A"], "multi": false, "rationale": "Confabulated specifics are the characteristic failure; prompts should instrument for it."}, {"n": 28, "domain": "D1 Prompting & Task Execution", "stem": "The instruction \"If any information needed is missing, ask me before proceeding\" is valuable because:", "options": {"A": "It slows things down for no benefit", "B": "It converts silent assumptions into explicit questions", "C": "It's required syntax", "D": "It prevents all errors"}, "answer": ["B"], "multi": false, "rationale": "The alternative to asking is guessing; this instruction surfaces the guess."}, {"n": 29, "domain": "D2 Output Evaluation & Validation", "stem": "Claude produces a market report citing \"a 2024 McKinsey study\" with specific percentages. Before using it, you should:", "options": {"A": "Trust it — it names a source", "B": "Locate the actual study; a named source with specific numbers can be fabricated", "C": "Remove the citation and keep the numbers", "D": "Ask Claude if it's sure"}, "answer": ["B"], "multi": false, "rationale": "Plausible citations are a classic hallucination pattern; \"are you sure\" often gets confident reaffirmation, not verification."}, {"n": 30, "domain": "D2 Output Evaluation & Validation", "stem": "What is a hallucination in AI output?", "options": {"A": "Any answer you disagree with", "B": "Confident, plausible-sounding content that is factually false or invented", "C": "A formatting error", "D": "A slow response"}, "answer": ["B"], "multi": false, "rationale": "The danger is precisely that it reads as true."}, {"n": 31, "domain": "D2 Output Evaluation & Validation", "stem": "Which output element carries the HIGHEST verification priority before external use?", "options": {"A": "Tone", "B": "Specific facts: numbers, dates, names, quotes, citations, legal/regulatory claims", "C": "Paragraph breaks", "D": "Synonym choice"}, "answer": ["B"], "multi": false, "rationale": "Specifics are where fabrication does damage; style errors are visible and cheap."}, {"n": 32, "domain": "D2 Output Evaluation & Validation", "stem": "Claude summarizes a contract you uploaded. The most reliable spot-check is:", "options": {"A": "Ask Claude to rate its own summary", "B": "Check the summary's claims about key clauses against the actual contract text", "C": "Ask a second AI", "D": "Check the summary's grammar"}, "answer": ["B"], "multi": false, "rationale": "Ground truth is the source document; self-assessment and second models can share the same blind spots."}, {"n": 33, "domain": "D2 Output Evaluation & Validation", "stem": "A response contains an internal contradiction (says revenue rose in one paragraph, fell in another). This indicates:", "options": {"A": "The output must be discarded entirely", "B": "At least one claim is wrong; identify which against the source before using either", "C": "Both claims are true", "D": "A billing issue"}, "answer": ["B"], "multi": false, "rationale": "Contradictions localize the verification work; they don't necessarily invalidate everything."}, {"n": 34, "domain": "D2 Output Evaluation & Validation", "stem": "When must a human review Claude's output before it's used? (Select TWO)", "options": {"A": "When it will be sent externally or drives a consequential decision", "B": "When it contains legal, medical, financial, or compliance-relevant content", "C": "When it's a private brainstorm for your own use", "D": "Never — review defeats the purpose"}, "answer": ["A", "B"], "multi": true, "rationale": "Stakes and domain risk determine review, not convenience."}, {"n": 35, "domain": "D2 Output Evaluation & Validation", "stem": "Claude gives a confident answer about an event from last month. Your first consideration:", "options": {"A": "Confidence signals accuracy", "B": "Claude's knowledge has a cutoff; recent events need a search/current source before trusting the answer", "C": "Recent events are always in training data", "D": "Ask for more confidence"}, "answer": ["B"], "multi": false, "rationale": "Tone does not track recency; verify time-sensitive claims against current sources."}, {"n": 36, "domain": "D2 Output Evaluation & Validation", "stem": "A completeness check on a \"summary of all action items in this transcript\" means:", "options": {"A": "Reading the summary for fluency", "B": "Scanning the transcript for items the summary missed, not just verifying the items it lists", "C": "Counting the words", "D": "Asking Claude if it finished"}, "answer": ["B"], "multi": false, "rationale": "Omissions are invisible in the output; you find them only in the source."}, {"n": 37, "domain": "D2 Output Evaluation & Validation", "stem": "Which is an example of bias to check for in Claude-assisted hiring content?", "options": {"A": "Bullet points", "B": "Screening criteria that systematically disadvantage a protected group without job relevance", "C": "Using tables", "D": "Short sentences"}, "answer": ["B"], "multi": false, "rationale": "Evaluation includes checking that generated criteria are job-relevant and non-discriminatory."}, {"n": 38, "domain": "D2 Output Evaluation & Validation", "stem": "Claude drafts a press release with a quote attributed to your CEO that the CEO never said. Correct handling:", "options": {"A": "Publish; it sounds like the CEO", "B": "Remove or get the quote approved by the CEO — generated quotes are fabrications until the person endorses them", "C": "Shorten the quote", "D": "Attribute it to \"a spokesperson\""}, "answer": ["B"], "multi": false, "rationale": "Invented attributed quotes are a serious misrepresentation regardless of plausibility."}, {"n": 39, "domain": "D2 Output Evaluation & Validation", "stem": "The best general rule for calibrating trust in Claude's output:", "options": {"A": "Trust everything from a paid plan", "B": "Trust in proportion to how easily you can verify it and how much a mistake costs", "C": "Trust nothing, never use output", "D": "Trust based on response length"}, "answer": ["B"], "multi": false, "rationale": "Verification effort should track stakes; both blanket trust and blanket distrust waste value."}, {"n": 40, "domain": "D2 Output Evaluation & Validation", "stem": "You ask Claude to compare two supplier proposals. To evaluate the comparison, you should first confirm:", "options": {"A": "That it used exactly 500 words", "B": "That every figure it attributes to each proposal actually appears in that proposal", "C": "That it favored the cheaper supplier", "D": "That the table has borders"}, "answer": ["B"], "multi": false, "rationale": "Attribution accuracy is the foundation; a beautifully reasoned comparison of wrong numbers is worthless."}, {"n": 41, "domain": "D2 Output Evaluation & Validation", "stem": "Claude produces math in a financial summary. The appropriate validation is:", "options": {"A": "Recompute the key figures (spreadsheet or calculator) rather than assuming arithmetic is correct", "B": "Assume arithmetic is always correct", "C": "Check only the largest number", "D": "Round everything"}, "answer": ["A"], "multi": false, "rationale": "Arithmetic in generated text can be wrong even when the method is right; reconcile the numbers."}, {"n": 42, "domain": "D2 Output Evaluation & Validation", "stem": "Which statement about \"the output sounds authoritative\" is correct?", "options": {"A": "Authoritative tone is evidence of accuracy", "B": "Tone and accuracy are independent; fluency is not verification", "C": "Hesitant answers are always wrong", "D": "Formal outputs skip review"}, "answer": ["B"], "multi": false, "rationale": "Fluency is the model's baseline, present in right and wrong answers alike."}, {"n": 43, "domain": "D2 Output Evaluation & Validation", "stem": "A colleague pastes Claude's answer into a client deliverable without review, and it contains an error. The process failure is:", "options": {"A": "Using Claude at all", "B": "Skipping the human validation step for externally-used content", "C": "The client reading carefully", "D": "The font choice"}, "answer": ["B"], "multi": false, "rationale": "The workflow, not the tool, determines where errors escape."}, {"n": 44, "domain": "D2 Output Evaluation & Validation", "stem": "You need Claude's research output to be checkable. Which instruction helps most?", "options": {"A": "\"Provide sources/links for factual claims and mark anything you're uncertain about.\"", "B": "\"Don't explain yourself.\"", "C": "\"Sound very sure.\"", "D": "\"No citations, they clutter the text.\""}, "answer": ["A"], "multi": false, "rationale": "Sourcing and flagged uncertainty convert a monolithic answer into a verifiable one."}, {"n": 45, "domain": "D2 Output Evaluation & Validation", "stem": "When adapting a Claude draft for a new audience (engineers → executives), what changes?", "options": {"A": "Nothing; content is content", "B": "Depth, framing, and vocabulary: lead with decisions and impact, compress technical detail", "C": "Only the greeting", "D": "The facts"}, "answer": ["B"], "multi": false, "rationale": "Audience adaptation restructures emphasis while facts stay constant."}, {"n": 46, "domain": "D2 Output Evaluation & Validation", "stem": "Comparing two Claude drafts of the same memo, the right basis for choosing is:", "options": {"A": "Which is longer", "B": "Which better serves the stated purpose and audience against your criteria", "C": "Which came first", "D": "Which uses bigger words"}, "answer": ["B"], "multi": false, "rationale": "Evaluation is against purpose, not surface metrics."}, {"n": 47, "domain": "D2 Output Evaluation & Validation", "stem": "Claude states \"Section 8.2 of the contract allows termination with 30 days' notice.\" Verification means:", "options": {"A": "Reading Section 8.2 yourself", "B": "Asking Claude to repeat it", "C": "Checking that 8.2 exists", "D": "Trusting it if the contract was uploaded"}, "answer": ["A"], "multi": false, "rationale": "Even with the document provided, clause-level legal claims are read at the source; existence of the section isn't confirmation of the interpretation."}, {"n": 48, "domain": "D2 Output Evaluation & Validation", "stem": "Which output is LOWEST risk to use without deep verification?", "options": {"A": "A regulatory compliance summary sent to a client", "B": "Alternative phrasings for an internal survey question you'll review anyway", "C": "A financial model for the board", "D": "Medical guidance for an employee"}, "answer": ["B"], "multi": false, "rationale": "Low stakes plus built-in human review; the others are high- consequence domains."}, {"n": 49, "domain": "D2 Output Evaluation & Validation", "stem": "\"Determine when additional verification is required\" — which situation qualifies? (Select TWO)", "options": {"A": "The claim is surprising or contradicts what you believed", "B": "The claim will be repeated publicly under your name", "C": "The claim is that water is wet", "D": "The output is formatted as a table"}, "answer": ["A", "B"], "multi": true, "rationale": "Surprise and public exposure both raise the verification bar; formatting is irrelevant."}, {"n": 50, "domain": "D2 Output Evaluation & Validation", "stem": "A generated competitor analysis includes a competitor that doesn't exist. What likely happened, and what does it teach?", "options": {"A": "The competitor is secret", "B": "Claude filled a pattern with a plausible invention; entity lists need existence checks", "C": "Your industry knowledge is outdated", "D": "Nothing; ignore it"}, "answer": ["B"], "multi": false, "rationale": "Plausible-entity invention is a known failure mode; verify that listed things are real before verifying details about them."}, {"n": 51, "domain": "D2 Output Evaluation & Validation", "stem": "The best way to use Claude to check Claude's own work:", "options": {"A": "It's fully reliable as its own auditor", "B": "Ask it to critique the draft against explicit criteria in a fresh pass — useful for catching issues, but not a substitute for source verification", "C": "Never ask for self-review", "D": "Ask it to grade itself out of 100"}, "answer": ["B"], "multi": false, "rationale": "Structured self-critique catches real issues; it cannot certify factual truth."}, {"n": 52, "domain": "D2 Output Evaluation & Validation", "stem": "Which output format decision is correct?", "options": {"A": "A one-line answer to a quick question → deliver as an artifact", "B": "A reusable reference document the user will edit and share → artifact/document rather than a chat message", "C": "All output should be code", "D": "Format never matters"}, "answer": ["B"], "multi": false, "rationale": "Keep-and-edit content belongs in a persistent, editable format; throwaway answers stay inline."}, {"n": 53, "domain": "D2 Output Evaluation & Validation", "stem": "Claude translates a customer email into another language. Before sending to the customer:", "options": {"A": "Send immediately; translation is deterministic", "B": "Have a speaker of that language review it if the stakes warrant, since nuance and tone errors are possible", "C": "Translate it back and forth ten times", "D": "Add a disclaimer"}, "answer": ["B"], "multi": false, "rationale": "Machine translation is strong but review scales with the cost of a tone or nuance error."}, {"n": 54, "domain": "D2 Output Evaluation & Validation", "stem": "A report generated from your uploaded data cites a statistic NOT in the data. The correct conclusion:", "options": {"A": "Claude found it online automatically", "B": "The statistic came from model memory or invention; it's unverified relative to your data and must be sourced or removed", "C": "Your data is wrong", "D": "Statistics don't need sources"}, "answer": ["B"], "multi": false, "rationale": "Anything not traceable to the provided source is unsourced, whatever its origin."}, {"n": 55, "domain": "D2 Output Evaluation & Validation", "stem": "\"Curate and organise information\" in this domain means:", "options": {"A": "Accepting output as delivered", "B": "Selecting what's relevant, restructuring for the use case, and discarding filler before the output moves downstream", "C": "Alphabetizing everything", "D": "Saving every chat forever"}, "answer": ["B"], "multi": false, "rationale": "The associate's job is editorial: output is raw material, not finished product."}, {"n": 56, "domain": "D2 Output Evaluation & Validation", "stem": "Which is a sound spot-check strategy for a long generated document?", "options": {"A": "Read only the introduction", "B": "Verify a sample of the highest-stakes claims fully, and skim the rest for contradictions and omissions", "C": "Check every character with equal effort", "D": "Check nothing if it looks professional"}, "answer": ["B"], "multi": false, "rationale": "Risk-weighted sampling concentrates effort where errors are expensive."}, {"n": 57, "domain": "D2 Output Evaluation & Validation", "stem": "Claude's summary of a meeting attributes a decision to the wrong person. The likely cause and fix:", "options": {"A": "Malice; stop using Claude", "B": "Ambiguous transcript attribution; correct it and, for future runs, instruct Claude to mark uncertain attributions rather than guessing", "C": "The person is lying", "D": "Summaries can't include names"}, "answer": ["B"], "multi": false, "rationale": "Attribution errors from ambiguous sources are predictable; the uncertainty instruction is the systemic fix."}, {"n": 58, "domain": "D2 Output Evaluation & Validation", "stem": "For fact-checking a claim Claude made about a law, the strongest source is:", "options": {"A": "Another AI chatbot", "B": "The primary source: the statute/regulation text or an official government publication", "C": "A social media thread", "D": "Claude's confidence level"}, "answer": ["B"], "multi": false, "rationale": "Primary and official sources outrank derivative ones."}, {"n": 59, "domain": "D2 Output Evaluation & Validation", "stem": "What does it mean that verification cost should be \"proportionate\"?", "options": {"A": "Verify everything at maximum depth always", "B": "Match verification depth to consequence: a tweet draft and a regulatory filing don't get the same scrutiny", "C": "Never verify anything cheap", "D": "Verification is billed hourly"}, "answer": ["B"], "multi": false, "rationale": "Over-verifying low-stakes output destroys the productivity gain; under-verifying high-stakes output creates risk."}, {"n": 60, "domain": "D2 Output Evaluation & Validation", "stem": "Claude produces a beautifully structured answer to a question about your company's internal policy — but the policy was never provided to it. The answer is:", "options": {"A": "Probably correct; Claude knows companies", "B": "A plausible generic construction, not your policy; supply the actual policy document and regenerate", "C": "Legally binding", "D": "Correct if formatted well"}, "answer": ["B"], "multi": false, "rationale": "Without the source, Claude produces the archetype, not your reality."}, {"n": 61, "domain": "D2 Output Evaluation & Validation", "stem": "An output for an executive contains hedged language on every sentence. The right edit:", "options": {"A": "Keep every hedge; hedging is honesty", "B": "Keep hedges only where genuine uncertainty exists; state verified facts plainly", "C": "Remove all hedges including real uncertainty", "D": "Add more hedges"}, "answer": ["B"], "multi": false, "rationale": "Calibrated language: uncertainty flagged where real, confidence where earned."}, {"n": 62, "domain": "D2 Output Evaluation & Validation", "stem": "Which pair correctly matches an error type to its detection method?", "options": {"A": "Omission → visible in the output alone", "B": "Fabricated citation → resolved by checking the reference exists and says what's claimed", "C": "Wrong tone → detected by recomputing figures", "D": "Arithmetic error → detected by reading aloud"}, "answer": ["B"], "multi": false, "rationale": "Each error type has a matching check; citations are checked at the reference."}, {"n": 63, "domain": "D2 Output Evaluation & Validation", "stem": "A multiple-response evaluation habit worth building: before accepting an output, ask — (Select TWO)", "options": {"A": "\"What would make this wrong?\"", "B": "\"Does every claim trace to a source I can point at?\"", "C": "\"Is it long enough to look thorough?\"", "D": "\"Did it compliment my question?\""}, "answer": ["A", "B"], "multi": true, "rationale": "Adversarial reading and traceability are the core evaluation moves."}, {"n": 64, "domain": "D2 Output Evaluation & Validation", "stem": "Claude gives medical-adjacent advice for an HR wellness newsletter. The associate should:", "options": {"A": "Publish as-is", "B": "Treat health content as high-risk: verify against authoritative health sources and/or route through qualified review before publication", "C": "Add \"AI- generated\" and publish", "D": "Make it more confident"}, "answer": ["B"], "multi": false, "rationale": "Domain risk (health) elevates review requirements regardless of the content's apparent quality."}, {"n": 65, "domain": "D2 Output Evaluation & Validation", "stem": "The difference between \"editing\" and \"validating\" Claude's output:", "options": {"A": "They are identical", "B": "Editing improves expression for the audience; validating confirms the content is true and complete — both are required before external use", "C": "Validation is only for code", "D": "Editing makes validation unnecessary"}, "answer": ["B"], "multi": false, "rationale": "Polish and truth are separate passes; a well-edited falsehood is worse, not better."}, {"n": 66, "domain": "D2 Output Evaluation & Validation", "stem": "Claude produced ten customer-reply drafts. The efficient quality process:", "options": {"A": "Send all ten unread", "B": "Define acceptance criteria once (accuracy of claims, policy compliance, tone), then review each against them quickly", "C": "Rewrite all ten from scratch", "D": "Review one and assume the rest match"}, "answer": ["B"], "multi": false, "rationale": "Criteria-based review scales; sampling one is insufficient when each goes to a different customer."}, {"n": 67, "domain": "D2 Output Evaluation & Validation", "stem": "Why is \"the output matched my expectations\" an incomplete validation standard?", "options": {"A": "Expectations are always wrong", "B": "Confirmation bias: you'll under-scrutinize agreeable output; validation should check against sources, not priors", "C": "It's actually the gold standard", "D": "Expectations can't be stated"}, "answer": ["B"], "multi": false, "rationale": "Agreeable errors are the ones most likely to survive review."}, {"n": 68, "domain": "D2 Output Evaluation & Validation", "stem": "An output cites a real report but misstates its finding. This error is:", "options": {"A": "Impossible", "B": "A misattribution — the source exists but doesn't support the claim; checking existence alone would have missed it", "C": "Acceptable if the report is real", "D": "The report's fault"}, "answer": ["B"], "multi": false, "rationale": "Verification has two levels: the source exists, AND it says what's claimed."}, {"n": 69, "domain": "D2 Output Evaluation & Validation", "stem": "For data analysis output, \"sanity checking\" means:", "options": {"A": "Checking the chart colors", "B": "Testing whether results are plausible: do totals reconcile, do percentages sum correctly, does the direction match known reality?", "C": "Asking if the analysis is sane", "D": "Running it twice"}, "answer": ["B"], "multi": false, "rationale": "Cheap plausibility checks catch gross errors before expensive detailed review."}, {"n": 70, "domain": "D2 Output Evaluation & Validation", "stem": "The single most important mindset for Domain 2:", "options": {"A": "Claude's output is a finished product", "B": "Claude's output is a competent first draft whose specifics are unverified until checked", "C": "Claude's output is usually malicious", "D": "Claude's output needs no owner"}, "answer": ["B"], "multi": false, "rationale": "This framing drives every correct behavior in the domain. Domain 3 — Product and Model Selection (Q71–Q94)"}, {"n": 71, "domain": "D3 Product & Model Selection", "stem": "Which correctly orders Claude's model tiers by capability (and typically cost)?", "options": {"A": "Sonnet < Haiku < Opus", "B": "Haiku < Sonnet < Opus", "C": "Opus < Sonnet < Haiku", "D": "All identical"}, "answer": ["B"], "multi": false, "rationale": "Haiku is fastest/cheapest, Sonnet the balanced middle, Opus the most capable tier."}, {"n": 72, "domain": "D3 Product & Model Selection", "stem": "For classifying thousands of short support tickets by category, the sensible model choice is:", "options": {"A": "The most powerful model regardless of cost", "B": "A fast, economical model (Haiku-class) — the task is simple, high-volume, and speed/cost dominate", "C": "No model; do it by hand", "D": "A different vendor per ticket"}, "answer": ["B"], "multi": false, "rationale": "Match capability to task complexity; simple classification doesn't need top-tier reasoning."}, {"n": 73, "domain": "D3 Product & Model Selection", "stem": "For a complex strategic analysis with multi-step reasoning and high stakes, choose:", "options": {"A": "The fastest model", "B": "The most capable model tier, accepting higher cost/latency", "C": "Whichever is default", "D": "The cheapest, then never review"}, "answer": ["B"], "multi": false, "rationale": "Quality-critical, complexity-heavy tasks justify the top tier."}, {"n": 74, "domain": "D3 Product & Model Selection", "stem": "What is a Claude Project primarily for?", "options": {"A": "One-off questions", "B": "Grouping related conversations with shared custom instructions and knowledge sources in a dedicated workspace", "C": "Video editing", "D": "Replacing email"}, "answer": ["B"], "multi": false, "rationale": "Projects persist instructions and knowledge across the chats inside them."}, {"n": 75, "domain": "D3 Product & Model Selection", "stem": "When should a user prefer a Project over a plain chat?", "options": {"A": "Never", "B": "When they'll return to the same context repeatedly — same documents, same standing instructions, same ongoing work", "C": "Only for coding", "D": "When they want answers hidden"}, "answer": ["B"], "multi": false, "rationale": "Recurring context is the trigger; one-off questions don't need the setup."}, {"n": 76, "domain": "D3 Product & Model Selection", "stem": "Research mode (deep/extended research) is best suited for:", "options": {"A": "\"What's 15% of 80?\"", "B": "Multi-source questions needing broad web investigation and a synthesized, cited report", "C": "Fixing a typo", "D": "Casual chat"}, "answer": ["B"], "multi": false, "rationale": "It trades time for breadth and synthesis; trivial questions don't warrant it."}, {"n": 77, "domain": "D3 Product & Model Selection", "stem": "Artifacts are most appropriate when:", "options": {"A": "The answer is one sentence", "B": "The output is substantial standalone content — a document, webpage, or app — that the user will view, edit, iterate on, or share", "C": "Nothing should be saved", "D": "The user is offline"}, "answer": ["B"], "multi": false, "rationale": "Artifacts separate durable work products from conversational flow."}, {"n": 78, "domain": "D3 Product & Model Selection", "stem": "A user's very long conversation starts producing responses that ignore early instructions. The most likely cause:", "options": {"A": "Claude is offended", "B": "The conversation has grown past what the context can reliably hold; early content is being lost or diluted", "C": "The internet is down", "D": "The model changed itself"}, "answer": ["B"], "multi": false, "rationale": "Context is finite; long sessions degrade recall of early turns."}, {"n": 79, "domain": "D3 Product & Model Selection", "stem": "The right response to the situation in Q78:", "options": {"A": "Keep going and hope", "B": "Summarize the essential context/decisions, start a fresh conversation seeded with that summary (or move standing context into Project instructions)", "C": "Type the instructions in caps", "D": "Complain"}, "answer": ["B"], "multi": false, "rationale": "Restart-with-summary or persist-to-Project are the standard context- management moves."}, {"n": 80, "domain": "D3 Product & Model Selection", "stem": "\"Align model selection with task requirements\" means weighing: (Select TWO)", "options": {"A": "Output quality needed vs. cost and speed", "B": "The model's name aesthetics", "C": "Task complexity vs. model capability", "D": "The day of the week"}, "answer": ["A", "C"], "multi": true, "rationale": "Selection is a cost/speed/quality/complexity tradeoff, nothing else."}, {"n": 81, "domain": "D3 Product & Model Selection", "stem": "For drafting routine internal emails all day, the practical tier choice is:", "options": {"A": "Always the top model", "B": "A fast mid- or low-tier model — quality difference is marginal for routine drafting, speed compounds", "C": "No model can draft email", "D": "Rotate randomly"}, "answer": ["B"], "multi": false, "rationale": "Routine tasks are where cheaper tiers earn their keep."}, {"n": 82, "domain": "D3 Product & Model Selection", "stem": "Which pairing of feature to need is WRONG?", "options": {"A": "Project → recurring work with shared documents", "B": "Research mode → deep multi-source market study", "C": "Artifact → a reusable policy document being drafted", "D": "Research mode → converting one date to another timezone"}, "answer": ["D"], "multi": false, "rationale": "Research mode on a trivial computation wastes time; the other three match."}, {"n": 83, "domain": "D3 Product & Model Selection", "stem": "A user asks whether uploading a 200-page document \"uses up\" the conversation. Correct understanding:", "options": {"A": "Documents are free of context cost", "B": "Uploaded content consumes context; very large documents plus a long chat can hit limits, so scope uploads to what the task needs", "C": "Documents delete the chat", "D": "Only images use context"}, "answer": ["B"], "multi": false, "rationale": "Everything in the conversation occupies the same finite context."}, {"n": 84, "domain": "D3 Product & Model Selection", "stem": "Project custom instructions differ from a per-message prompt because they:", "options": {"A": "Apply automatically to every conversation in the Project without retyping", "B": "Are more grammatically correct", "C": "Override user messages entirely", "D": "Expire hourly"}, "answer": ["A"], "multi": false, "rationale": "Persistence across the Project's chats is the point."}, {"n": 85, "domain": "D3 Product & Model Selection", "stem": "When does starting a NEW conversation beat continuing the current one?", "options": {"A": "Never", "B": "When switching to an unrelated task — carryover context from the old task can contaminate the new one", "C": "Every three messages by rule", "D": "Only on Mondays"}, "answer": ["B"], "multi": false, "rationale": "Fresh tasks deserve fresh context; unrelated residue causes drift."}, {"n": 86, "domain": "D3 Product & Model Selection", "stem": "A team wants consistent Claude behavior across members working the same account. The feature-level answer:", "options": {"A": "Everyone memorizes the same prompt", "B": "A shared Project with agreed instructions and curated knowledge sources", "C": "Email each other outputs", "D": "Use different vendors"}, "answer": ["B"], "multi": false, "rationale": "Shared Projects centralize the configuration instead of relying on individual discipline."}, {"n": 87, "domain": "D3 Product & Model Selection", "stem": "\"Cost\" in model selection for a chat-plan user primarily shows up as:", "options": {"A": "Per-token invoices in chat", "B": "Usage limits/quota consumption and time — heavier models and modes consume more of both", "C": "Nothing; everything is unlimited", "D": "Shipping fees"}, "answer": ["B"], "multi": false, "rationale": "Even without per-call billing, capacity and latency are real costs."}, {"n": 88, "domain": "D3 Product & Model Selection", "stem": "Which task most clearly justifies research mode over a single web search?", "options": {"A": "\"Who is the CEO of Company X?\"", "B": "\"Compare the regulatory landscape for telehealth across five states, with sources.\"", "C": "\"Define ROI.\"", "D": "\"Spell 'necessary'.\""}, "answer": ["B"], "multi": false, "rationale": "Multi-jurisdiction synthesis is exactly the multi-source, multi-step case."}, {"n": 89, "domain": "D3 Product & Model Selection", "stem": "The relationship between model tier and hallucination risk:", "options": {"A": "Top-tier models never hallucinate, so verification is unnecessary", "B": "Stronger models generally err less, but no tier eliminates fabrication — verification requirements don't disappear with model choice", "C": "Cheaper models are always more accurate", "D": "Hallucination is a settings toggle"}, "answer": ["B"], "multi": false, "rationale": "Model selection changes the rate, not the need for validation."}, {"n": 90, "domain": "D3 Product & Model Selection", "stem": "A user needs to share a polished one-page summary with a colleague who doesn't use Claude. Best output route:", "options": {"A": "Screenshot the chat", "B": "Produce it as an artifact/document and export or copy it into the sharing format the colleague needs", "C": "Read it aloud", "D": "Add the colleague to the chat forcibly"}, "answer": ["B"], "multi": false, "rationale": "Durable formats travel; chat transcripts don't."}, {"n": 91, "domain": "D3 Product & Model Selection", "stem": "\"Memory considerations\" for chat products mean:", "options": {"A": "Claude remembers everything across all chats always, with no user control", "B": "Persistence varies by feature and settings — standing context lives in Project instructions/knowledge or memory features, not in the assumption that separate chats share history", "C": "Nothing persists ever, including in Projects", "D": "Memory is stored in artifacts"}, "answer": ["B"], "multi": false, "rationale": "Knowing WHERE context persists (and where it doesn't) is the tested skill."}, {"n": 92, "domain": "D3 Product & Model Selection", "stem": "For quickly triaging which of 30 documents deserve deep analysis, an efficient pattern is:", "options": {"A": "Deep-analyze all 30 with the top model", "B": "Fast passes with an economical model to rank relevance, then top-tier analysis on the shortlist", "C": "Ignore all 30", "D": "Analyze the first one only"}, "answer": ["B"], "multi": false, "rationale": "Tiered processing: cheap breadth, expensive depth."}, {"n": 93, "domain": "D3 Product & Model Selection", "stem": "A user complains Opus-class responses are \"slow\" for their lookup tasks. Correct advice:", "options": {"A": "Slowness means the model is broken", "B": "Switch to a faster tier for lookups; reserve the heavy model for tasks that need its reasoning", "C": "Stop using AI", "D": "Ask the model to hurry"}, "answer": ["B"], "multi": false, "rationale": "Latency complaints on light tasks are a selection problem, not a defect."}, {"n": 94, "domain": "D3 Product & Model Selection", "stem": "What does it mean to \"persist\" context deliberately?", "options": {"A": "Repeating yourself louder", "B": "Moving durable requirements into Project instructions, uploaded knowledge, or saved documents so they survive beyond one conversation", "C": "Never closing the browser tab", "D": "Emailing yourself the chat"}, "answer": ["B"], "multi": false, "rationale": "Persistence is a design decision, not an accident of leaving tabs open. Q126)"}, {"n": 95, "domain": "D4 Workflow Integration & Solution Design", "stem": "The first step in integrating Claude into an existing business process is:", "options": {"A": "Automating the whole process on day one", "B": "Mapping the current process and identifying which steps are drafting/analysis/synthesis work suited to AI assistance", "C": "Firing the team", "D": "Buying more software"}, "answer": ["B"], "multi": false, "rationale": "Fit-to-task analysis precedes deployment; not every step benefits."}, {"n": 96, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which process step is the BEST first candidate for Claude assistance?", "options": {"A": "Final legal sign-off", "B": "First-draft generation of routine documents that a human already reviews", "C": "Wire transfers", "D": "Termination decisions"}, "answer": ["B"], "multi": false, "rationale": "High-volume drafting with existing human review is low-risk, high-yield; the others are consequence-heavy decision points."}, {"n": 97, "domain": "D4 Workflow Integration & Solution Design", "stem": "\"Augment vs. redesign\" a workflow: which describes AUGMENT?", "options": {"A": "Claude replaces the entire process and all reviewers", "B": "Claude is inserted into existing steps (drafting, summarizing) while the process shape and controls stay intact", "C": "Deleting the process", "D": "Outsourcing the process"}, "answer": ["B"], "multi": false, "rationale": "Augmentation preserves structure; redesign rebuilds the process around new capabilities."}, {"n": 98, "domain": "D4 Workflow Integration & Solution Design", "stem": "A sensible pilot design for introducing Claude to a proposal-writing team:", "options": {"A": "Mandate it company-wide immediately", "B": "One team, defined tasks, defined success metrics (time saved, quality scores, error rates), fixed review process, and a checkpoint to decide on expansion", "C": "Secret rollout with no metrics", "D": "Pilot forever with no decision point"}, "answer": ["B"], "multi": false, "rationale": "Bounded scope, measurable outcomes, and a decision gate are the elements of a real pilot."}, {"n": 99, "domain": "D4 Workflow Integration & Solution Design", "stem": "Using Claude for requirements analysis means:", "options": {"A": "Letting Claude decide what the business needs unilaterally", "B": "Having Claude structure stakeholder input, surface gaps and ambiguities, and draft requirement documents that humans validate", "C": "Skipping stakeholders", "D": "Requirements are not AI-suitable"}, "answer": ["B"], "multi": false, "rationale": "Claude accelerates structuring and gap-finding; validation of what's actually needed stays human."}, {"n": 100, "domain": "D4 Workflow Integration & Solution Design", "stem": "When communicating Claude's value to skeptical stakeholders, the strongest approach:", "options": {"A": "Promise it never makes mistakes", "B": "Present measured results from real tasks, state limitations honestly, and show the review controls that catch errors", "C": "Show a demo of a trick question", "D": "Avoid mentioning limitations"}, "answer": ["B"], "multi": false, "rationale": "Credibility comes from evidence plus honest limits; overselling destroys trust at the first error."}, {"n": 101, "domain": "D4 Workflow Integration & Solution Design", "stem": "A weekly workflow: gather updates → compile status report → distribute. Where does Claude fit best?", "options": {"A": "Deciding project priorities alone", "B": "Compiling raw updates into the standard report format for owner review before distribution", "C": "Replacing the project manager", "D": "Nowhere"}, "answer": ["B"], "multi": false, "rationale": "The compilation step is mechanical synthesis; judgment and accountability stay with the owner."}, {"n": 102, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which is a realistic time-savings claim structure for a business case?", "options": {"A": "\"AI makes everything instant.\"", "B": "\"Drafting time on X dropped from ~3 hours to ~45 minutes including review, measured over 20 documents.\"", "C": "\"It feels faster.\"", "D": "\"Competitors use it.\""}, "answer": ["B"], "multi": false, "rationale": "Specific, measured, review-inclusive numbers survive scrutiny."}, {"n": 103, "domain": "D4 Workflow Integration & Solution Design", "stem": "Using Claude for process optimisation, a good prompt pattern is:", "options": {"A": "\"Fix my company.\"", "B": "\"Here is our current invoicing process [steps]. Identify bottlenecks, redundant steps, and error-prone handoffs; propose changes ranked by effort vs. impact.\"", "C": "\"Are processes good?\"", "D": "\"Optimize.\""}, "answer": ["B"], "multi": false, "rationale": "The process must be described; the analysis must have named dimensions and a ranked deliverable."}, {"n": 104, "domain": "D4 Workflow Integration & Solution Design", "stem": "\"Human-in-the-loop\" placement should be at:", "options": {"A": "Random points", "B": "Consequence points: wherever output leaves the organization, commits resources, or affects people", "C": "Only the beginning", "D": "Nowhere, to save time"}, "answer": ["B"], "multi": false, "rationale": "Review is placed where errors become expensive or irreversible."}, {"n": 105, "domain": "D4 Workflow Integration & Solution Design", "stem": "A department wants Claude for customer-facing chat responses. The associate's correct guidance includes: (Select TWO)", "options": {"A": "Draft-then-human-send is the safer starting pattern than fully automated replies", "B": "Response quality should be monitored with sampling and feedback loops", "C": "Automation should be total from day one with no monitoring", "D": "Customers should never receive accurate answers"}, "answer": ["A", "B"], "multi": true, "rationale": "Graduated autonomy plus monitoring; full unmonitored automation of customer contact is premature."}, {"n": 106, "domain": "D4 Workflow Integration & Solution Design", "stem": "Claude can support solution design by:", "options": {"A": "Signing contracts", "B": "Generating and comparing alternative approaches, drafting specs, and stress-testing designs with \"what could go wrong\" analysis", "C": "Approving budgets", "D": "Attending meetings physically"}, "answer": ["B"], "multi": false, "rationale": "Design support = options, documentation, and adversarial review; approvals remain human."}, {"n": 107, "domain": "D4 Workflow Integration & Solution Design", "stem": "A workflow produces inconsistent Claude outputs across team members. The systematic fix:", "options": {"A": "Blame the least senior member", "B": "Standardize: shared prompt templates or a shared Project with common instructions and examples of acceptable output", "C": "Ban the tool", "D": "Let inconsistency continue"}, "answer": ["B"], "multi": false, "rationale": "Variance comes from unstandardized inputs; fix the inputs."}, {"n": 108, "domain": "D4 Workflow Integration & Solution Design", "stem": "ROI framing for a Claude workflow should count: (Select TWO)", "options": {"A": "Time saved on the assisted steps, net of review time", "B": "Error/rework reduction where measurable", "C": "Only the subscription cost with no benefit measurement", "D": "The number of prompts typed"}, "answer": ["A", "B"], "multi": true, "rationale": "Net time and quality effects are the benefit side; activity counts are vanity metrics."}, {"n": 109, "domain": "D4 Workflow Integration & Solution Design", "stem": "When a stakeholder asks \"can Claude do our financial audit?\", the correct response shape:", "options": {"A": "\"Yes, fully.\"", "B": "\"It can accelerate parts — document summarization, anomaly flagging for human investigation — but the audit judgment, testing, and sign-off remain with qualified auditors.\"", "C": "\"No, AI is useless in finance.\"", "D": "\"Only if we hide it from the regulator.\""}, "answer": ["B"], "multi": false, "rationale": "Decompose to assistable sub-tasks; keep regulated judgment human."}, {"n": 110, "domain": "D4 Workflow Integration & Solution Design", "stem": "The purpose of documenting a Claude-assisted workflow (prompts used, review steps, owners) is:", "options": {"A": "Bureaucracy for its own sake", "B": "Repeatability, onboarding, quality control, and auditability of how outputs were produced", "C": "To slow the team down", "D": "Decoration"}, "answer": ["B"], "multi": false, "rationale": "Undocumented workflows die with their inventor and can't be audited."}, {"n": 111, "domain": "D4 Workflow Integration & Solution Design", "stem": "A manager wants to redesign their reporting process \"around\" Claude rather than bolting it on. The redesign question to ask first:", "options": {"A": "\"What color should the report be?\"", "B": "\"If drafting and synthesis are near-free, which steps, approvals, and formats still earn their place?\"", "C": "\"How do we keep everything identical?\"", "D": "\"Which staff do we cut today?\""}, "answer": ["B"], "multi": false, "rationale": "Redesign re-derives the process from the new cost structure of the work."}, {"n": 112, "domain": "D4 Workflow Integration & Solution Design", "stem": "For research and planning support on a market-entry decision, Claude is best used to:", "options": {"A": "Make the entry decision", "B": "Compile market data with sources, structure option analyses, surface risks, and draft the decision document for leadership", "C": "Guarantee success", "D": "Replace market data with estimates"}, "answer": ["B"], "multi": false, "rationale": "Decision support, not decision making; sourcing keeps it verifiable."}, {"n": 113, "domain": "D4 Workflow Integration & Solution Design", "stem": "A team adopts Claude but review time now exceeds the drafting time saved. Diagnosis:", "options": {"A": "Impossible situation", "B": "Task or prompt fit is wrong — outputs need too much correction; improve prompts/context/model choice or pick different tasks to assist", "C": "Review is optional, drop it", "D": "The team reads too slowly"}, "answer": ["B"], "multi": false, "rationale": "Negative net savings signal a fit problem; dropping review is the wrong fix."}, {"n": 114, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which task should NOT be delegated to Claude in a hiring workflow?", "options": {"A": "Drafting the job description for review", "B": "Summarizing interview notes", "C": "Making the final hire/no-hire decision", "D": "Generating screening question drafts"}, "answer": ["C"], "multi": false, "rationale": "Consequential people decisions stay human; the rest are assistable drafting/synthesis steps."}, {"n": 115, "domain": "D4 Workflow Integration & Solution Design", "stem": "\"Stakeholder communication\" about limitations should include:", "options": {"A": "Nothing negative ever", "B": "Known failure modes (fabricated specifics, stale knowledge), the review controls in place, and what the tool will not be used for", "C": "Technical jargon only", "D": "A promise of perfection"}, "answer": ["B"], "multi": false, "rationale": "Naming failure modes plus controls is what makes the value claim believable."}, {"n": 116, "domain": "D4 Workflow Integration & Solution Design", "stem": "A recurring monthly board pack takes 3 days to assemble from 6 sources. A sound Claude-assisted design:", "options": {"A": "Claude invents the numbers to save time", "B": "Owners drop source files into a Project; Claude compiles to the standard template; the pack owner verifies figures against sources before circulation", "C": "Send Claude's draft straight to the board", "D": "Stop producing the pack"}, "answer": ["B"], "multi": false, "rationale": "Standard template + provided sources + owner verification is the canonical assisted-compilation pattern."}, {"n": 117, "domain": "D4 Workflow Integration & Solution Design", "stem": "The right sequencing for expanding Claude use after a successful pilot:", "options": {"A": "Everything everywhere at once", "B": "Expand to adjacent similar tasks first, carrying over the templates and review patterns that worked, measuring as you go", "C": "Freeze at pilot scale forever", "D": "Switch vendors first"}, "answer": ["B"], "multi": false, "rationale": "Adjacent expansion reuses proven patterns; big-bang rollouts lose the controls."}, {"n": 118, "domain": "D4 Workflow Integration & Solution Design", "stem": "Claude's role in a brainstorm-to-plan workflow:", "options": {"A": "Only the brainstorm", "B": "Breadth in ideation, then structuring ideas into evaluated options, then drafting the plan — with human selection at each gate", "C": "Only final formatting", "D": "Replacing the meeting"}, "answer": ["B"], "multi": false, "rationale": "It assists every stage; humans make the selections between stages."}, {"n": 119, "domain": "D4 Workflow Integration & Solution Design", "stem": "A user wants Claude to \"optimize\" their calendar workflow but hasn't described the workflow. Claude's output will be:", "options": {"A": "Precisely tailored", "B": "Generic best practices — useful input requires the actual current workflow, pain points, and constraints", "C": "Illegal", "D": "Empty"}, "answer": ["B"], "multi": false, "rationale": "No specific input, no specific output; the associate supplies the process description."}, {"n": 120, "domain": "D4 Workflow Integration & Solution Design", "stem": "Measuring quality (not just speed) of a Claude-assisted output stream requires:", "options": {"A": "Nothing; speed implies quality", "B": "Defined quality criteria and sampling review — e.g., error rates found in review, downstream corrections, recipient feedback", "C": "Asking Claude to self- report", "D": "Word counts"}, "answer": ["B"], "multi": false, "rationale": "Quality is measured at review and downstream, against stated criteria."}, {"n": 121, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which is a correct \"augment\" example in a sales workflow?", "options": {"A": "Claude autonomously signs deals", "B": "Claude drafts personalized outreach from CRM notes; the rep edits and sends", "C": "Claude sets prices without approval", "D": "Claude replaces the CRM"}, "answer": ["B"], "multi": false, "rationale": "Drafting from provided context with human send is augmentation."}, {"n": 122, "domain": "D4 Workflow Integration & Solution Design", "stem": "When Claude proposes a process change that conflicts with a regulatory requirement the user knows about:", "options": {"A": "Implement it; Claude said so", "B": "Reject or adapt it — Claude doesn't know unstated constraints; the human owns constraint enforcement", "C": "Ask Claude to overrule the regulator", "D": "Ignore the regulation"}, "answer": ["B"], "multi": false, "rationale": "Unstated constraints are invisible to the model; the human is the constraint authority."}, {"n": 123, "domain": "D4 Workflow Integration & Solution Design", "stem": "A good \"solution iteration\" loop with Claude looks like:", "options": {"A": "One generation, ship it", "B": "Draft → human critique with specific feedback → revision → repeat until acceptance criteria met", "C": "Infinite revision with no criteria", "D": "Critique with no revision"}, "answer": ["B"], "multi": false, "rationale": "Convergence needs specific feedback and a stopping criterion."}, {"n": 124, "domain": "D4 Workflow Integration & Solution Design", "stem": "The main risk of integrating Claude into a workflow WITHOUT defining review ownership:", "options": {"A": "None", "B": "Errors pass through because everyone assumes someone else validated the output", "C": "Too much review", "D": "Slower typing"}, "answer": ["B"], "multi": false, "rationale": "Unowned review is no review; diffusion of responsibility is the failure mode."}, {"n": 125, "domain": "D4 Workflow Integration & Solution Design", "stem": "Claude supports \"use case analysis\" best when the user provides:", "options": {"A": "Nothing", "B": "The business objective, current pain, affected users, constraints, and what success looks like", "C": "Only the budget", "D": "A logo"}, "answer": ["B"], "multi": false, "rationale": "Use-case quality is bounded by the framing inputs."}, {"n": 126, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which statement about workflow integration is TRUE?", "options": {"A": "The tool's capability alone determines success", "B": "Success depends as much on process design — task selection, review placement, standardization, measurement — as on the model", "C": "Integration needs no change management", "D": "Metrics are optional"}, "answer": ["B"], "multi": false, "rationale": "This is the thesis of Domain 4. Q150)"}, {"n": 127, "domain": "D5 Configuration & Knowledge Management", "stem": "Project custom instructions should contain:", "options": {"A": "Today's to-do list", "B": "Standing requirements that apply to every conversation in the Project: role, audience, tone, format rules, constraints", "C": "One-off questions", "D": "Passwords"}, "answer": ["B"], "multi": false, "rationale": "Instructions are for durable rules; per-task detail goes in messages. Credentials go nowhere near instructions."}, {"n": 128, "domain": "D5 Configuration & Knowledge Management", "stem": "A team's Project instructions say \"always cite sources\" but a specific chat needs an uncited internal brainstorm. What happens / what should they do?", "options": {"A": "Impossible; instructions are absolute", "B": "The in-chat request can direct the exception for that conversation; instructions set defaults, messages handle the specific case", "C": "Delete the Project", "D": "Never brainstorm"}, "answer": ["B"], "multi": false, "rationale": "Instructions are defaults, not locks; current- message direction governs the current task."}, {"n": 129, "domain": "D5 Configuration & Knowledge Management", "stem": "What belongs in a Project's knowledge sources?", "options": {"A": "Every file the company has ever produced", "B": "The curated documents the Project's conversations actually need: current policies, templates, key reference material", "C": "Random files for volume", "D": "Nothing; knowledge uploads are decorative"}, "answer": ["B"], "multi": false, "rationale": "Curation beats volume; irrelevant knowledge dilutes and consumes capacity."}, {"n": 130, "domain": "D5 Configuration & Knowledge Management", "stem": "A Project's knowledge contains a pricing sheet from last year; prices changed last month. The risk and fix:", "options": {"A": "No risk; old data ages like wine", "B": "Claude will confidently answer from the stale sheet; replace it with the current version and remove the old one", "C": "Keep both versions with no labels", "D": "Ask Claude to guess current prices"}, "answer": ["B"], "multi": false, "rationale": "Stale knowledge produces confident wrong answers; knowledge maintenance is an active duty."}, {"n": 131, "domain": "D5 Configuration & Knowledge Management", "stem": "Keeping BOTH old and new versions of a policy in Project knowledge without labels causes:", "options": {"A": "Better answers from more data", "B": "Conflicting sources — Claude may draw from either; answers become inconsistent", "C": "Automatic deduplication", "D": "Nothing"}, "answer": ["B"], "multi": false, "rationale": "Contradictory knowledge is worse than missing knowledge; version hygiene matters."}, {"n": 132, "domain": "D5 Configuration & Knowledge Management", "stem": "Effective system-level instructions are:", "options": {"A": "Vague and aspirational (\"be amazing\")", "B": "Specific and operational (\"Write for non-technical franchise owners; US English; every recommendation must include cost estimate; never mention competitor names\")", "C": "As long as possible regardless of relevance", "D": "Written in code"}, "answer": ["B"], "multi": false, "rationale": "Instructions work when they're testable rules, not vibes."}, {"n": 133, "domain": "D5 Configuration & Knowledge Management", "stem": "The Google Drive connector's function is to:", "options": {"A": "Back up chats to Drive", "B": "Let Claude search and read the user's Drive files as a knowledge source during conversations", "C": "Give Claude ownership of the files", "D": "Print documents"}, "answer": ["B"], "multi": false, "rationale": "Connectors extend Claude's reach into the user's existing document stores, with the user's access."}, {"n": 134, "domain": "D5 Configuration & Knowledge Management", "stem": "Before connecting Gmail/Drive to Claude in a workplace, the associate should:", "options": {"A": "Connect everything immediately", "B": "Confirm the organization's policy permits it and understand what data the connector exposes", "C": "Use a colleague's account", "D": "Disable all review"}, "answer": ["B"], "multi": false, "rationale": "Connector scope = data exposure; governance check precedes connection."}, {"n": 135, "domain": "D5 Configuration & Knowledge Management", "stem": "A Project answers questions well for one document set but the team's scope expanded. Maintenance means:", "options": {"A": "Nothing; Projects self-update", "B": "Adding the new domain's documents, updating instructions to cover the new scope, and pruning what no longer applies", "C": "Starting over from zero necessarily", "D": "Renaming the Project only"}, "answer": ["B"], "multi": false, "rationale": "Configurations track the work; scope changes trigger knowledge and instruction updates."}, {"n": 136, "domain": "D5 Configuration & Knowledge Management", "stem": "Which instruction line most reduces fabricated answers in a knowledge-based Project?", "options": {"A": "\"Answer everything confidently.\"", "B": "\"Answer from the provided knowledge sources; if the answer isn't in them, say so rather than answering from general knowledge.\"", "C": "\"Never say you don't know.\"", "D": "\"Make reasonable guesses silently.\""}, "answer": ["B"], "multi": false, "rationale": "Explicitly bounding the answer source converts silent fallback-to-memory into a visible \"not in the docs.\""}, {"n": 137, "domain": "D5 Configuration & Knowledge Management", "stem": "The difference between uploading a file to ONE chat vs. adding it to Project knowledge:", "options": {"A": "None", "B": "A chat upload serves that conversation; Project knowledge is available across all the Project's conversations", "C": "Chat uploads are permanent everywhere", "D": "Project knowledge disappears daily"}, "answer": ["B"], "multi": false, "rationale": "Scope of availability is the difference; choose based on whether the document is one-off or standing."}, {"n": 138, "domain": "D5 Configuration & Knowledge Management", "stem": "A well-configured Project for a client account should include: (Select TWO)", "options": {"A": "Standing instructions: client context, tone, deliverable formats", "B": "Current client documents: contract scope, brand guidelines, recent deliverables", "C": "Every other client's confidential files", "D": "The user's personal banking records"}, "answer": ["A", "B"], "multi": true, "rationale": "Relevant standing context yes; cross-client confidential mixing and irrelevant sensitive data no."}, {"n": 139, "domain": "D5 Configuration & Knowledge Management", "stem": "\"Inform, maintain, and update configurations\" implies a cadence. The practical trigger for review is:", "options": {"A": "Never", "B": "Whenever the underlying reality changes — new policy version, new templates, changed scope — plus periodic checks for drift", "C": "Every message", "D": "Only when something breaks publicly"}, "answer": ["B"], "multi": false, "rationale": "Event-driven updates plus periodic audit; waiting for public failure is too late."}, {"n": 140, "domain": "D5 Configuration & Knowledge Management", "stem": "Overloading instructions with 40 rules causes:", "options": {"A": "Perfect compliance with all 40", "B": "Diluted adherence — critical rules compete with trivial ones; prioritize and trim to the rules that matter", "C": "Faster responses", "D": "Automatic rule ranking"}, "answer": ["B"], "multi": false, "rationale": "Instruction budgets are real; every rule added taxes the others."}, {"n": 141, "domain": "D5 Configuration & Knowledge Management", "stem": "A user reports the Project \"ignores\" an instruction. Reasonable first checks: (Select TWO)", "options": {"A": "Whether the instruction is actually in the Project (not just in an old chat)", "B": "Whether the instruction is specific enough to be followable and doesn't conflict with another instruction", "C": "Whether Mercury is in retrograde", "D": "Whether the user has apologized to the model"}, "answer": ["A", "B"], "multi": true, "rationale": "Location and quality of the instruction are the usual culprits."}, {"n": 142, "domain": "D5 Configuration & Knowledge Management", "stem": "Knowledge source formats: which practice improves retrieval quality?", "options": {"A": "One 800- page scanned PDF of everything", "B": "Focused, well-titled documents split by topic so relevant content is findable", "C": "Files with names like \"final_final_v3(2).docx\" and mixed content", "D": "Password-protected files Claude can't read"}, "answer": ["B"], "multi": false, "rationale": "Findability of knowledge depends on how it's chunked and labeled."}, {"n": 143, "domain": "D5 Configuration & Knowledge Management", "stem": "Who should be able to modify a shared team Project's instructions?", "options": {"A": "Anyone, anytime, silently", "B": "Designated owners, with changes communicated — instructions are shared infrastructure affecting everyone's outputs", "C": "Nobody ever", "D": "The newest intern exclusively"}, "answer": ["B"], "multi": false, "rationale": "Change control on shared configuration prevents silent behavior shifts."}, {"n": 144, "domain": "D5 Configuration & Knowledge Management", "stem": "A connector search returns nothing for a document the user knows exists in Drive. Sensible checks include:", "options": {"A": "The document doesn't exist; the user is wrong", "B": "Access/permissions of the connected account, search terms matching the doc's actual title/content, and whether the file type is supported", "C": "Reinstalling the operating system", "D": "Waiting a month"}, "answer": ["B"], "multi": false, "rationale": "Connector misses are usually scope, permission, or query issues."}, {"n": 145, "domain": "D5 Configuration & Knowledge Management", "stem": "Instructions vs. knowledge: which division is correct?", "options": {"A": "Rules of behavior → knowledge files; reference facts → instructions", "B": "Rules of behavior → instructions; reference facts and documents → knowledge sources", "C": "Everything in instructions", "D": "Everything in knowledge"}, "answer": ["B"], "multi": false, "rationale": "Behavior is configured; facts are uploaded. Mixing them makes both hard to maintain."}, {"n": 146, "domain": "D5 Configuration & Knowledge Management", "stem": "After a major reorg, a Project built around the old org chart keeps giving outdated routing advice. This demonstrates:", "options": {"A": "AI is unreliable and should be abandoned", "B": "Configuration debt: the tool faithfully reflects its stale inputs; ownership of updates was the missing control", "C": "The reorg was a mistake", "D": "Projects can't hold org charts"}, "answer": ["B"], "multi": false, "rationale": "The failure is process (no update owner), not model."}, {"n": 147, "domain": "D5 Configuratio
