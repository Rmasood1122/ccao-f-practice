<style>
:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaed;--mut:#9aa3af;--line:#2a2f3a;--acc:#6ea8fe;--ok:#3fb950;--no:#f85149;--warn:#d29922}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--mut:#5b636e;--line:#e3e6ea;--acc:#2563eb;--ok:#1a7f37;--no:#d1242f;--warn:#9a6700}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 72px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650}
.mut{color:var(--mut)} .sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.badge{display:inline-block;font-size:12px;color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:10px}
.qn{color:var(--mut);font-size:13px}
.stem{font-size:16.5px;margin:6px 0 14px;font-weight:550}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--acc)} .opt input{margin-top:3px} .opt .lt{font-weight:650;min-width:16px}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 9%,transparent)}
.opt.picked{border-color:var(--acc)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;border-radius:9px;border:1px solid var(--line);padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff;border-color:transparent}
button.ghost{background:transparent;color:var(--ink)} button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:var(--card)}
.tile:hover{border-color:var(--acc)} .tile h3{margin:0 0 4px;font-size:15px}
.verdict{margin-top:14px;font-weight:650}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}.verdict.warn{color:var(--warn)}
.rat{margin-top:8px;color:var(--mut);font-size:14.5px;border-left:3px solid var(--line);padding-left:12px}
.multi{color:var(--acc);font-size:12.5px;margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 2px}
.bar>i{display:block;height:100%;background:var(--acc)}
.dl{display:flex;justify-content:space-between;font-size:14px;margin:10px 0 2px}
.big{font-size:40px;font-weight:720;line-height:1} .timer{font-variant-numeric:tabular-nums;font-weight:650}
.timer.low{color:var(--no)}
a{color:var(--acc)}
.disc{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.5}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog>i{display:block;height:100%;background:var(--acc)}
.err{border-color:var(--no)} .err h3{color:var(--no)}
</style></head>

<script>
const CERT = {"id": "CCAO-F", "title": "Claude Certified Associate – Foundations", "exam": {"items": 60, "minutes": 120, "scale_max": 1000, "pass_score": 720, "note": "multiple-choice and multiple-response; scaled score"}, "blueprint_weights_pct": {"D1 Prompting & Task Execution": 14, "D2 Output Evaluation & Validation": 21, "D3 Product & Model Selection": 12, "D4 Workflow Integration & Solution Design": 16, "D5 Configuration & Knowledge Management": 12, "D6 Governance, Risk & Responsible Use": 15, "D7 Troubleshooting & Optimisation": 10}, "bonus_group": "bonus:current-models", "key_provenance": "verified 2026-09-30: blind independent solve (4 agents + reviewer) agreed 210/210 with the bank's stated keys; spot-checks Q4/Q31/Q74 grounded against the Agent Factory curriculum connector", "counts": {"total": 210, "blueprint": 200, "bonus": 10, "multi_response": 16}, "questions": [{"n": 1, "domain": "D1 Prompting & Task Execution", "stem": "A marketing manager asks Claude: \"Write something about our product launch.\" The output is generic. What is the single highest-impact fix?", "options": {"A": "Switch to a larger, more capable model before rephrasing the prompt", "B": "Supply the audience, product specifics, channel, tone, and length", "C": "Split the request across ten short, separate chat messages", "D": "Resend the same request and ask Claude to try harder this time"}, "answer": ["B"], "multi": false, "rationale": "Generic input produces generic output, so specificity of context is the first lever to pull before changing models or retrying. A bigger model (C) still gets no direction, and splitting into ten messages (D) fragments the task without adding detail."}, {"n": 2, "domain": "D1 Prompting & Task Execution", "stem": "Which prompt is best structured for a business analysis task?", "options": {"A": "\"Please review all the attached sales figures and detail everything important you find.\"", "B": "\"From Q3 data, list the 3 top-declining lines with a cause and fix each, in a table.\"", "C": "\"Analyze our sales data and give me a thorough summary of the key points.\"", "D": "\"Act as a world-class analyst and tell me everything notable about our sales.\""}, "answer": ["B"], "multi": false, "rationale": "C specifies the input, scope, deliverable, and format. Flattery (B) sets a persona but no task constraints, and open-ended maximalism (A, D) leaves Claude to guess what matters."}, {"n": 3, "domain": "D1 Prompting & Task Execution", "stem": "A user needs Claude to produce a 40-page employee handbook. The best approach is:", "options": {"A": "Approve an outline first, then generate it section by section", "B": "Upload a competitor's handbook and have Claude rework it into yours", "C": "Generate the whole handbook twice and merge the two drafts together", "D": "Request the entire 40-page handbook from a single, detailed prompt"}, "answer": ["A"], "multi": false, "rationale": "Decomposing the task and approving structure before content catches misinterpretation early and keeps each generation within quality limits. A single mega-prompt (A) degrades over length, and copying a competitor's handbook (D) is an IP problem."}, {"n": 4, "domain": "D1 Prompting & Task Execution", "stem": "What is the main purpose of giving Claude examples of desired output (few-shot prompting)?", "options": {"A": "It shows format, tone, and detail more precisely than words", "B": "It is a required step, without which Claude will not respond", "C": "It makes each response noticeably longer and more comprehensive", "D": "It reduces the token cost of running the prompt each time"}, "answer": ["A"], "multi": false, "rationale": "Examples communicate implicit requirements that are hard to state in words. They are optional, not required (C), and adding examples increases rather than reduces token count (D)."}, {"n": 5, "domain": "D1 Prompting & Task Execution", "stem": "A prompt returns an answer in the wrong format. The fastest correction is:", "options": {"A": "Reply with the exact format you want, plus a short example", "B": "Report the formatting problem to support as a product bug", "C": "Send the identical prompt again and hope the format changes", "D": "Start a brand-new conversation and describe the task again"}, "answer": ["A"], "multi": false, "rationale": "Iterating in-conversation preserves context and corrects the specific miss. A fresh chat (A) throws away context, and an identical prompt (D) tends to reproduce the same output."}, {"n": 6, "domain": "D1 Prompting & Task Execution", "stem": "For a brainstorming task, which instruction improves results most?", "options": {"A": "\"List 20 varied ideas — bold, cheap, conventional — judge none yet.\"", "B": "\"Brainstorm as you like, but compress the whole reply into one sentence.\"", "C": "\"Be as imaginative and genuinely original as you can possibly manage.\"", "D": "\"Think it through and give me the single strongest idea you have.\""}, "answer": ["A"], "multi": false, "rationale": "Brainstorming benefits from explicit quantity, diversity axes, and deferred judgment. Asking for one idea (A) or one sentence (D) collapses the space, and 'be creative' (C) is not an operational instruction."}, {"n": 7, "domain": "D1 Prompting & Task Execution", "stem": "Which element is MISSING from this prompt? \"Summarize the attached 30-page contract for our operations team.\"", "options": {"A": "The length or depth the summary should hit", "B": "The audience the summary is written for", "C": "The input document to be summarized", "D": "The action verb telling Claude what to produce"}, "answer": ["A"], "multi": false, "rationale": "The input (contract), audience (operations team), and task verb (summarize) are all stated; only the length or depth is missing, so the output could be one paragraph or ten pages."}, {"n": 8, "domain": "D1 Prompting & Task Execution", "stem": "When asking Claude to draft a sensitive email declining a partnership, the best practice is to:", "options": {"A": "Give the context and tone, then review before sending", "B": "Avoid using Claude for sensitive emails like this one", "C": "Send Claude's very first draft to the partner without edits", "D": "Ask Claude to send the finished email to them for you"}, "answer": ["A"], "multi": false, "rationale": "Claude drafts, but the human owns context, judgment, and the send decision. Sending the first draft blind (A) risks tone errors, and avoiding Claude entirely (D) forfeits a useful drafting aid."}, {"n": 9, "domain": "D1 Prompting & Task Execution", "stem": "A user wants analysis of a problem before recommendations. Which instruction achieves this?", "options": {"A": "\"Skip straight to the recommendations without the analysis.\"", "B": "\"Just be logical and rigorous as you work through the whole thing.\"", "C": "\"List factors and constraints, analyze each, then recommend.\"", "D": "\"Think as hard as you possibly can before answering.\""}, "answer": ["C"], "multi": false, "rationale": "Explicitly sequencing the reasoning steps in the prompt shapes the response structure. Jumping to recommendations (A) skips the requested analysis, and vague exhortations to be logical or think hard (C, D) don't impose an order."}, {"n": 10, "domain": "D1 Prompting & Task Execution", "stem": "What does \"iterating a prompt\" mean in practice?", "options": {"A": "Copying one prompt into several separate chats at once", "B": "Adding more words to the prompt each time no matter what", "C": "Resending the exact same prompt until the answer finally changes", "D": "Refining instructions over turns to fix the prior output"}, "answer": ["D"], "multi": false, "rationale": "Iteration is targeted correction based on what the last output got wrong. Resending unchanged (A) or padding with words regardless of results (D) is repetition, not refinement."}, {"n": 11, "domain": "D1 Prompting & Task Execution", "stem": "For a research task (\"What are current trends in retail logistics?\"), which addition most improves reliability?", "options": {"A": "\"Sound confident and authoritative throughout.\"", "B": "\"Answer only from what you already know.\"", "C": "\"Format the whole answer as bullet points.\"", "D": "\"Search the web and cite each source you use.\""}, "answer": ["D"], "multi": false, "rationale": "Current-state questions need current sources, and citations make the output checkable. Answering from memory alone (B) risks stale or invented facts, and confidence or formatting (C, D) do nothing for accuracy."}, {"n": 12, "domain": "D1 Prompting & Task Execution", "stem": "A user pastes a long document and asks three unrelated questions in one message. Outputs are shallow. Better approach:", "options": {"A": "Tell Claude to work faster through all three at once", "B": "Delete the document and then ask the three questions", "C": "Ask each question separately, letting one finish first", "D": "Ask all three again, this time written in capital letters"}, "answer": ["C"], "multi": false, "rationale": "One task per turn gets full attention per question; bundling unrelated questions dilutes depth. Capitals (A) and demands for speed (D) don't change the dilution, and deleting the document (C) removes the needed context."}, {"n": 13, "domain": "D1 Prompting & Task Execution", "stem": "Which negative constraint is most useful when asking Claude to edit a report?", "options": {"A": "\"Avoid any phrasing that sounds obviously AI-generated.\"", "B": "Don't change the numbers or the section order; edit only for clarity.", "C": "\"Please don't let it come across as dull or boring to read.\"", "D": "\"Don't spend too much of your time on this one.\""}, "answer": ["B"], "multi": false, "rationale": "A concrete prohibition protects exactly what must not change (figures and ordering). Vague bans on being boring, slow, or 'AI-sounding' (A, C, D) aren't enforceable or measurable."}, {"n": 14, "domain": "D1 Prompting & Task Execution", "stem": "A prompt for competitive analysis should include which of the following? (Select TWO)", "options": {"A": "The dimensions to compare: pricing, features, position", "B": "A courteous apology for taking up Claude's time", "C": "A demand that Claude guarantee its figures are accurate", "D": "Which specific competitors to include in the analysis"}, "answer": ["A", "D"], "multi": true, "rationale": "Scope (which competitors) and comparison structure (the dimensions) define the deliverable. A guarantee of accuracy (B) can't be honored and apologies (D) add nothing."}, {"n": 15, "domain": "D1 Prompting & Task Execution", "stem": "The main benefit of assigning Claude a role (\"Act as an experienced HR compliance reviewer\") is:", "options": {"A": "It unlocks hidden features that are otherwise inaccessible", "B": "It sets the perspective, priorities, and vocabulary used", "C": "It turns off Claude's built-in safety guardrails for you", "D": "It makes Claude legally qualified to advise in that field"}, "answer": ["B"], "multi": false, "rationale": "Role framing shapes the lens, priorities, and vocabulary applied to the task. It grants no credentials (C), unlocks no hidden features (A), and does not disable safety behavior (D)."}, {"n": 16, "domain": "D1 Prompting & Task Execution", "stem": "A user wants meeting notes converted into action items. The strongest prompt specifies:", "options": {"A": "\"Read these notes carefully and turn them into something genuinely useful for the team.\"", "B": "\"Go through all the notes and pull out every action item you can find.\"", "C": "\"Identify each task mentioned anywhere across these meeting notes.\"", "D": "\"Table the action items — owner, task, deadline; label unclear owners 'Unassigned'.\""}, "answer": ["D"], "multi": false, "rationale": "Structure (the table columns) plus an explicit uncertainty rule ('Unassigned, don't guess') prevents invented owners. The others ask for extraction but set no format and no rule for missing owners."}, {"n": 17, "domain": "D1 Prompting & Task Execution", "stem": "When is it appropriate to tell Claude the purpose behind a task, not just the task?", "options": {"A": "Usually; purpose guides emphasis and detail", "B": "Only after the first attempt has already failed", "C": "Only when the task is a creative or artistic one", "D": "Never, since the purpose is irrelevant to the output"}, "answer": ["A"], "multi": false, "rationale": "Purpose lets Claude make better judgment calls on emphasis and detail; 'summarize this for a board vote' differs from a bare 'summarize.' It is not limited to creative tasks (C) or to failures (D), and it is never irrelevant (A)."}, {"n": 18, "domain": "D1 Prompting & Task Execution", "stem": "Which task-type pairing is correct?", "options": {"A": "Analysis → forbid Claude from showing any of its reasoning steps", "B": "Brainstorming → insist on exactly one idea and no more", "C": "Drafting → ask for a few structures first when stakes are high", "D": "Research → prohibit Claude from citing any of its sources"}, "answer": ["C"], "multi": false, "rationale": "For high-stakes drafts, comparing structures before writing avoids polishing the wrong document. Forbidding reasoning (B), banning citations (C), and demanding a single idea (D) each defeat the purpose of their task type."}, {"n": 19, "domain": "D1 Prompting & Task Execution", "stem": "A user asks Claude to \"make this shorter\" and gets a version missing a key point. The best next prompt:", "options": {"A": "\"Scrap all of this and rewrite the entire thing again.\"", "B": "\"That version dropped the one key point I actually needed from it.\"", "C": "\"Trim to ~200 words; keep the pricing change and deadline.\"", "D": "\"Please cut it down even shorter than that last version.\""}, "answer": ["C"], "multi": false, "rationale": "Compression needs stated preservation constraints, so Claude knows what to protect while cutting. Asking only for 'shorter' (A), merely naming the problem (C), or starting over (D) leaves the cut choices to Claude again."}, {"n": 20, "domain": "D1 Prompting & Task Execution", "stem": "Multi-step instruction quality: which is best for processing 50 customer complaints?", "options": {"A": "\"Read through every one of these and tell me in detail what you make of them.\"", "B": "\"Sort each as billing/product/service/other, count them, list the 3 worst with a reply.\"", "C": "\"Please go right ahead and handle each of these complaints for me yourself.\"", "D": "\"Skim through each of them and just tell me whether they seem mostly negative overall to you.\""}, "answer": ["B"], "multi": false, "rationale": "B defines the categorization scheme, the aggregation, and the drill-down deliverable. The others give no scheme and no structured output, so the result is an undirected impression."}, {"n": 21, "domain": "D1 Prompting & Task Execution", "stem": "Why place long reference material before the question in a prompt rather than after?", "options": {"A": "It is strictly required, or else Claude returns an error", "B": "It meaningfully reduces the token cost of the call", "C": "It makes no difference to the output in any case", "D": "Instructions placed after the material stay salient"}, "answer": ["D"], "multi": false, "rationale": "Document-first, question-last is standard guidance for long-context prompting: the instruction that follows the material stays salient. It is a recommendation, not an error-forcing requirement (A), and ordering doesn't change token cost (C)."}, {"n": 22, "domain": "D1 Prompting & Task Execution", "stem": "A user wants Claude to critique their business plan honestly. Which instruction works best?", "options": {"A": "\"Please reassure me that this business plan is a fundamentally strong one.\"", "B": "\"Just hand the whole thing a single score out of ten.\"", "C": "\"Share whatever general thoughts you might happen to have about it.\"", "D": "\"Name the 3 biggest weaknesses and the toughest investor objection.\""}, "answer": ["D"], "multi": false, "rationale": "Requesting specific, adversarial critique overrides the default toward diplomacy. Asking for reassurance (A) invites flattery, open-ended thoughts (C) stay vague, and a bare score (D) carries no reasoning."}, {"n": 23, "domain": "D1 Prompting & Task Execution", "stem": "What is the correct expectation when giving Claude a word count (\"exactly 500 words\")?", "options": {"A": "Output will be roughly that length; verify if exact", "B": "Giving a word count tends to make the output worse", "C": "Claude cannot control output length at all, ever", "D": "Output will land on exactly 500 words every single time"}, "answer": ["A"], "multi": false, "rationale": "Length instructions steer approximately, so an exact count needs verification. Claude does influence length (so not C), and a word count does not degrade quality (D)."}, {"n": 24, "domain": "D1 Prompting & Task Execution", "stem": "A recruiter wants interview questions for a role. The prompt should include: (Select TWO)", "options": {"A": "The interview stage and the time available", "B": "A request for Claude to decide who to hire", "C": "The job description or the key competencies", "D": "The candidate's astrological sign and birthday"}, "answer": ["A", "C"], "multi": true, "rationale": "Competencies and the stage/time window define relevant, well-scoped questions. Astrology (B) is irrelevant, and the hiring decision (D) stays with the human."}, {"n": 25, "domain": "D1 Prompting & Task Execution", "stem": "\"Chain of thought\" style prompting (\"work through this step by step\") is most valuable for:", "options": {"A": "Copying a provided block of text word for word", "B": "Simple one-step factual lookups or quick definitions", "C": "Multi-step reasoning: calculations and tradeoffs", "D": "Short greetings, pleasantries, and small talk"}, "answer": ["C"], "multi": false, "rationale": "Explicit stepwise reasoning helps where intermediate steps can go wrong, such as calculations and tradeoff analysis. It adds nothing to lookups, verbatim copying, or greetings."}, {"n": 26, "domain": "D1 Prompting & Task Execution", "stem": "A user needs the same report generated weekly with new data. The efficient prompting approach:", "options": {"A": "Save a prompt template; supply only new data weekly", "B": "Switch to a different tool to handle the recurring report", "C": "Rewrite the entire prompt from scratch each week", "D": "Trust that Claude remembers last week's version of it"}, "answer": ["A"], "multi": false, "rationale": "Templatize what is stable (structure and rules) and vary only the input. Rewriting weekly (A) is wasted effort, and separate chats don't share memory by default (C)."}, {"n": 27, "domain": "D1 Prompting & Task Execution", "stem": "Which is a realistic limitation to design prompts around?", "options": {"A": "Claude only understands and responds in the English language", "B": "Claude cannot write anything longer than a single paragraph", "C": "Claude flatly refuses to take on any business-related task at all", "D": "Claude may assert plausible but false specifics; require sourcing"}, "answer": ["D"], "multi": false, "rationale": "Confabulated specifics are the characteristic failure, so prompts should require sourcing or flagging of uncertainty. Claude handles business tasks, writes long outputs, and works in many languages, so B, C, and D are false."}, {"n": 28, "domain": "D1 Prompting & Task Execution", "stem": "The instruction \"If any information needed is missing, ask me before proceeding\" is valuable because:", "options": {"A": "It turns silent assumptions into explicit questions", "B": "It completely prevents every possible error", "C": "It slows the whole task down for no real benefit at all", "D": "It is a required piece of prompt syntax to include"}, "answer": ["A"], "multi": false, "rationale": "The alternative to asking is guessing, and this instruction surfaces the guess as a question. It is not required syntax (C) and cannot prevent all errors (D)."}, {"n": 29, "domain": "D2 Output Evaluation & Validation", "stem": "Claude produces a market report citing \"a 2024 McKinsey study\" with specific percentages. Before using it, you should:", "options": {"A": "Ask Claude whether it is confident the figures are right", "B": "Locate the actual study; cited numbers can be invented", "C": "Trust it, since it names a specific-sounding source", "D": "Drop the citation but keep the percentages as given"}, "answer": ["B"], "multi": false, "rationale": "Plausible citations with specific numbers are a classic hallucination pattern, so find the source itself. Keeping numbers without the source (C) hides the problem, and 'are you sure' (D) often gets confident reaffirmation, not verification."}, {"n": 30, "domain": "D2 Output Evaluation & Validation", "stem": "What is a hallucination in AI output?", "options": {"A": "Any answer that you personally happen to disagree with here", "B": "Confident, plausible content that is false or invented", "C": "A formatting or layout glitch in the output text", "D": "A response that takes far too long to arrive"}, "answer": ["B"], "multi": false, "rationale": "A hallucination is confident, plausible-sounding content that is factually false or invented; the danger is precisely that it reads as true. Disagreement, formatting, and latency are unrelated."}, {"n": 31, "domain": "D2 Output Evaluation & Validation", "stem": "Which output element carries the HIGHEST verification priority before external use?", "options": {"A": "Where the paragraph breaks fall across the text", "B": "The tone and the overall voice of the writing", "C": "The particular synonyms chosen throughout the piece", "D": "Specific facts: numbers, dates, names, citations"}, "answer": ["D"], "multi": false, "rationale": "Specific facts (numbers, dates, names, quotes, citations, legal claims) are where fabrication does damage. Tone, paragraphing, and word choice are visible and cheap to fix."}, {"n": 32, "domain": "D2 Output Evaluation & Validation", "stem": "Claude summarizes a contract you uploaded. The most reliable spot-check is:", "options": {"A": "Ask Claude to rate the quality of its own summary", "B": "Check the summary carefully for grammar and spelling", "C": "Ask a second AI model to review the summary for you", "D": "Check its clause claims against the actual contract"}, "answer": ["D"], "multi": false, "rationale": "The ground truth is the source document, so compare the summary's clause claims to it. Self-rating (A) and a second model (C) can share the same blind spots, and grammar (D) isn't the risk."}, {"n": 33, "domain": "D2 Output Evaluation & Validation", "stem": "A response contains an internal contradiction (says revenue rose in one paragraph, fell in another). This indicates:", "options": {"A": "The entire output has to be discarded altogether", "B": "One claim is wrong; verify which against the source", "C": "Both of the contradictory claims are somehow true", "D": "It signals a billing or account problem on your side"}, "answer": ["B"], "multi": false, "rationale": "A contradiction localizes the verification work to the conflicting claims; at least one is wrong. It doesn't invalidate everything (A), both can't hold (C), and it isn't a billing issue (D)."}, {"n": 34, "domain": "D2 Output Evaluation & Validation", "stem": "When must a human review Claude's output before it's used? (Select TWO)", "options": {"A": "When it carries legal, medical, or financial content", "B": "Never, since reviewing output defeats the entire purpose", "C": "When it goes out externally or drives a decision", "D": "When it is only a private brainstorm meant for you"}, "answer": ["A", "C"], "multi": true, "rationale": "Stakes (external use or consequential decisions) and domain risk (legal, medical, financial, compliance) determine review. A private brainstorm (C) is low-stakes, and 'never review' (D) ignores risk entirely."}, {"n": 35, "domain": "D2 Output Evaluation & Validation", "stem": "Claude gives a confident answer about an event from last month. Your first consideration:", "options": {"A": "Knowledge has a cutoff; recent events need a source", "B": "Recent events are always captured in the training data", "C": "Confidence is a reliable signal of its accuracy", "D": "Ask Claude to express even more confidence in it"}, "answer": ["A"], "multi": false, "rationale": "Claude's knowledge has a training cutoff, so recent events need a current source before you trust the answer. Tone does not track recency (A), and recent events are not guaranteed to be in training data (C)."}, {"n": 36, "domain": "D2 Output Evaluation & Validation", "stem": "A completeness check on a \"summary of all action items in this transcript\" means:", "options": {"A": "Scanning the source for items the summary left out", "B": "Counting the total words in the finished summary", "C": "Asking Claude whether it finished the whole job", "D": "Reading the whole summary through for overall fluency"}, "answer": ["A"], "multi": false, "rationale": "Omissions are invisible in the output, so you find them only by scanning the transcript for items the summary missed. Reading for fluency, counting words, or asking Claude don't surface what's absent."}, {"n": 37, "domain": "D2 Output Evaluation & Validation", "stem": "Which is an example of bias to check for in Claude-assisted hiring content?", "options": {"A": "Criteria that disadvantage a protected group without job relevance", "B": "A heavy reliance on bullet-point formatting throughout the whole piece", "C": "Organizing the whole thing into neatly formatted tables", "D": "Using very short, clipped sentences all the way through"}, "answer": ["A"], "multi": false, "rationale": "Evaluation includes checking that generated screening criteria are job-relevant and non-discriminatory. Formatting choices like bullets, tables, or sentence length are stylistic, not bias."}, {"n": 38, "domain": "D2 Output Evaluation & Validation", "stem": "Claude drafts a press release with a quote attributed to your CEO that the CEO never said. Correct handling:", "options": {"A": "Publish it, since it sounds just like the CEO", "B": "Shorten the fabricated quote before you publish", "C": "Remove it, or have the CEO approve the quote first", "D": "Reattribute it to 'an unnamed company spokesperson'"}, "answer": ["C"], "multi": false, "rationale": "An invented attributed quote is a serious misrepresentation until the named person endorses it, no matter how plausible it sounds. Shortening (C) or reattributing (D) still publishes words no one said."}, {"n": 39, "domain": "D2 Output Evaluation & Validation", "stem": "The best general rule for calibrating trust in Claude's output:", "options": {"A": "Trust it by verifiability and the cost of an error", "B": "Trust everything that comes from any paid plan tier", "C": "Trust it based on how long the response runs", "D": "Trust nothing, and never use any of the output"}, "answer": ["A"], "multi": false, "rationale": "Verification effort should track how easily you can check a claim and how much a mistake costs. Blanket trust (A) and blanket distrust (C) both waste value, and length (D) is meaningless."}, {"n": 40, "domain": "D2 Output Evaluation & Validation", "stem": "You ask Claude to compare two supplier proposals. To evaluate the comparison, you should first confirm:", "options": {"A": "That the comparison table has visible borders drawn", "B": "That each figure it cites appears in that proposal", "C": "That it ended up favoring the cheaper supplier", "D": "That it came in at exactly 500 words, as asked"}, "answer": ["B"], "multi": false, "rationale": "Attribution accuracy is the foundation: a beautifully reasoned comparison of wrong numbers is worthless. Word count, which supplier won, and table borders are irrelevant to correctness."}, {"n": 41, "domain": "D2 Output Evaluation & Validation", "stem": "Claude produces math in a financial summary. The appropriate validation is:", "options": {"A": "Round every figure off to keep the summary simpler", "B": "Assume the arithmetic in it is always going to be correct", "C": "Recompute the key figures instead of trusting them", "D": "Check only the single largest number in the summary"}, "answer": ["C"], "multi": false, "rationale": "Arithmetic in generated text can be wrong even when the method is right, so reconcile the figures with a spreadsheet or calculator. Assuming correctness (B), checking one number (C), or rounding (D) leaves errors in place."}, {"n": 42, "domain": "D2 Output Evaluation & Validation", "stem": "Which statement about \"the output sounds authoritative\" is correct?", "options": {"A": "A hesitant-sounding answer is always a wrong one", "B": "Tone and accuracy are independent; fluency isn't proof", "C": "An authoritative tone is strong evidence of real accuracy", "D": "Formal outputs can safely skip the review step"}, "answer": ["B"], "multi": false, "rationale": "Fluency is the model's baseline, present in right and wrong answers alike, so tone and accuracy are independent. A confident tone isn't evidence (A), a hesitant one isn't proof of error (C), and formality doesn't excuse review (D)."}, {"n": 43, "domain": "D2 Output Evaluation & Validation", "stem": "A colleague pastes Claude's answer into a client deliverable without review, and it contains an error. The process failure is:", "options": {"A": "Not running the draft through a second AI model to cross-check it", "B": "Omitting the human review step before the content went external", "C": "Trusting the client to flag any mistakes during their own reading", "D": "Relying on an AI tool for a client deliverable in the first place"}, "answer": ["B"], "multi": false, "rationale": "The workflow, not the tool, is at fault: externally-used content bypassed human validation. Using Claude (A) is fine with review; the client (C) and a second model (D) are not the owner of that check."}, {"n": 44, "domain": "D2 Output Evaluation & Validation", "stem": "You need Claude's research output to be checkable. Which instruction helps most?", "options": {"A": "Keep the prose clean by leaving citations and caveats out of it.", "B": "Cite a source for each factual claim and flag any point you're unsure of.", "C": "State every conclusion with full confidence and no hedging at all.", "D": "Give me only the key findings up front and skip all the supporting explanation."}, "answer": ["B"], "multi": false, "rationale": "Sourcing plus flagged uncertainty turns a monolithic answer into one a reader can trace and check; brevity (B), forced confidence (C), and removing citations (D) all reduce checkability."}, {"n": 45, "domain": "D2 Output Evaluation & Validation", "stem": "When adapting a Claude draft for a new audience (engineers to executives), what changes?", "options": {"A": "Depth, framing, and vocabulary: lead with impact, compress detail", "B": "Nothing of substance — the same content serves any reader equally", "C": "The underlying facts are adjusted to suit the new audience's view", "D": "Only surface wording such as the greeting and the sign-off line"}, "answer": ["A"], "multi": false, "rationale": "Audience adaptation restructures emphasis, depth, and vocabulary while the facts stay constant. Content is not audience-neutral (A), the change runs deeper than greetings (C), and altering the facts (D) is distortion, not adaptation."}, {"n": 46, "domain": "D2 Output Evaluation & Validation", "stem": "Comparing two Claude drafts of the same memo, the right basis for choosing is:", "options": {"A": "Whichever Claude produced first, as the truest attempt", "B": "Whichever runs longer and covers more ground on the page", "C": "Whichever reads as more sophisticated and formal in style", "D": "Whichever better serves the stated purpose and audience"}, "answer": ["D"], "multi": false, "rationale": "Evaluation is against the memo's purpose and audience, not surface proxies like length (A), generation order (C), or formality (D)."}, {"n": 47, "domain": "D2 Output Evaluation & Validation", "stem": "Claude states \"Section 8.2 of the contract allows termination with 30 days' notice.\" Verification means:", "options": {"A": "Trusting the claim because the full contract was uploaded first", "B": "Asking Claude to restate the clause again to confirm it stays fully consistent.", "C": "Confirming that a Section 8.2 exists somewhere in the document", "D": "Opening Section 8.2 in the contract and reading the clause yourself"}, "answer": ["D"], "multi": false, "rationale": "Even with the document provided, clause-level legal claims are read at the source. A restatement (B) can repeat the same error, and the section merely existing (C) or the file being uploaded (D) confirms nothing about the interpretation."}, {"n": 48, "domain": "D2 Output Evaluation & Validation", "stem": "Which output is LOWEST risk to use without deep verification?", "options": {"A": "Alternative phrasings for an internal survey you'll edit anyway", "B": "A financial model the board will rely on for a decision", "C": "A regulatory compliance summary being sent to an outside client", "D": "Health guidance distributed to employees in a newsletter"}, "answer": ["A"], "multi": false, "rationale": "Low stakes plus a built-in human review make the survey phrasings safe; the others are high-consequence domains (regulatory, financial, health) where errors are costly."}, {"n": 49, "domain": "D2 Output Evaluation & Validation", "stem": "\"Determine when additional verification is required\" — which situations qualify? (Select TWO)", "options": {"A": "The output happens to arrive formatted neatly as a table", "B": "The claim is surprising or contradicts what you believed true", "C": "The claim will be repeated publicly under your own name", "D": "The claim merely restates something that is already common knowledge to you."}, "answer": ["B", "C"], "multi": true, "rationale": "Surprise and public exposure under your name both raise the verification bar; well-known facts (C) need less scrutiny, not more, and formatting (D) is irrelevant to truth."}, {"n": 50, "domain": "D2 Output Evaluation & Validation", "stem": "A generated competitor analysis includes a competitor that doesn't exist. What likely happened, and what does it teach?", "options": {"A": "Claude invented a plausible entity; lists need existence checks", "B": "Your own industry knowledge has simply fallen out of date here", "C": "A harmless slip not worth acting on — just move past it quietly", "D": "It's a real but secretive firm you simply had not heard of yet"}, "answer": ["A"], "multi": false, "rationale": "Plausible-entity invention is a known failure mode; verify that listed things are real before verifying details about them. It is not a hidden firm (A), not your knowledge gap (C), and not safe to ignore (D)."}, {"n": 51, "domain": "D2 Output Evaluation & Validation", "stem": "The best way to use Claude to check Claude's own work:", "options": {"A": "Ask it to score its own output on a scale out of one hundred", "B": "Have it critique the draft against explicit criteria afresh", "C": "Never ask it to review its own work under any circumstances", "D": "It is fully reliable as the auditor of its own output"}, "answer": ["B"], "multi": false, "rationale": "Structured self-critique against stated criteria catches real issues but cannot certify factual truth — source verification is still required. Treating it as a reliable auditor (A) or refusing self-review entirely (C) both miss that balance, and a bare score (D) carries no reasoning."}, {"n": 52, "domain": "D2 Output Evaluation & Validation", "stem": "Which output format decision is correct?", "options": {"A": "A reusable doc the user will edit and share belongs in an artifact", "B": "The output format makes no real difference to how it is used", "C": "Every output is best delivered as a block of formatted code", "D": "A one-line reply to a quick factual question belongs in its own saved artifact."}, "answer": ["A"], "multi": false, "rationale": "Keep-and-edit content belongs in a persistent, editable artifact; throwaway answers stay inline (A), not everything is code (C), and format choice does affect usability (D)."}, {"n": 53, "domain": "D2 Output Evaluation & Validation", "stem": "Claude translates a customer email into another language. Before sending to the customer:", "options": {"A": "Send it right away, since machine translation is deterministic", "B": "Attach a disclaimer noting the text was machine-translated", "C": "Round-trip it through translation ten times to stabilize it", "D": "Have a fluent speaker review it when the stakes warrant it"}, "answer": ["D"], "multi": false, "rationale": "Machine translation is strong, but review scales with the cost of a nuance or tone error. Immediate send (A) ignores that risk, round-tripping (C) degrades rather than checks, and a disclaimer (D) doesn't fix a mistranslation."}, {"n": 54, "domain": "D2 Output Evaluation & Validation", "stem": "A report generated from your uploaded data cites a statistic NOT in the data. The correct conclusion:", "options": {"A": "Claude pulled it from a live web search run automatically", "B": "Your uploaded dataset is missing rows that it should contain", "C": "A statistic that reads as precise does not need a source cited", "D": "It came from the model, not your data, so source it or cut it"}, "answer": ["D"], "multi": false, "rationale": "Anything not traceable to the provided source is unsourced whatever its origin; it was not an automatic web lookup (A), does not imply your data is faulty (C), and precision never substitutes for a source (D)."}, {"n": 55, "domain": "D2 Output Evaluation & Validation", "stem": "\"Curate and organise information\" in this domain means:", "options": {"A": "Archiving every chat permanently for later reference, retrieval, and reuse.", "B": "Accepting the output as delivered and passing it along as-is", "C": "Sorting every item alphabetically before putting it to use", "D": "Selecting what's relevant and restructuring it for the use case"}, "answer": ["D"], "multi": false, "rationale": "The associate's job is editorial: select, restructure, and discard filler before output moves downstream. Passing it through unchanged (A), mechanical sorting (C), or hoarding chats (D) is not curation."}, {"n": 56, "domain": "D2 Output Evaluation & Validation", "stem": "Which is a sound spot-check strategy for a long generated document?", "options": {"A": "Read the introduction closely and then trust the remainder", "B": "Skip checking entirely when it looks polished and professional", "C": "Verify the highest-stakes claims fully, then skim the rest", "D": "Check every line with exactly equal effort and attention"}, "answer": ["C"], "multi": false, "rationale": "Risk-weighted sampling concentrates effort where errors are expensive, then skims for contradictions and omissions. Reading only the intro (A), uniform effort (C), and skipping on appearance (D) all misallocate scrutiny."}, {"n": 57, "domain": "D2 Output Evaluation & Validation", "stem": "Claude's summary of a meeting attributes a decision to the wrong person. The likely cause and fix:", "options": {"A": "A deliberate error showing the tool is untrustworthy, so you should stop using it.", "B": "Ambiguous transcript attribution; fix it and flag uncertain cases", "C": "The named person misreported what they had actually decided", "D": "Summaries are simply unable to attribute statements to names"}, "answer": ["B"], "multi": false, "rationale": "Attribution errors from ambiguous sources are predictable: correct the summary and, going forward, instruct Claude to mark uncertain attributions rather than guess. It is not malice (A), not the person's dishonesty (C), and summaries can attribute by name (D)."}, {"n": 58, "domain": "D2 Output Evaluation & Validation", "stem": "For fact-checking a claim Claude made about a law, the strongest source is:", "options": {"A": "The primary source — the statute or an official publication", "B": "A widely shared social media thread discussing the law", "C": "How confidently Claude phrased the original legal claim", "D": "A second AI chatbot asked the very same legal question for a cross-check."}, "answer": ["A"], "multi": false, "rationale": "Primary and official sources outrank derivative ones; another model (A) can share the same error, social media (C) is unauthoritative, and confidence (D) is not evidence."}, {"n": 59, "domain": "D2 Output Evaluation & Validation", "stem": "What does it mean that verification cost should be \"proportionate\"?", "options": {"A": "Skip verification entirely for anything that is low in cost", "B": "Verification time is always billed to the client by the hour", "C": "Match verification depth to the consequence of being wrong", "D": "Verify every output at maximum depth, every single time"}, "answer": ["C"], "multi": false, "rationale": "Verification depth should track consequence — a tweet draft and a regulatory filing don't warrant the same scrutiny. Blanket maximum effort (A) wastes the productivity gain, and never checking cheap items (C) ignores stakes."}, {"n": 60, "domain": "D2 Output Evaluation & Validation", "stem": "Claude produces a beautifully structured answer about your company's internal policy — but the policy was never provided to it. The answer is:", "options": {"A": "Correct as long as it is cleanly and professionally formatted", "B": "Probably accurate, since Claude broadly understands how most companies work.", "C": "Binding on the company once it has been written down somewhere", "D": "A plausible generic draft, not your policy — supply the real one"}, "answer": ["D"], "multi": false, "rationale": "Without the source, Claude produces the archetype, not your reality. General knowledge of companies (A), good formatting (D), or being written down (C) does not make it your actual policy."}, {"n": 61, "domain": "D2 Output Evaluation & Validation", "stem": "An output for an executive contains hedged language on every sentence. The right edit:", "options": {"A": "Keep hedges only where real uncertainty exists; state facts plainly", "B": "Strip out every hedge, including the genuinely uncertain claims", "C": "Add still further hedging so that no single claim can ever sound overstated.", "D": "Keep every hedge in place, since hedging is a form of honesty"}, "answer": ["A"], "multi": false, "rationale": "Calibrated language flags uncertainty where it's real and states verified facts with confidence; keeping all hedges (A) or stripping them all (C) both miscalibrate, and adding more (D) worsens it."}, {"n": 62, "domain": "D2 Output Evaluation & Validation", "stem": "Which pair correctly matches an error type to its detection method?", "options": {"A": "Arithmetic error detected by reading the passage slowly aloud", "B": "Wrong tone detected by recomputing the underlying figures again", "C": "Omission detected by reading the output on its own, in isolation", "D": "Fabricated citation detected by checking the reference itself"}, "answer": ["D"], "multi": false, "rationale": "Each error type has a matching check; a fabricated citation is caught at the reference (it exists AND supports the claim). Omissions need the source, not the output alone (A); tone isn't found by recomputing (C); arithmetic isn't found by reading aloud (D)."}, {"n": 63, "domain": "D2 Output Evaluation & Validation", "stem": "A multiple-response evaluation habit worth building: before accepting an output, ask — (Select TWO)", "options": {"A": "\"Does every claim trace to a source I can point to?\"", "B": "\"Did it affirm the assumptions built into my question?\"", "C": "\"What specifically would make this answer wrong?\"", "D": "\"Is it long enough to look thorough and complete?\""}, "answer": ["A", "C"], "multi": true, "rationale": "Adversarial reading (\"what would make this wrong?\") and traceability (\"does every claim trace to a source?\") are the core evaluation moves; length (C) and agreeableness (D) are false signals of quality."}, {"n": 64, "domain": "D2 Output Evaluation & Validation", "stem": "Claude gives medical-adjacent advice for an HR wellness newsletter. The associate should:", "options": {"A": "Publish it as written, since it is only a wellness newsletter", "B": "Treat health content as high-risk and route it through review", "C": "Reword it to sound more confident and clinically authoritative", "D": "Label it as \"AI-generated\" and then publish it unchanged"}, "answer": ["B"], "multi": false, "rationale": "Domain risk (health) elevates review regardless of apparent quality — verify against authoritative sources and/or qualified review before publishing. A disclaimer (C) or a more confident tone (D) does not reduce the underlying risk."}, {"n": 65, "domain": "D2 Output Evaluation & Validation", "stem": "The difference between \"editing\" and \"validating\" Claude's output:", "options": {"A": "A careful edit makes a separate validation step unnecessary", "B": "They are two names for one and the same single review pass", "C": "Validation applies only to generated code and not to prose", "D": "Editing improves expression; validating confirms it's true"}, "answer": ["D"], "multi": false, "rationale": "Polish and truth are separate passes, both required before external use; a well-edited falsehood is worse, not better. They are not identical (A), validation isn't code-only (C), and editing never substitutes for it (D)."}, {"n": 66, "domain": "D2 Output Evaluation & Validation", "stem": "Claude produced ten customer-reply drafts. The efficient quality process:", "options": {"A": "Discard all ten and rewrite every reply again from scratch", "B": "Define acceptance criteria once, then review each against them", "C": "Send all ten out unread in order to save the review time", "D": "Review one draft closely and then assume the other nine all match it well."}, "answer": ["B"], "multi": false, "rationale": "Criteria-based review (accuracy, policy compliance, tone) scales across the batch. Sending unread (A) skips review, rewriting all (C) wastes the drafts, and sampling one (D) is insufficient when each goes to a different customer."}, {"n": 67, "domain": "D2 Output Evaluation & Validation", "stem": "Why is \"the output matched my expectations\" an incomplete validation standard?", "options": {"A": "Confirmation bias: agreeable output gets under-scrutinized", "B": "It is in fact the strongest validation standard available", "C": "Your prior expectations are nearly always mistaken about this sort of thing.", "D": "Expectations can never be written down clearly in advance"}, "answer": ["A"], "multi": false, "rationale": "Agreeable errors are the ones most likely to survive review; validation should check against sources, not your priors. Expectations aren't always wrong (A), aren't the gold standard (C), and can be stated (D)."}, {"n": 68, "domain": "D2 Output Evaluation & Validation", "stem": "An output cites a real report but misstates its finding. This error is:", "options": {"A": "The report's own fault for having been written unclearly first", "B": "A misattribution — the source is real but doesn't back the claim", "C": "Acceptable, because the underlying report does genuinely exist", "D": "Impossible once the cited report has been confirmed to genuinely exist first."}, "answer": ["B"], "multi": false, "rationale": "Verification has two levels — the source exists AND it says what's claimed; checking existence alone misses a misstated finding. A real source (A, C) doesn't excuse the misreading, and it's the citation's error, not the report's (D)."}, {"n": 69, "domain": "D2 Output Evaluation & Validation", "stem": "For data analysis output, \"sanity checking\" means:", "options": {"A": "Reviewing the chart colors and visual styling for clarity", "B": "Running the identical analysis a second time over to check for consistency.", "C": "Testing plausibility: do totals reconcile and percentages sum?", "D": "Literally asking Claude whether its own analysis is sound"}, "answer": ["C"], "multi": false, "rationale": "Cheap plausibility checks — totals reconcile, percentages sum, direction matches known reality — catch gross errors before detailed review; styling (A), self-queries (C), and reruns (D) don't test correctness."}, {"n": 70, "domain": "D2 Output Evaluation & Validation", "stem": "The single most important mindset for Domain 2:", "options": {"A": "Claude's output is a competent first draft, unverified as yet", "B": "Claude's output is a finished product that is ready to use", "C": "Claude's output is usually biased or even deliberately misleading to readers.", "D": "Claude's output needs no human owner once it is generated"}, "answer": ["A"], "multi": false, "rationale": "The right framing — a competent first draft whose specifics are unverified until checked — drives every correct behavior in the domain; treating output as finished (A), as malicious (C), or as ownerless (D) all fail."}, {"n": 71, "domain": "D3 Product & Model Selection", "stem": "Which lists Claude's model tiers from LEAST to MOST capable (and typically least to most costly)?", "options": {"A": "Opus, then Sonnet, then Haiku", "B": "Haiku, then Sonnet, then Opus", "C": "The three tiers are all equal", "D": "Sonnet, then Haiku, then Opus"}, "answer": ["B"], "multi": false, "rationale": "Haiku is the smallest/cheapest, Sonnet mid, Opus the most capable — so least-to-most is Haiku, Sonnet, Opus. The reverse ordering and the 'all equal' option are wrong."}, {"n": 72, "domain": "D3 Product & Model Selection", "stem": "For classifying thousands of short support tickets by category, the sensible model choice is:", "options": {"A": "A fast, economical model, since the task is simple and high-volume", "B": "A different AI vendor assigned to handle each incoming support ticket in turn.", "C": "The most powerful model available, regardless of its cost", "D": "No model at all — categorize every ticket by hand instead"}, "answer": ["A"], "multi": false, "rationale": "Match capability to task complexity: simple, high-volume classification is where a fast, cheap tier wins. Top-tier reasoning (A) is overkill, manual work (C) doesn't scale, and vendor-switching (D) adds chaos."}, {"n": 73, "domain": "D3 Product & Model Selection", "stem": "For a complex strategic analysis with multi-step reasoning and high stakes, choose:", "options": {"A": "Whatever model happens to be set as the current default", "B": "The cheapest model, then skipping any later review of the output.", "C": "The fastest model, so the analysis comes back quickly", "D": "The most capable tier, accepting higher cost and latency"}, "answer": ["D"], "multi": false, "rationale": "Quality-critical, complexity-heavy tasks justify the top tier despite cost and latency; speed-first (A), defaulting (C), and cheap-plus-no-review (D) trade away the quality the task demands."}, {"n": 74, "domain": "D3 Product & Model Selection", "stem": "What is a Claude Project primarily for?", "options": {"A": "Editing, rendering, and exporting video files directly inside the application.", "B": "Handling single, isolated one-off questions on their own", "C": "Serving as a full replacement for a team's email system", "D": "Grouping related chats with shared instructions and knowledge"}, "answer": ["D"], "multi": false, "rationale": "Projects persist shared custom instructions and knowledge sources across the chats inside them; they aren't for one-off questions (A), and video editing (C) and email replacement (D) aren't features."}, {"n": 75, "domain": "D3 Product & Model Selection", "stem": "When should a user prefer a Project over a plain chat?", "options": {"A": "When they want their answers hidden from other users", "B": "Never — a plain chat is always the better tool to reach for here.", "C": "When they'll reuse the same context, documents, and rules", "D": "Only when the work involves writing or debugging code"}, "answer": ["C"], "multi": false, "rationale": "Recurring context — same documents, standing instructions, ongoing work — is the trigger; one-off questions don't need it, it isn't coding-only (C), and Projects aren't a privacy mechanism (D)."}, {"n": 76, "domain": "D3 Product & Model Selection", "stem": "Research mode (deep/extended research) is best suited for:", "options": {"A": "Fixing a single typo in a short block of existing text", "B": "Casual back-and-forth chatting that carries no real research need behind it.", "C": "Multi-source questions needing broad research and a cited report", "D": "A quick arithmetic question such as \"what is 15% of 80?\""}, "answer": ["C"], "multi": false, "rationale": "Research mode trades time for breadth and synthesis across many sources with citations; trivial arithmetic (A), a typo fix (C), and casual chat (D) don't warrant it."}, {"n": 77, "domain": "D3 Product & Model Selection", "stem": "Artifacts are most appropriate when:", "options": {"A": "The output is substantial standalone content to edit or share", "B": "The user is working offline with no network connection open", "C": "Nothing from the generated response needs to be saved or reused later at all.", "D": "The answer is a single sentence or a quick one-line reply"}, "answer": ["A"], "multi": false, "rationale": "Artifacts separate durable, standalone work products — documents, webpages, apps the user will edit, iterate on, or share — from conversational flow; a one-liner (A), throwaway content (C), or being offline (D) don't call for one."}, {"n": 78, "domain": "D3 Product & Model Selection", "stem": "A user's very long conversation starts producing responses that ignore early instructions. The most likely cause:", "options": {"A": "The chat has outgrown the context window, diluting early turns", "B": "The internet connection has dropped out mid-conversation", "C": "The underlying model has quietly swapped itself out for another one.", "D": "Claude has become offended by the user's tone over time"}, "answer": ["A"], "multi": false, "rationale": "Context is finite; long sessions degrade recall of early turns as content is lost or diluted. Models don't take offense (A), a dropped connection (C) would stop replies entirely, and the model doesn't swap itself (D)."}, {"n": 79, "domain": "D3 Product & Model Selection", "stem": "The right response to the situation in Q78:", "options": {"A": "Keep going in the same chat and hope that it recovers on its own", "B": "Retype the early instructions again in all capital letters", "C": "Summarize the key context and seed a fresh conversation with it", "D": "Tell Claude you're frustrated and wait for it to fix itself"}, "answer": ["C"], "multi": false, "rationale": "Restart-with-summary — or persisting standing context into Project instructions — is the standard context-management move; carrying on (A), shouting in caps (C), or complaining (D) don't restore the lost context."}, {"n": 80, "domain": "D3 Product & Model Selection", "stem": "\"Align model selection with task requirements\" means weighing: (Select TWO)", "options": {"A": "The task's complexity against the model's capability", "B": "The output quality needed against the cost and the speed", "C": "The day of the week on which the request is made", "D": "How appealing or impressive the model's name sounds to the end user."}, "answer": ["A", "B"], "multi": true, "rationale": "Selection is a cost/speed/quality/complexity tradeoff — quality against cost/speed, and complexity against capability; a model's name (B) and the calendar (D) are irrelevant."}, {"n": 81, "domain": "D3 Product & Model Selection", "stem": "For drafting routine internal emails all day, the practical tier choice is:", "options": {"A": "No model, since none can draft a routine email acceptably", "B": "Always the top model, for the best possible wording each time", "C": "Rotate randomly among the tiers for each separate email sent", "D": "A fast mid- or low-tier model, as the quality gap is marginal"}, "answer": ["D"], "multi": false, "rationale": "Routine drafting is where cheaper tiers earn their keep — the quality difference is marginal and speed compounds over the day; the top model (A) is overkill, models can draft email (C), and random rotation (D) is arbitrary."}, {"n": 82, "domain": "D3 Product & Model Selection", "stem": "Which pairing of feature to need is WRONG?", "options": {"A": "Project paired with recurring work that shares a set of documents", "B": "Artifact paired with a reusable policy document being drafted", "C": "Research mode paired with a deep, multi-source market study", "D": "Research mode paired with converting a date between time zones"}, "answer": ["D"], "multi": false, "rationale": "Research mode on a trivial timezone conversion wastes its multi-source machinery; the other three correctly match feature to need (Project for recurring shared-doc work, Research mode for a deep market study, Artifact for a reusable document)."}, {"n": 83, "domain": "D3 Product & Model Selection", "stem": "A user asks whether uploading a 200-page document \"uses up\" the conversation. Correct understanding:", "options": {"A": "Uploaded documents carry no context cost whatsoever at all", "B": "Only images, and never text documents, consume any context", "C": "Uploads consume context, so scope them to what the task needs", "D": "Uploading a document deletes the existing conversation history"}, "answer": ["C"], "multi": false, "rationale": "Everything in the conversation — uploads included — occupies the same finite context, so a huge document plus a long chat can hit limits; uploads aren't free (A), don't delete the chat (C), and text counts, not just images (D)."}, {"n": 84, "domain": "D3 Product & Model Selection", "stem": "Project custom instructions differ from a per-message prompt because they:", "options": {"A": "Override anything the user types in a given later message", "B": "Expire automatically after one hour and must be reset again", "C": "Apply automatically across every chat in the Project", "D": "Are written in more grammatically correct language overall"}, "answer": ["C"], "multi": false, "rationale": "Persistence across the Project's chats without retyping is the point; instructions aren't about grammar (B), don't override the user's own messages (C), and don't expire hourly (D)."}, {"n": 85, "domain": "D3 Product & Model Selection", "stem": "When does starting a NEW conversation beat continuing the current one?", "options": {"A": "Whenever a single reply comes back longer than expected", "B": "On a fixed cadence, every few messages regardless of topic", "C": "Only once the current chat reaches its length limit", "D": "When you switch to a task unrelated to the current thread"}, "answer": ["D"], "multi": false, "rationale": "Fresh tasks deserve fresh context: residue from an unrelated prior task causes drift, so a new conversation wins. Length limits, a fixed cadence, or reply length are not the trigger."}, {"n": 86, "domain": "D3 Product & Model Selection", "stem": "A team wants consistent Claude behavior across members working the same account. The feature-level answer:", "options": {"A": "A shared Project with agreed instructions and knowledge sources", "B": "Have each member pick a different model and compare results", "C": "Have every member memorize and paste the same prompt by hand", "D": "Email finished outputs around so everyone can copy the same format"}, "answer": ["A"], "multi": false, "rationale": "A shared Project centralizes the configuration so consistency does not depend on each person's memory or discipline."}, {"n": 87, "domain": "D3 Product & Model Selection", "stem": "\"Cost\" in model selection for a chat-plan user primarily shows up as:", "options": {"A": "Quota consumption and the time heavier modes take", "B": "Itemized per-token invoices attached to each chat reply", "C": "Nothing measurable, since chat plans are effectively unlimited", "D": "Separate shipping and handling fees billed each session"}, "answer": ["A"], "multi": false, "rationale": "Even without per-call billing, capacity (usage limits/quota) and latency are the real costs a chat-plan user pays."}, {"n": 88, "domain": "D3 Product & Model Selection", "stem": "Which task most clearly justifies research mode over a single web search?", "options": {"A": "\"Compare telehealth regulation across five states, with sources.\"", "B": "\"Check the spelling of the word 'necessary' for me.\"", "C": "\"Give a short one-sentence definition of the term return on investment.\"", "D": "\"List this company's current CEO and headquarters city.\""}, "answer": ["A"], "multi": false, "rationale": "Multi-jurisdiction synthesis with citations is the multi-source, multi-step case research mode exists for; the others are single lookups."}, {"n": 89, "domain": "D3 Product & Model Selection", "stem": "The relationship between model tier and hallucination risk:", "options": {"A": "Hallucination is a setting you can switch off per chat", "B": "Cheaper models are reliably more accurate than premium ones", "C": "Top-tier models never fabricate, so verification is unnecessary", "D": "Stronger models err less, but no tier eliminates fabrication"}, "answer": ["D"], "multi": false, "rationale": "Model selection changes the error rate, not the need to verify: no tier removes fabrication, so verification stays required."}, {"n": 90, "domain": "D3 Product & Model Selection", "stem": "A user needs to share a polished one-page summary with a colleague who doesn't use Claude. Best output route:", "options": {"A": "Read the summary aloud to them over a quick call", "B": "Send a screenshot of the chat window showing the summary text", "C": "Add the colleague to your chat so they can scroll it", "D": "Produce it as a document and export it into their format"}, "answer": ["D"], "multi": false, "rationale": "Durable, exportable formats travel to people outside the tool; chat transcripts and screenshots do not."}, {"n": 91, "domain": "D3 Product & Model Selection", "stem": "\"Memory considerations\" for chat products mean:", "options": {"A": "Context is stored inside the artifacts that a chat produces", "B": "Claude always remembers everything across chats, with no user control", "C": "Nothing ever persists across chats, not even within a Project", "D": "It varies by feature; standing context lives in Projects or memory"}, "answer": ["D"], "multi": false, "rationale": "The tested skill is knowing WHERE context persists: standing context belongs in Project instructions/knowledge or memory features, not in an assumption that separate chats share history."}, {"n": 92, "domain": "D3 Product & Model Selection", "stem": "For quickly triaging which of 30 documents deserve deep analysis, an efficient pattern is:", "options": {"A": "Deep-analyze only the first document and extrapolate to all the rest", "B": "Skip the whole batch and ask the team to summarize them", "C": "Use a fast model to rank relevance, then deep-dive the shortlist", "D": "Run full deep analysis on all 30 with the top-tier model"}, "answer": ["C"], "multi": false, "rationale": "Tiered processing uses cheap breadth to rank, then expensive depth only on the shortlist."}, {"n": 93, "domain": "D3 Product & Model Selection", "stem": "A user complains Opus-class responses are \"slow\" for their lookup tasks. Correct advice:", "options": {"A": "Tell the model to hurry and skip its intermediate reasoning", "B": "Use a faster tier for lookups, not a heavy reasoning model", "C": "The slowness is a defect; the model needs resetting or replacing", "D": "Stop using AI for lookups and go back to doing them by hand"}, "answer": ["B"], "multi": false, "rationale": "Latency on light tasks is a model-selection problem: reserve the heavy model for work that needs its reasoning."}, {"n": 94, "domain": "D3 Product & Model Selection", "stem": "What does it mean to \"persist\" context deliberately?", "options": {"A": "Repeat the exact same instructions, only louder, in every new message", "B": "Keep the browser tab open so the session never resets", "C": "Email the whole chat transcript to yourself each day", "D": "Move durable requirements into Project instructions or saved files"}, "answer": ["D"], "multi": false, "rationale": "Persistence is a design decision: durable requirements go into Project instructions, uploaded knowledge, or saved documents so they outlive one conversation."}, {"n": 95, "domain": "D4 Workflow Integration & Solution Design", "stem": "The first step in integrating Claude into an existing business process is:", "options": {"A": "Automate the entire process on the very first day", "B": "Purchase additional software before analyzing anything", "C": "Remove the team members those process steps rely on", "D": "Map the process and find steps suited to AI assistance"}, "answer": ["D"], "multi": false, "rationale": "Fit-to-task analysis (which drafting/analysis/synthesis steps suit AI) precedes deployment; not every step benefits."}, {"n": 96, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which process step is the BEST first candidate for Claude assistance?", "options": {"A": "Authorizing outbound wire transfers to vendors", "B": "Final legal sign-off on binding client agreements and contracts", "C": "First drafts of routine documents a human already reviews", "D": "Deciding which employees to terminate this quarter"}, "answer": ["C"], "multi": false, "rationale": "High-volume drafting with an existing human review step is low-risk, high-yield; the others are consequence-heavy decision points."}, {"n": 97, "domain": "D4 Workflow Integration & Solution Design", "stem": "\"Augment vs. redesign\" a workflow: which describes AUGMENT?", "options": {"A": "The existing process is deleted and nothing at all takes its place", "B": "The whole process is outsourced to an external vendor", "C": "Claude slots into existing steps while the process stays intact", "D": "Claude replaces the whole process and all its reviewers"}, "answer": ["C"], "multi": false, "rationale": "Augmentation inserts Claude into existing steps and keeps the process shape and controls; redesign rebuilds the process around new capabilities."}, {"n": 98, "domain": "D4 Workflow Integration & Solution Design", "stem": "A sensible pilot design for introducing Claude to a proposal-writing team:", "options": {"A": "One team, defined tasks, success metrics, and a decision gate", "B": "Pilot it indefinitely with no decision point or stopping rule", "C": "Roll it out quietly while tracking no success metrics", "D": "Make it mandatory across the whole company immediately"}, "answer": ["A"], "multi": false, "rationale": "A real pilot has bounded scope, measurable outcomes (time saved, quality scores, error rates), a fixed review process, and a checkpoint to decide on expansion."}, {"n": 99, "domain": "D4 Workflow Integration & Solution Design", "stem": "Using Claude for requirements analysis means:", "options": {"A": "Treat requirements work as unsuitable for any AI help", "B": "Claude structures input, flags gaps, and drafts requirements", "C": "Let Claude unilaterally decide what the business actually needs", "D": "Skip the stakeholders entirely and infer the requirements"}, "answer": ["B"], "multi": false, "rationale": "Claude accelerates structuring stakeholder input and surfacing gaps/ambiguities; humans validate what is actually needed."}, {"n": 100, "domain": "D4 Workflow Integration & Solution Design", "stem": "When communicating Claude's value to skeptical stakeholders, the strongest approach:", "options": {"A": "Demo it beating one clever trick question in the meeting", "B": "Show measured results, honest limits, and review controls", "C": "Present only the upside and never mention any limitations", "D": "Promise it never makes mistakes so trust comes easily"}, "answer": ["B"], "multi": false, "rationale": "Credibility comes from measured results plus honestly stated limits and the review controls that catch errors; overselling collapses at the first mistake."}, {"n": 101, "domain": "D4 Workflow Integration & Solution Design", "stem": "A weekly workflow: gather updates → compile status report → distribute. Where does Claude fit best?", "options": {"A": "Nowhere useful; it adds no value to this workflow", "B": "Compiling raw updates into the standard report format", "C": "Deciding the project's priorities on its own each week", "D": "Taking over the project manager's full role entirely"}, "answer": ["B"], "multi": false, "rationale": "The compilation step is mechanical synthesis; owner review before distribution keeps judgment and accountability human."}, {"n": 102, "domain": "D4 Workflow Integration & Solution Design", "stem": "Which is a realistic time-savings claim structure for a business case?", "options": {"A": "\"Drafting fell from ~3h to ~45min, measured over 20 docs.\"", "B": "\"AI makes every task instant and effort-free for us.\"", "C": "\"Our main competitors are all already adopting it widely too.\"", "D": "\"It simply feels much faster than the old way did.\""}, "answer": ["A"], "multi": false, "rationale": "Specific, measured, review-inclusive numbers survive scrutiny; feelings, instant-everything claims, and competitor pressure do not."}, {"n": 103, "domain": "D4 Workflow Integration & Solution Design", "stem": "Using Claude for process optimisation, a good prompt pattern is:", "options": {"A": "\"Here's our invoicing steps; find bottlenecks, rank fixes.\"", "B": "\"Just fix whatever happens to be wrong with my company for me.\"", "C": "\"Optimize our operations however you see fit.\"", "D": "\"Are our current business processes any good?\""}, "answer": ["A"], "multi": false, "rationale": "The process must be described, and the ask must name analysis dimensions (bottlenecks, redundancy, risky handoffs) plus a ranked, effort-vs-impact deliverable."}, {"n": 104, "domain": "D4 Workflow Integration & Solution Design", "stem": "\"Human-in-the-loop\" placement should be at:", "options": {"A": "Only once, right at the very beginning of the flow", "B": "At random, unplanned points scattered through the whole workflow", "C": "Nowhere at all, in order to save on review time", "D": "Consequence points where output leaves or commits the org"}, "answer": ["D"], "multi": false, "rationale": "Review belongs where errors become expensive or irreversible: output leaving the organization, committing resources, or affecting people."}, {"n": 105, "domain": "D4 Workflow Integration & Solution Design", "stem": "A department wants Claude for customer-facing chat responses. The associate's correct guidance includes: (Select TWO)", "options": {"A": "Monitor response quality with sampling and feedback loops", "B": "Judge success only by how many replies get auto-sent", "C": "Automate fully from day one with no monitoring at all in place", "D": "Draft-then-human-send is safer than fully automated replies"}, "answer": ["A", "D"], "multi": true, "rationale": "Graduated autonomy (draft-then-send) plus quality monitoring is right; full unmonitored automation of customer contact is premature, and auto-send volume is a vanity metric."}, {"n": 106, "domain": "D4 Workflow Integration & Solution Design", "stem": "Claude can support solution design by:", "options": {"A": "Physically attending each of the design review meetings for the team", "B": "Signing off on the final vendor contracts for the build", "C": "Comparing options, drafting specs, and stress-testing designs", "D": "Approving the project budget allocated to the design work"}, "answer": ["C"], "multi": false, "rationale": "Design support means generating/comparing alternatives, drafting specs, and adversarial \"what could go wrong\" review; approvals and contracts stay human."}, {"n": 107, "domain": "D4 Workflow Integration & Solution Design", "stem": "A workflow produces inconsistent Claude outputs across team members. The systematic fix:", "options": {"A": "Let the inconsistency simply continue completely unaddressed", "B": "Standardize on shared templates or a common Project", "C": "Blame the most junior person and move on from it", "D": "Ban the tool from the team's workflow entirely"}, "answer": ["B"], "multi": false, "rationale": "Variance comes from unstandardized inputs: shared prompt templates or a shared Project with common instructions and sample outputs fix the inputs."}, {"n": 108, "domain": "D4 Workflow Integration & Solution Design", "stem": "ROI framing for a Claude workflow should count: (Select TWO)", "options": {"A": "Only the subscription cost, with none of the benefit side measured", "B": "Time saved on the assisted steps, net of review time", "C": "Reduction in errors and rework wherever it is measurable", "D": "The raw number of prompts the team members happen to type"}, "answer": ["B", "C"], "multi": true, "rationale": "Net time saved and quality effects are the benefit side; subscription-only accounting and activity counts are vanity metrics."}, {"n": 109, "domain": "D4 Workflow Integration & Solution Design", "stem": "When a stakeholder asks \"can Claude do our financial audit?\", the correct response shape:", "options": {"A": "\"Only if we keep it hidden from the regulator entirely.\"", "B": "\"It can accelerate parts, but sign-off stays with auditors.\"", "C": "\"No, AI has no useful role anywhere in finance work.\"", "D": "\"Yes, it can run the whole audit end to end entirely on its own.\""}, "answer": ["B"], "multi": false, "rationale": "Decompose to assistable sub-tasks (summarization, anomaly flagging for human investigation); the audit judgment, testing, and sign-off stay with qualified auditors."}, {"n": 110, "domain": "D4 Workflow Integration & Solution Design", "stem": "The purpose of documenting a Claude-assisted workflow (prompts used, review steps, owners) is:", "options": {"A": "Repeatability, onboarding, quality control, and auditability", "B": "Decoration with no real practical function whatsoever", "C": "Pointless paperwork that exists purely for its own sake alone", "D": "A deliberate way to slow the entire team down for show"}, "answer": ["A"], "multi": false, "rationale": "Undocumented workflows die with their inventor and cannot be audited; documentation makes them repeatable, teachable, and traceable."}, {"n": 111, "domain": "D4 Workflow Integration & Solution Design", "stem": "A manager wants to redesign their reporting process \"around\" Claude rather than bolting it on. The redesign question to ask first:", "options": {"A": "\"Which staff members should we cut first this week?\"", "B": "\"If drafting is near-free, which steps still earn their place?\"", "C": "\"What color scheme should the finished report use?\"", "D": "\"How do we keep every single step exactly the way it is right now?\""}, "answer": ["B"], "multi": false, "rationale": "Redesign re-derives the process from the new cost structure: when drafting and synthesis are near-free, which steps, approvals, and formats still justify themselves?"}, {"n": 112, "domain": "D4 Workflow Integration & Solution Design", "stem": "For research and planning support on a market-entry decision, Claude is best used to:", "options": {"A": "Make the final market-entry decision for leadership", "B": "Replace real market data with its own rough estimates", "C": "Guarantee that the market entry will definitely succeed outright", "D": "Compile sourced data, structure options, and draft the brief"}, "answer": ["D"], "multi": false, "rationale": "This is decision support, not decision making: sourcing keeps it verifiable, and risks plus a drafted decision document go to leadership."}, {"n": 113, "domain": "D4 Workflow Integration & Solution Design", "stem": "A team adopts Claude but review time now exceeds the drafting time saved. Diagnosis:", "options": {"A": "Poor ta
